services:
  - type: web
    name: hyper-video-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hyper-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: HYPER_ADS_ENABLED
        value: 'true'
      - key: HYPER_ADS_TEST
        value: 'false'
      - key: HYPER_VAST_AD_TAG_URL
        sync: false
    disk:
      name: hyper-media
      mountPath: /var/data
      sizeGB: 10
databases:
  - name: hyper-db
    plan: free
