function requestHyperAd(v){
  return new Promise(async resolve=>{
    try{
      const cfg=HYPER_FORCE_TEST_ADS?{enabled:true,ad_tag_url:HYPER_TEST_VAST_TAG,test:true}:await getHyperAdsConfig();
      if(!cfg?.enabled||!cfg?.ad_tag_url||!window.google?.ima){resolve(false);return}
      const wrap=document.getElementById('videoWrap'),overlay=document.getElementById('hyperAdOverlay');
      if(!wrap||!overlay){resolve(false);return}
      showHyperAdLoading();
      const c=hyperAdContainer(); if(!c){resolve(false);return} c.style.display='block';
      hyperAdsLoader=new google.ima.AdsLoader(hyperAdDisplayContainer);
      let settled=false,finish=x=>{if(settled)return;settled=true;resolve(x)};
      hyperAdsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,e=>{
        try{
          const l=document.getElementById('hyperAdLoading');if(l)l.style.display='none';
          hyperAdsManager=e.getAdsManager(v);hyperAdInFlight=true;
          hyperAdsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,()=>{logHyperAdEvent('error');clearHyperAdOverlay();hyperAdInFlight=false;finish(false);v.play().catch(()=>{})});
          hyperAdsManager.addEventListener(google.ima.AdEvent.Type.STARTED,()=>{const l=document.getElementById('hyperAdLoading');if(l)l.style.display='none';logHyperAdEvent('impression')});
          hyperAdsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE,()=>logHyperAdEvent('complete'));
          hyperAdsManager.addEventListener(google.ima.AdEvent.Type.SKIPPED,()=>logHyperAdEvent('skipped'));
          hyperAdsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED,()=>{clearHyperAdOverlay();hyperAdInFlight=false;finish(true);v.play().catch(()=>{})});
          hyperAdsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED,()=>{clearHyperAdOverlay();hyperAdInFlight=false;finish(true);v.play().catch(()=>{})});
          hyperAdsManager.init(Math.max(320,wrap.clientWidth),Math.max(180,v.clientHeight||360),google.ima.ViewMode.NORMAL);hyperAdsManager.start();
        }catch(err){clearHyperAdOverlay();hyperAdInFlight=false;finish(false);v.play().catch(()=>{})}
      },false);
      hyperAdsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,()=>{logHyperAdEvent('loader_error');clearHyperAdOverlay();hyperAdInFlight=false;finish(false);v.play().catch(()=>{})},false);
      const req=new google.ima.AdsRequest();req.adTagUrl=hyperAdTagWithCorrelator(cfg.ad_tag_url);req.linearAdSlotWidth=Math.max(320,wrap.clientWidth);req.linearAdSlotHeight=Math.max(180,v.clientHeight||360);req.nonLinearAdSlotWidth=Math.max(320,wrap.clientWidth);req.nonLinearAdSlotHeight=Math.max(90,Math.round((v.clientHeight||360)*.25));
      req.setAdWillAutoPlay?.(false);req.setAdWillPlayMuted?.(false);hyperAdsLoader.requestAds(req);
      setTimeout(()=>{if(!settled){clearHyperAdOverlay();hyperAdInFlight=false;finish(false);v.play().catch(()=>{})}},15000);
    }catch(e){clearHyperAdOverlay();hyperAdInFlight=false;resolve(false)}
  });
}

}

async function watchWithPreRoll(id, ev){
  try{ev?.stopPropagation?.()}catch(e){}
  const target=videoById(id)||videos.find(x=>String(x.id)===String(id));
  if(!target)return;
  // Short videos keep their direct-play behavior.
  if(target.type==='short'){await watch(id);return;}
  const old=currentHyperPlayer();
  try{old?.pause?.()}catch(e){}
  // The tap on the Home/Related card is the user gesture: initialize IMA now,
  // then open the selected video automatically after the ad finishes/skips.
  const cfg=HYPER_FORCE_TEST_ADS?{enabled:true,ad_tag_url:HYPER_TEST_VAST_TAG,test:true}:hyperAdsConfig;
  if(!cfg?.enabled||!cfg?.ad_tag_url||!window.google?.ima){
    await watch(id);
    setTimeout(()=>document.getElementById('player')?.play?.().catch?.(()=>{}),350);
    return;
  }
  const overlay=document.createElement('div');
  overlay.id='hyperPreRollOverlay';
  overlay.style.cssText='position:fixed;inset:70px 0 70px 0;background:rgba(0,0,0,.18);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding-top:24px;pointer-events:auto;';
  const wrap=document.createElement('div');
  wrap.style.cssText='position:relative;width:min(100vw,900px);aspect-ratio:16/9;height:auto;max-height:56.25vw;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #0008;';
  const av=document.createElement('video');
  av.id='hyperPreRollVideo';av.setAttribute('playsinline','');av.setAttribute('webkit-playsinline','');
  av.style.cssText='width:100%;height:100%;object-fit:contain;background:#000;';
  wrap.appendChild(av);overlay.appendChild(wrap);document.body.appendChild(overlay);
  let finished=false,loader=null,manager=null,display=null;
  const closeAndOpen=async()=>{
    if(finished)return; finished=true;
    try{manager?.destroy?.()}catch(e){} try{display?.destroy?.()}catch(e){}
    overlay.remove();
    await watch(id);
    setTimeout(()=>{
      const v=document.getElementById('player');
      if(v)v.play().catch(()=>{ showPlayWithAdButton(); });
    },350);
  };
  try{
    display=new google.ima.AdDisplayContainer(wrap,av);
    // This call is intentionally made directly from the card tap.
    display.initialize();
    loader=new google.ima.AdsLoader(display);
    loader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,e=>{
      try{
        manager=e.getAdsManager(av);
        manager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED,closeAndOpen);
        manager.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED,closeAndOpen);
        manager.addEventListener(google.ima.AdEvent.Type.SKIPPED,closeAndOpen);
        manager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,closeAndOpen);
        manager.init(Math.max(320,wrap.clientWidth),Math.max(180,wrap.clientHeight),google.ima.ViewMode.NORMAL);
        manager.start();
      }catch(err){closeAndOpen();}
    });
    loader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,closeAndOpen);
    const req=new google.ima.AdsRequest();
    req.adTagUrl=hyperAdTagWithCorrelator(cfg.ad_tag_url);
    req.linearAdSlotWidth=Math.max(320,wrap.clientWidth);
    req.linearAdSlotHeight=Math.max(180,wrap.clientHeight);
    req.nonLinearAdSlotWidth=Math.max(320,wrap.clientWidth);
    req.nonLinearAdSlotHeight=90;
    req.setAdWillAutoPlay?.(true);req.setAdWillPlayMuted?.(false);
    loader.requestAds(req);
    setTimeout(()=>closeAndOpen(),15000);
  }catch(e){closeAndOpen();}
}
function currentHyperPlayer(){return document.getElementById('player')||window.miniVideo||null}
async function openNativePiP(){
  const v=currentHyperPlayer(); if(!v)return;
  try{
    if(document.pictureInPictureElement){await document.exitPictureInPicture();return;}
    // A user tap on Mini Player is also a valid gesture: start the video first
    // so Android Chrome/Brave can enter PiP without the old 'play first' error.
    if(v.paused){try{await v.play()}catch(e){}}
    if(v.requestPictureInPicture){await v.requestPictureInPicture();return;}
    if(v.webkitSetPresentationMode){v.webkitSetPresentationMode('picture-in-picture');return;}
    // Web fallback: keep the same video in a draggable floating mini player.
    const box=ensureMiniContainer();
    const slot=box.querySelector('#miniSlot');
    if(slot && v.parentElement!==slot){slot.appendChild(v);v.style.borderRadius='0';v.dataset.videoId=String(selected?.id||'');window.miniVideo=v;}
    box.style.display='block';
  }catch(e){
    console.warn('PiP failed',e);
    // Do not show a blocking alert. Fall back to the in-page mini player.
    const box=ensureMiniContainer(),slot=box.querySelector('#miniSlot');
    if(slot && v.parentElement!==slot){slot.appendChild(v);v.style.borderRadius='0';v.dataset.videoId=String(selected?.id||'');window.miniVideo=v;}
    box.style.display='block';
  }
}
function setupHyperMediaSession(v){
  if(!v||!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:selected?.title||'HYPER Video',artist:selected?.channel||'HYPER',album:'HYPER'});
    const seekBy=10;
    navigator.mediaSession.setActionHandler('play',()=>v.play().catch(()=>{}));
    navigator.mediaSession.setActionHandler('pause',()=>v.pause());
    try{navigator.mediaSession.setActionHandler('seekbackward',d=>{v.currentTime=Math.max(0,v.currentTime-(d.seekOffset||seekBy))})}catch(e){}
    try{navigator.mediaSession.setActionHandler('seekforward',d=>{v.currentTime=Math.min(v.duration||Infinity,v.currentTime+(d.seekOffset||seekBy))})}catch(e){}
    try{navigator.mediaSession.setActionHandler('previoustrack',()=>{})}catch(e){}
    try{navigator.mediaSession.setActionHandler('nexttrack',()=>{})}catch(e){}
  }catch(e){console.warn('Media Session setup failed',e)}
}
async function enableBackgroundPlayback(){
  const v=currentHyperPlayer(); if(!v)return;
  setupHyperMediaSession(v);
  try{await openNativePiP()}catch(e){}
  if(!v.paused)return;
  v.play().catch(()=>{});
}
function keepHyperPlaybackAlive(){
  const v=currentHyperPlayer(); if(!v)return;
  setupHyperMediaSession(v);
  // Never pause the content video just because the page became hidden.
  // Android/Browser may still suspend a normal webpage; native PiP is the reliable route.
  if(document.visibilityState==='visible' && window._hyperWasPlaying && v.paused){v.play().catch(()=>{})}
}
function bindHyperBackgroundPlayback(v){
  if(!v||v.dataset.bgBound)return;
  v.dataset.bgBound='1';
  setupHyperMediaSession(v);
  v.addEventListener('play',()=>{window._hyperWasPlaying=true;setupHyperMediaSession(v);if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
  v.addEventListener('pause',()=>{window._hyperWasPlaying=false;if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
  v.addEventListener('ended',()=>{window._hyperWasPlaying=false;if('mediaSession' in navigator)navigator.mediaSession.playbackState='none'});
}

async function toggleVideoOrientation(){
  const v=document.getElementById('player'),wrap=document.getElementById('videoWrap');
  if(!v||!wrap)return;
  try{
    if(!document.fullscreenElement){
      await (wrap.requestFullscreen?.()||v.requestFullscreen?.());
    }
    let locked=false;
    try{
      if(screen.orientation?.lock){
        const cur=screen.orientation.type||'';
        await screen.orientation.lock(cur.includes('landscape')?'portrait':'landscape');
        locked=true;
      }
    }catch(e){}
    if(!locked){
      wrap.classList.toggle('hyper-landscape');
      v.classList.toggle('hyper-landscape-video');
    }
  }catch(e){
    // Some mobile browsers do not allow orientation locking. Do not show the old
    // "pehle fullscreen karein" alert; fullscreen itself is still available.
    try{await wrap.requestFullscreen?.()}catch{}
  }
}

async function watch(id){
  if(window.miniVideo&&String(window.miniVideo.dataset.videoId)!==String(id)){try{window.miniVideo.pause()}catch(e){}window.miniVideo=null;document.getElementById('miniPlayer')?.remove()}
  let found=videos.find(v=>String(v.id)===String(id));
  if(!found){try{found=await api('/videos/'+encodeURIComponent(id)+'?fresh='+Date.now())}catch(e){console.warn('Watch fetch failed',e)}}
  if(!found)return;
  selected={...found}; tab='watch'; setRoute({type:'watch',id:String(id)});
  safeSet('hyper_watch_id',String(id)); if(!safeGet('hyper_watch_pos')) safeSet('hyper_watch_pos','0');
  window._viewCounted=false; clearTimeout(window._viewTimer); await render();
  if(user)api('/videos/'+id+'/history',{method:'POST'}).catch(()=>{});
  setTimeout(()=>{
    let el=document.getElementById('player'); if(!el)return;
    const restore=()=>{
      const pos=Math.max(0,Number(safeGet('hyper_pos_'+id,safeGet('hyper_watch_pos','0')))||0);
      if(pos>0 && Number.isFinite(el.duration) && pos<el.duration-1){try{el.currentTime=pos}catch(e){}}
      let e=document.getElementById('playerError');if(e)e.innerHTML='';
    };
    el.onerror=()=>{let e=document.getElementById('playerError');if(e)e.innerHTML='Video load nahi ho raha. Network ya server storage check karein.'};
    el.onloadedmetadata=restore;
    el.onloadeddata=()=>{restore()};
    el.addEventListener('play',()=>{if(window._viewCounted)return;clearTimeout(window._viewTimer);window._viewTimer=setTimeout(()=>countView(id),5000)},{once:true});
    el.addEventListener('ended',()=>{if(!window._viewCounted)countView(id)},{once:true});
    el.addEventListener('timeupdate',()=>{if(selected&&String(selected.id)===String(id)&&el.currentTime>1){const pos=String(Math.floor(el.currentTime));safeSet('hyper_pos_'+id,pos);safeSet('hyper_watch_pos',pos)}},{passive:true});
    restore();
  },250); loadComments();
}

function commentCanManage(c){
  if(!user||!c)return {mine:false,videoOwner:false};
  const ids=[user.id,user.user_id,user.userId].filter(v=>v!=null).map(String);
  const cids=[c.user_id,c.author_id,c.owner_id,c.userId,c.authorId,c.author?.id,c.user?.id].filter(v=>v!=null).map(String);
  const emails=[user.email,user.user_email].filter(Boolean).map(v=>String(v).toLowerCase());
  const cemails=[c.email,c.user_email,c.author_email,c.author?.email,c.user?.email].filter(Boolean).map(v=>String(v).toLowerCase());
  const names=[user.username,user.display_name,user.channel_name,user.name].filter(Boolean).map(v=>String(v).trim().toLowerCase());
  const cnames=[c.username,c.user_username,c.display_name,c.author_username,c.author_name,c.author?.username,c.author?.display_name,c.user?.username,c.user?.display_name].filter(Boolean).map(v=>String(v).trim().toLowerCase());
  const mine=cids.some(x=>ids.includes(x)) || cemails.some(x=>emails.includes(x)) || cnames.some(x=>names.includes(x));
  const ownerIds=[selected?.user_id,selected?.owner_id,selected?.creator_id].filter(v=>v!=null).map(String);
  const videoOwner=ownerIds.some(x=>ids.includes(x));
  return {mine,videoOwner};
}
function commentMenu(c){

}

async function commentApi(id,method,body){
  const headers=body?{'Content-Type':'application/json'}:undefined;
  let firstErr=null;
  for(const path of ['/comments/'+id, '/comments/'+id+'/report', '/videos/'+selected.id+'/comments/'+id]){
    try{return await api(path,{method,headers,body:body?JSON.stringify(body):undefined})}
    catch(e){firstErr=e;if(e?.message&&!/404|not found/i.test(e.message))break;}
  }
  throw firstErr||new Error('Comment action failed');
}

  const text=prompt('Edit comment',c.text||''); if(text===null)return; const clean=text.trim(); if(!clean)return;
  try{await commentApi(id,'PUT',{text:clean});await loadComments()}catch(e){alert(e.message)}

async function reportComment(id){
  if(!user)return auth();
  const reason=prompt('Report reason (optional):','Inappropriate content'); if(reason===null)return;
  const body={reason:reason.trim()||'Reported by user'};
  try{
    await api('/comments/'+id+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    alert('Comment reported');
  }catch(e){
    // Keep the UI usable if the deployed backend has not added the report endpoint yet.
    // Do not show the confusing browser 404 dialog; mark the report on this device instead.
    if(/404|not found/i.test(e.message||'')){
      const key='hyper_reported_comments'; const arr=safeJSON(safeGet(key,'[]'),[]);
      if(!arr.includes(String(id)))arr.push(String(id)); safeSet(key,JSON.stringify(arr));
      alert('Comment reported');
    }else alert(e.message);
  }
}

async function like(id){
  if(!user)return auth();
  const v=videos.find(x=>String(x.id)===String(id))||selected;
  const btns=[...document.querySelectorAll('[data-like-video=\"'+CSS.escape(String(id))+'\"]')];
  const oldLikes=v?.likes||0;
  const wasLiked=!!(window._likedState&&window._likedState[id]);
  const nextLiked=!wasLiked,nextLikes=Math.max(0,oldLikes+(nextLiked?1:-1));
  window._likedState=window._likedState||{};window._likedState[id]=nextLiked;
  if(v)v.likes=nextLikes;if(selected&&String(selected.id)===String(id))selected.likes=nextLikes;
  btns.forEach(b=>b.textContent='👍 '+fmt(nextLikes));
  try{
    let r=await api('/videos/'+id+'/like',{method:'POST'});
    window._likedState[id]=!!r.liked;
    if(v)v.likes=r.likes;if(selected&&String(selected.id)===String(id))selected.likes=r.likes;
    document.querySelectorAll('[data-like-video=\"'+CSS.escape(String(id))+'\"]').forEach(b=>b.textContent='👍 '+fmt(r.likes));
  }catch(e){
    window._likedState[id]=wasLiked;if(v)v.likes=oldLikes;if(selected&&String(selected.id)===String(id))selected.likes=oldLikes;
    btns.forEach(b=>b.textContent='👍 '+fmt(oldLikes));alert(e.message)
  }
}

function downloadVideo(id){
 let v=videoById(id)||selected;if(!v)return;
 if(settingsState.wifiOnly&&navigator.connection&&!['wifi','ethernet'].includes(navigator.connection.type))return alert('Download on Wi‑Fi only is ON');
 const key=String(v.id),url=mediaUrl(v.video_url),title=(v.title||'HYPER-video').replace(/[^a-z0-9]/gi,'_')+'.mp4';
 if(downloadTasks.get(key)?.status==='downloading')return;
 const task={id:key,title:v.title||'HYPER video',progress:0,status:'downloading',message:'Downloading…'};downloadTasks.set(key,task);renderTransferDock();hyperSystemNotify('HYPER Download started',`${task.title} • 0%`,'hyper-download-'+key);
 const xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.responseType='blob';let lastLoaded=0,lastStamp=Date.now(),speed=0;
 xhr.onprogress=e=>{if(e.lengthComputable){task.progress=Math.min(99,Math.round(e.loaded/e.total*100));const now=Date.now(),sec=Math.max(.2,(now-lastStamp)/1000),bps=(e.loaded-lastLoaded)/sec;if(bps>0)speed=speed?(.7*speed+.3*bps):bps;lastLoaded=e.loaded;lastStamp=now;task.message=`Downloading… ${task.progress}%${speed>0?' • '+formatTransferRate(speed):''}`;renderTransferDock();if(task._notifyProgress!==task.progress&&(task.progress%5===0||Date.now()-(task._notifyStamp||0)>12000)){task._notifyProgress=task.progress;task._notifyStamp=Date.now();notifyTransferToSW('HYPER Downloading',`${task.title} • ${task.progress}%`,'hyper-download-'+key)}}};
 xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){const blob=xhr.response;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);task.progress=100;task.status='done';task.message='Download complete';hyperSystemNotify('HYPER Download complete',task.title,'hyper-download-'+key);let d=safeJSON(safeGet('hyper_downloads','[]'),[]);if(!d.some(x=>String(x.id)===key)){d.unshift(v);safeSet('hyper_downloads',JSON.stringify(d))}renderTransferDock();setTimeout(()=>{downloadTasks.delete(key);renderTransferDock()},3000)}else{task.status='error';task.message='Download failed (server/network)';renderTransferDock()}};
 xhr.onerror=()=>{task.status='error';task.message='Download failed — network/CORS problem';renderTransferDock()};
 xhr.onabort=()=>{task.status='error';task.message='Download cancelled';renderTransferDock()};
 xhr.send()
}

async function uploadEditCloudinaryFile(file,cfg,resourceType='image',progressCb){
  if(!file)return null;
  if(resourceType==='image'||file.size<=100*1024*1024){return await cloudinarySimpleUpload(file,cfg,resourceType,(loaded,total)=>progressCb?.(loaded,total))}
  const total=file.size,CHUNK=20*1024*1024,uploadId='hyper-edit-'+Date.now()+'-'+cryptoRandom();let final=null;
  for(let start=0;start<total;start+=CHUNK){const blob=file.slice(start,Math.min(total,start+CHUNK));let attempt=0;while(true){try{final=await cloudinaryChunkUpload(file,blob,start,total,uploadId,cfg,(loaded)=>progressCb?.(Math.min(total,start+loaded),total));break}catch(e){if(++attempt>=5)throw e;await new Promise(r=>setTimeout(r,800*Math.min(attempt,4)))}}}
  return final;
}
async function saveVideoEdit(id){

    const v=videoById(id)||selected;const payload={title,description,category};
    if(videoFile){
      if(prog)prog.textContent='🎬 Uploading new video… 0%';
      const cfg=await getCloudinaryConfig();const vr=await uploadEditCloudinaryFile(videoFile,cfg,'video',(loaded,total)=>{if(prog)prog.textContent=`🎬 Uploading new video… ${Math.floor((loaded/total)*100)}%`});
      if(!vr?.secure_url)throw new Error('New video upload failed');payload.video_url=vr.secure_url;payload.cloudinary_public_id=vr.public_id||'';
      const pv=document.getElementById('editVideoPreview');const duration=pv?.duration;if(Number.isFinite(duration)&&duration>0)payload.duration_seconds=Math.round(duration);
    }
    if(thumbFile){
      if(prog)prog.textContent='🖼️ Uploading new thumbnail…';
      const cfg=await getCloudinaryConfig();const tr=await uploadEditCloudinaryFile(thumbFile,cfg,'image');if(!tr?.secure_url)throw new Error('Thumbnail upload failed');payload.thumbnail_url=tr.secure_url;payload.cloudinary_thumbnail_public_id=tr.public_id||'';

let activeUploadXhrs=new Map(), uploadAbortControllers=new Map(), uploadRunning=new Set();
async function hyperSystemNotify(title,body,tag='hyper-transfer'){try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();if('serviceWorker' in navigator&&Notification.permission==='granted'){const r=await navigator.serviceWorker.ready;r.showNotification(title,{body,tag,icon:'/icon-192.png',badge:'/icon-192.png',renotify:false}).catch(()=>{})}}catch(e){}}
function notifyTransferToSW(title,body,tag){try{navigator.serviceWorker?.controller?.postMessage({type:'HYPER_NOTIFY',title,body,tag})}catch(e){}}

function formatTransferRate(bytesPerSec){if(!isFinite(bytesPerSec)||bytesPerSec<=0)return '';if(bytesPerSec>=1048576)return (bytesPerSec/1048576).toFixed(1)+' MB/s';return Math.max(1,Math.round(bytesPerSec/1024))+' KB/s'}
function openUploadDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('hyper-upload-queue',4);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('tasks'))db.createObjectStore('tasks',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function queueBackgroundUpload(task){const db=await openUploadDB();const record={...task,fileBlob:task.file||task.fileBlob||null,thumbnailBlob:task.thumbnail||task.thumbnailBlob||null,state:task.state||'waiting',chunk_size:Number(task.chunk_size)||20*1024*1024,progress:Number(task.progress)||0};delete record.file;delete record.thumbnail;await new Promise((resolve,reject)=>{const tx=db.transaction('tasks','readwrite');tx.objectStore('tasks').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function updateUploadRecord(id,patch={}){try{const db=await openUploadDB();await new Promise((resolve,reject)=>{const tx=db.transaction('tasks','readwrite'),st=tx.objectStore('tasks'),r=st.get(id);r.onsuccess=()=>{const x=r.result;if(!x)return resolve();st.put({...x,...patch});};r.onerror=()=>reject(r.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}}
function removeBackgroundUpload(id){openUploadDB().then(db=>{const tx=db.transaction('tasks','readwrite');tx.objectStore('tasks').delete(id);tx.oncomplete=()=>db.close()}).catch(()=>{})}
async function registerBackgroundSync(){try{let reg=await navigator.serviceWorker?.ready;if(reg?.sync?.register)await reg.sync.register('hyper-upload');return true}catch(e){return false}}
function uploadChunkWithProgress(url,headers,fd,onProgress){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();xhr.open('POST',url,true);
  Object.entries(headers||{}).forEach(([k,v])=>xhr.setRequestHeader(k,v));
  xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress?.(e.loaded,e.total)};
  const cleanup=()=>{for(const [k,v] of activeUploadXhrs){if(v===xhr)activeUploadXhrs.delete(k)}};
  xhr.onload=()=>{cleanup();let data={};try{data=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300)resolve(data);else reject(new Error(data.message||'Chunk upload failed ('+xhr.status+')'))};
  xhr.onerror=()=>{cleanup();reject(new Error('Network error during upload'))};
  xhr.onabort=()=>{cleanup();reject(new Error('Upload aborted'))};
  const key=String(Date.now())+'-'+Math.random();activeUploadXhrs.set(key,xhr);xhr.__hyperUploadKey=key;xhr.send(fd)
 })
}

async function getCloudinaryConfig(){const r=await api('/cloudinary/config');if(!r.enabled)throw new Error(r.message||'Cloudinary is not configured');return r}
function cloudinaryChunkUpload(file,chunk,start,total,uploadId,config,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',`https://api.cloudinary.com/v1_1/${encodeURIComponent(config.cloud_name)}/video/upload`,true);xhr.setRequestHeader('X-Unique-Upload-Id',uploadId);xhr.setRequestHeader('Content-Range',`bytes ${start}-${start+chunk.size-1}/${total}`);xhr.timeout=600000;let timer=null;xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress?.(e.loaded,e.total)};xhr.onload=()=>{clearTimeout(timer);let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300)resolve(d);else reject(new Error(d.error?.message||d.message||`Cloudinary upload failed (${xhr.status})`))};xhr.onerror=()=>{clearTimeout(timer);reject(new Error('Cloudinary network error'))};xhr.ontimeout=()=>{clearTimeout(timer);reject(new Error('Cloudinary upload timed out; retrying chunk'))};xhr.onabort=()=>{clearTimeout(timer);reject(new Error('Upload aborted'))};const fd=new FormData();fd.append('file',chunk,file.name);fd.append('upload_preset',config.upload_preset);fd.append('resource_type','video');xhr.send(fd)})}
async function cloudinarySimpleUpload(file,config,resourceType='image',onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',`https://api.cloudinary.com/v1_1/${encodeURIComponent(config.cloud_name)}/${resourceType}/upload`,true);xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress?.(e.loaded,e.total)};xhr.onload=()=>{let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300)resolve(d);else reject(new Error(d.error?.message||`Cloudinary upload failed (${xhr.status})`))};xhr.onerror=()=>reject(new Error('Cloudinary network error'));const fd=new FormData();fd.append('file',file);fd.append('upload_preset',config.upload_preset);xhr.send(fd)})}
async function uploadCloudinaryTask(q){
 if(uploadRunning.has(String(q.id)))return;
 const t=uploadTasks.find(x=>String(x.id)===String(q.id))||q;
 const file=q.file||q.fileBlob;
 if(!file||typeof file.slice!=='function'){t.status='error';t.message='Upload file not found. Please select the video again.';persistUploadTasks();renderUploadDock();return}
 uploadRunning.add(String(q.id));
 let lastUi=0,lastPersist=0,lastBytes=0,lastSpeedStamp=Date.now(),speed=0;
 const updateLive=(bytes,messagePrefix='Uploading…')=>{
   const now=Date.now(), pct=Math.min(95,Math.floor((bytes/file.size)*95));
   const dt=Math.max(1,now-lastSpeedStamp);
   if(now-lastSpeedStamp>=800){speed=Math.max(0,(bytes-lastBytes)/(dt/1000));lastBytes=bytes;lastSpeedStamp=now}
   const rate=formatTransferRate(speed);
   const eta=speed>0?Math.max(0,(file.size-bytes)/speed):0;
   const etaText=eta>0&&eta<86400?` • ${Math.ceil(eta/60)}m left`:'';
   t.progress=Math.max(Number(t.progress)||0,pct);
   t.message=`${messagePrefix} ${t.progress}% • Cloudinary${rate?` • ${rate}`:''}${etaText}`;
   if(now-lastUi>=250||pct>=95){lastUi=now;renderUploadDock()}
   if(now-lastPersist>=1000||pct>=95){lastPersist=now;persistUploadTasks()}
 };
 try{
   t.status='uploading';t.background=true;t.message='Connecting to Cloudinary…';persistUploadTasks();renderUploadDock();
   const cfg=(q.cloudinary_cloud_name&&q.cloudinary_upload_preset)?{cloud_name:q.cloudinary_cloud_name,upload_preset:q.cloudinary_upload_preset}:await getCloudinaryConfig();
   const total=file.size;

   // Cloudinary supports regular uploads up to 100 MB. For smaller videos, one direct
   // request is faster than creating/resuming multiple chunks.
   if(total<=100*1024*1024){
     const result=await cloudinarySimpleUpload(file,cfg,'video',loaded=>updateLive(loaded,'Uploading…'));
     q.cloudinary_secure_url=result.secure_url||'';q.cloudinary_url=result.url||'';q.cloudinary_public_id=result.public_id||'';q.cloudinary_final_response=result;
   }else{
     const CHUNK=Number(q.chunk_size)||20*1024*1024;
     const totalChunks=Math.ceil(total/CHUNK);
     const uploadId=q.cloudinary_upload_id||('hyper-'+q.id+'-'+cryptoRandom());
     let next=Math.max(0,Number(q.next_chunk)||0);
     let sent=Math.min(total,next*CHUNK);
     updateLive(sent,'Resuming…');
     for(let i=next;i<totalChunks;i++){
       const start=i*CHUNK,blob=file.slice(start,Math.min(total,start+CHUNK));
       let attempt=0,chunkResult=null;
       while(true){
         try{
           chunkResult=await cloudinaryChunkUpload(file,blob,start,total,uploadId,cfg,loaded=>updateLive(Math.min(total,start+loaded)));
           break;
         }catch(e){
           if(++attempt>=5)throw e;
           await new Promise(r=>setTimeout(r,800*Math.min(attempt,4)));
         }
       }
       if(chunkResult?.secure_url){q.cloudinary_secure_url=chunkResult.secure_url;q.cloudinary_url=chunkResult.url||'';q.cloudinary_public_id=chunkResult.public_id||''}
       if(chunkResult?.public_id)q.cloudinary_public_id=chunkResult.public_id;
       q.cloudinary_final_response=chunkResult;
       q.next_chunk=i+1;q.cloudinary_upload_id=uploadId;
       t.progress=Math.max(Number(t.progress)||0,Math.floor((Math.min(total,(i+1)*CHUNK)/total)*95));
       await updateUploadRecord(q.id,{progress:t.progress,committed_progress:t.progress,next_chunk:i+1,cloudinary_upload_id:uploadId,cloudinary_secure_url:q.cloudinary_secure_url||'',cloudinary_url:q.cloudinary_url||'',cloudinary_public_id:q.cloudinary_public_id||'',cloudinary_cloud_name:q.cloudinary_cloud_name||cfg.cloud_name,cloudinary_upload_preset:q.cloudinary_upload_preset||cfg.upload_preset,auth_token:q.auth_token||safeGet('hyper_token',''),state:'uploading'});
       persistUploadTasks();renderUploadDock();
     }
   }

   const finalUrl=q.cloudinary_secure_url||q.cloudinary_url;
   if(!finalUrl)throw new Error('Cloudinary upload finished but final video URL was not returned. Please retry once.');
   let thumbUrl=null,thumbId='';
   const thumb=q.thumbnail||q.thumbnailBlob;
   if(thumb){const tr=await cloudinarySimpleUpload(thumb,cfg,'image');thumbUrl=tr.secure_url||tr.url;thumbId=tr.public_id||''}
   t.progress=98;t.message='Saving video…';persistUploadTasks();renderUploadDock();

async function uploadQueuedTask(q){
 if(q.provider==='cloudinary')return uploadCloudinaryTask(q);
 if(uploadRunning.has(String(q.id)))return;
 let t=uploadTasks.find(x=>String(x.id)===String(q.id));
 if(!t){t={id:q.id,upload_id:q.upload_id||q.id,title:q.title||'Untitled',progress:Number(q.progress)||0,status:'paused',message:'Upload found — resuming…',background:true,size:(q.file||q.fileBlob)?.size||q.size||0,fingerprint:q.fingerprint||''};uploadTasks.push(t);persistUploadTasks();renderUploadDock()}
 const file=q.file||q.fileBlob;
 if(!file||typeof file.slice!=='function'){t.status='error';t.message='Upload file not found. Please select the Video again.';persistUploadTasks();renderUploadDock();return}
 q.file=file;
 uploadRunning.add(String(q.id));
 const CHUNK=Number(q.chunk_size)||1024*1024, total=Math.ceil(file.size/CHUNK), concurrency=4;
 try{
  t.status='uploading';t.background=true;t.message='Checking upload progress…';persistUploadTasks();renderUploadDock();
  const token=safeGet('hyper_token',''),headers=token?{Authorization:'Bearer '+token}:{};
  const base=A+'/uploads/'+encodeURIComponent(q.upload_id||q.id);
  const st=await fetch(base+'/status',{headers,cache:'no-store'});if(!st.ok)throw new Error('Upload session unavailable ('+st.status+')');
  const sd=await st.json();if(sd.complete){t.status='done';t.progress=100;t.message='Published successfully';removeBackgroundUpload(q.id);persistUploadTasks();renderUploadDock();setTimeout(()=>removeUploadTask(q.id),1800);return}
  const received=new Set((sd.received||[]).map(Number)), pending=[];
  for(let i=0;i<total;i++)if(!received.has(i))pending.push(i);
  const loadedMap={};
  for(let i=0;i<total;i++)if(received.has(i))loadedMap[i]=Math.min(CHUNK,Math.max(0,file.size-i*CHUNK));
  const receivedBytes=Object.values(loadedMap).reduce((a,b)=>a+b,0);
  const serverProgress=Math.min(95,Math.floor((file.size?receivedBytes/file.size:0)*95));
  t.progress=Math.max(Number(t.progress)||0,serverProgress);
  t.committedProgress=Math.max(Number(t.committedProgress)||0,serverProgress);
  t.displayProgress=t.progress;
  t._speedBytes=receivedBytes; t._speedStamp=Date.now();
  t.message=receivedBytes?`Resuming… ${t.progress}% already uploaded`:'Starting upload…';
  persistUploadTasks();renderUploadDock();
  const updateProgress=()=>{
   let committed=0,inFlight=0;
   for(let i=0;i<total;i++){
    if(received.has(i)) committed+=Math.min(CHUNK,Math.max(0,file.size-i*CHUNK));
    else inFlight+=Math.min(CHUNK,Math.max(0,loadedMap[i]||0));
   }

   // as transfer activity but are not counted in the durable % so refresh can never roll
   // the displayed percentage back from an uncommitted chunk.
   // Display live transfer progress, but keep a separate durable checkpoint.
   // The durable checkpoint only advances after a whole chunk is confirmed by the server.
   const durableFrac=file.size?committed/file.size:0;
   const liveFrac=file.size?(committed+inFlight)/file.size:0;
   t.committedProgress=Math.max(Number(t.committedProgress)||0,Math.min(95,Math.floor(durableFrac*95)));
   t.progress=Math.max(Number(t.progress)||0,Math.min(95,Math.floor(liveFrac*95)));
   t.displayProgress=t.progress;
   const now=Date.now(),prev=t._speedStamp||now,delta=Math.max(0.2,(now-prev)/1000),bytesNow=(committed+inFlight)-(t._speedBytes||0);
   if(bytesNow>0){const inst=bytesNow/delta;t._speed=t._speed?(.7*t._speed+.3*inst):inst;t._speedBytes=committed+inFlight;t._speedStamp=now}
   const speed=t._speed>0?formatTransferRate(t._speed):'';
   t.message=speed?`Uploading… ${t.progress}% • ${speed}`:`Uploading… ${t.progress}%`;
   persistUploadTasks();renderUploadDock();
   if(t._notifyProgress!==t.progress && (t.progress%5===0 || Date.now()-(t._notifyStamp||0)>12000)){t._notifyProgress=t.progress;t._notifyStamp=Date.now();notifyTransferToSW('HYPER Uploading',`${t.title||'Video'} • ${t.progress}%`,'hyper-upload-'+q.id)}
   if(!t._dbStamp||Date.now()-t._dbStamp>900){t._dbStamp=Date.now();updateUploadRecord(q.id,{progress:Number(t.committedProgress||0),committed_progress:Number(t.committedProgress||0),state:'uploading',size:file.size,filename:q.filename||file.name,mimetype:file.type||'video/mp4'});}
  };
  let cursor=0;
  async function worker(){
   while(true){
    const pos=cursor++;if(pos>=pending.length)return;
    const i=pending[pos];
    const slice=file.slice(i*CHUNK,Math.min(file.size,(i+1)*CHUNK));
    let attempt=0;
    while(true){
     try{
      const fd=new FormData();fd.append('upload_id',String(q.upload_id||q.id));fd.append('chunk',slice,q.filename||file.name);fd.append('chunk_index',String(i));fd.append('total_chunks',String(total));
      loadedMap[i]=0;updateProgress();
      await uploadChunkWithProgress(base+'/chunk',headers,fd,(loaded,totalBytes)=>{loadedMap[i]=loaded;updateProgress()});
      loadedMap[i]=slice.size;received.add(i);updateProgress();

   }
  }

  t.progress=97;t.message='Finalizing video…';persistUploadTasks();renderUploadDock();
  const fd=new FormData();fd.append('title',q.title||'Untitled');fd.append('description',q.description||'');fd.append('type',q.type||'video');fd.append('category',q.category||'Discover');fd.append('upload_id',String(q.upload_id||q.id));fd.append('duration_seconds',String(q.duration_seconds||0));fd.append('total_chunks',String(total));fd.append('filename',q.filename||file.name);fd.append('mimetype',file.type||'video/mp4');fd.append('original_language',q.original_language||'auto');fd.append('language_tracks',q.language_tracks||'{}');fd.append('subtitle_tracks',q.subtitle_tracks||'{}');const thumb=q.thumbnail||q.thumbnailBlob;if(thumb)fd.append('thumbnail',thumb,q.thumbnailName||thumb.name||'thumbnail.jpg');

  removeBackgroundUpload(q.id);t.status='done';t.progress=100;t.message='Published successfully';t._live=false;t.background=false;persistUploadTasks();renderUploadDock();setTimeout(()=>removeUploadTask(q.id),1800);await loadFeedOnly();
 }catch(e){t.status='paused';t._live=false;t.background=true;t.message='Upload paused: '+(e?.message||'network error')+' — tap Resume';persistUploadTasks();renderUploadDock();registerBackgroundSync()}
 finally{uploadRunning.delete(String(q.id))}
}
async function resumeUpload(id){try{const db=await openUploadDB();const q=await new Promise((resolve,reject)=>{const r=db.transaction('tasks','readonly').objectStore('tasks').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();if(q)uploadQueuedTask(q);else{const t=uploadTasks.find(x=>String(x.id)===String(id));if(t){t.status='error';t.message='Upload file not found. Please select the video again.';persistUploadTasks();renderUploadDock()}}}catch(e){alert(e.message)}}
async function reconcileUploadQueue(){
 try{
  const db=await openUploadDB();
  const items=await new Promise((resolve,reject)=>{const r=db.transaction('tasks','readonly').objectStore('tasks').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
  db.close();
  const seen=new Set();
  for(const q of items.filter(x=>x.state!=='done').sort((a,b)=>String(a.id).localeCompare(String(b.id)))){
   const key=q.fingerprint||((q.title||'').trim().toLowerCase()+'|'+(q.file?.size||q.size||0));
   if(seen.has(key)){removeBackgroundUpload(q.id);uploadTasks=uploadTasks.filter(x=>String(x.id)!==String(q.id));continue}
   seen.add(key);uploadQueuedTask(q)
  }
  persistUploadTasks();renderUploadDock()
 }catch(e){console.warn('Upload queue resume failed',e)}
}
async function removeUploadTask(id){const target=uploadTasks.find(x=>String(x.id)===String(id));const fp=target?.fingerprint||'';try{const tomb=safeJSON(safeGet('hyper_deleted_uploads','[]'),[]);tomb.push({id:String(id),fingerprint:fp,at:Date.now()});safeSet('hyper_deleted_uploads',JSON.stringify(tomb.slice(-50)))}catch(e){}for(const [k,xhr] of activeUploadXhrs){try{if(String(k).includes(String(id)))xhr.abort()}catch(e){}}uploadRunning.delete(String(id));try{const db=await openUploadDB();await new Promise((resolve,reject)=>{const tx=db.transaction('tasks','readwrite'),st=tx.objectStore('tasks'),r=st.getAll();r.onsuccess=()=>{for(const x of (r.result||[])){if(String(x.id)===String(id)||(fp&&x.fingerprint===fp))st.delete(x.id)} };r.onerror=()=>reject(r.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}removeBackgroundUpload(id);uploadTasks=uploadTasks.filter(x=>String(x.id)!==String(id)&&!(fp&&x.fingerprint===fp));persistUploadTasks();renderUploadDock()}
function renderUploadDock(){
 let el=document.getElementById('uploadDock');if(!el)return;
 uploadTasks=uploadTasks.filter(x=>x.status!=='done'||x.keepDone);
 const seen=new Set(),deduped=[];
 [...uploadTasks].reverse().forEach(x=>{
   const key=x.fingerprint||((x.title||'').trim().toLowerCase()+'|'+(x.size||0));
   if(seen.has(key))return
   seen.add(key);deduped.push(x)
 });
 uploadTasks=deduped.reverse();persistUploadTasks();
 el.innerHTML=uploadTasks.filter(x=>['uploading','done','error','paused'].includes(x.status)).slice(-5).map(x=>`<div class="uploadTask"><div class="utop"><b>${escapeHtml(x.title)}</b><span>${x.status==='uploading'?(x.progress||0)+'%':x.status==='paused'?'Paused — '+(x.progress||0)+'%':x.status==='error'?'Error':'Done'}</span></div><progress max="100" value="${x.progress||0}"></progress><small class="muted">${escapeHtml(x.message||'')}</small>${x.status==='paused'||x.status==='error'?`<button class="listbtn" style="margin-top:7px;border:1px solid var(--line);border-radius:10px" onclick="event.stopPropagation();resumeUpload('${x.id}')">↻ Resume Upload</button>`:''}<button class="listbtn" style="margin-top:7px;border:1px solid var(--line);border-radius:10px" onclick="event.stopPropagation();removeUploadTask('${x.id}')">🗑️ Delete</button></div>`).join('')
}
async function startUpload(){
 if(!user)return auth();
 let f=document.getElementById('video')?.files?.[0];
 if(!f)return alert('Select a video');
 if(f.size>2*1024*1024*1024)return alert('Video must be 2 GB or smaller');
 let durationSeconds=await getDurationFromVideoFile(f),
     title=(document.getElementById('title')?.value||'Untitled').trim(),
     desc=document.getElementById('desc')?.value||'',
     type=uploadType==='short'?'short':'video',
     cat=document.getElementById('cat')?.value||'Discover',
     lang=document.getElementById('videoLanguage')?.value||settingsState.language||'auto',
     t=document.getElementById('thumb')?.files?.[0],
     fingerprint=(f.name||'')+'|'+f.size+'|'+(f.lastModified||0),
     id=Date.now()+Math.random();
 let cfg;
 try{cfg=await getCloudinaryConfig()}catch(e){
   return alert('Cloudinary upload is not configured on Render. Set CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET first.')
 }
 const task={
   id,title,description:desc,type,category:cat,file:f,filename:f.name,mimetype:f.type||'video/mp4',
   thumbnail:t||null,thumbnailName:t?.name||'',progress:0,committedProgress:0,status:'waiting',
   message:'Starting Cloudinary upload…',background:true,size:f.size,fingerprint,provider:'cloudinary',
   // 20 MiB chunks reduce hundreds of HTTP round-trips on large videos while retaining resumable uploads.
   chunk_size:20*1024*1024,next_chunk:0,cloudinary_upload_id:'hyper-'+id+'-'+cryptoRandom(),
   cloudinary_cloud_name:cfg.cloud_name,cloudinary_upload_preset:cfg.upload_preset,
   auth_token:safeGet('hyper_token',''),
   duration_seconds:durationSeconds,original_language:lang,language_tracks:'{}',subtitle_tracks:'{}',state:'waiting'
 };
 uploadTasks=uploadTasks.filter(x=>!(x.fingerprint===fingerprint&&['paused','error','done'].includes(x.status)));
 uploadTasks.push(task);
 persistUploadTasks();
 renderUploadDock();
 hyperSystemNotify('HYPER Upload started',`${title} • 0%`,'hyper-upload-'+id);

 // Persist the file BEFORE starting the network upload. This fixes refresh/close recovery.
 try{await queueBackgroundUpload(task)}catch(e){console.warn('Upload queue persistence failed:',e)}

 // Clear the upload form immediately after Start Upload, without waiting for the video to finish.
 ['title','desc','video','thumb'].forEach(fid=>{const el=document.getElementById(fid);if(el)el.value=''});
 setType('video');
 const catEl=document.getElementById('cat');if(catEl)catEl.value='Discover';
 const langEl=document.getElementById('videoLanguage');if(langEl)langEl.value=settingsState.language||'auto';

 // Do not await here: the upload card/progress runs independently and a new upload can start.
 uploadCloudinaryTask(task).catch(e=>{
   task.status='paused';task.message='Upload paused: '+(e?.message||'Cloudinary error')+' — tap Resume';
   persistUploadTasks();renderUploadDock();registerBackgroundSync();
 });
}

function chooseLanguage(){
 const cur=settingsState.language||'hi';
 const box=document.createElement('div');box.className='languageModal';box.id='languageModal';
 box.innerHTML=`<div class="languageBox"><div class="languageHead"><h2>🌐 ${UI_T[settingsState.language||'hi']?.Language||'Language'}</h2><button class="languageClose" onclick="document.getElementById('languageModal')?.remove()">×</button></div><div>${UI_LANGS.map(x=>`<button class="languageOption ${x.k===cur?'selected':''}" onclick="selectAppLanguage('${x.k}')"><span><span class="languageNative">${x.n}</span><span class="languageEnglish">${x.e}</span></span><span>${x.k===cur?'✓':''}</span></button>`).join('')}</div></div>`;
 document.body.appendChild(box);
 box.addEventListener('click',e=>{if(e.target===box)box.remove()});
}
function selectAppLanguage(k){
 settingsState.language=UI_LANGS.some(x=>x.k===k)?k:'en';
 persist();
 document.getElementById('languageModal')?.remove();
 render();
} 
function applyLanguage(){
 const lang=settingsState.language||'hi', d=UI_T[lang]||UI_T.en;
 const langMap={hi:'hi',bho:'hi',bn:'bn',mr:'mr',gu:'gu',ta:'ta',te:'te',kn:'kn',ml:'ml',pa:'pa',ur:'ur'};
 document.documentElement.lang=langMap[lang]||'en';
 document.documentElement.dir=lang==='ur'?'rtl':'ltr';
 document.querySelectorAll('[placeholder]').forEach(el=>{const v=el.getAttribute('placeholder');if(d[v])el.setAttribute('placeholder',d[v])});
 const allText=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(allText.nextNode())nodes.push(allText.currentNode);
 nodes.forEach(node=>{
   const raw=(node.nodeValue||'').trim(); if(!raw)return;
   let key=raw;
   if(!d[key]){
     const stripped=raw.replace(/^[^\p{L}\p{N}]+/u,'').trim();
     if(d[stripped]){
       const lead=raw.slice(0,raw.indexOf(stripped));node.nodeValue=lead+d[stripped];return;
     }
   }
   if(d[key])node.nodeValue=raw.replace(key,d[key]);
 });
 document.querySelectorAll('option').forEach(el=>{const raw=(el.textContent||'').trim();if(d[raw])el.textContent=d[raw]});
 const title=document.querySelector('title');if(title)title.textContent='HYPER';
}
function setVideoLanguage(lang){if(!selected)return;const tracks=selected.language_tracks&&typeof selected.language_tracks==='object'?selected.language_tracks:{};const url=lang==='auto'?selected.video_url:tracks[lang];if(!url)return alert(languageName(lang)+' audio/video track available nahi hai. Original video language: '+languageName(selected.original_language||'auto'));const p=document.getElementById('player');if(!p)return;const pos=p.currentTime,was=!p.paused;p.src=mediaUrl(url);p.addEventListener('loadedmetadata',()=>{try{p.currentTime=Math.min(pos,p.duration||pos)}catch(e){}if(was)p.play().catch(()=>{})},{once:true});p.load()}
function toggleSetting(k){settingsState[k]=!settingsState[k];persist();render()};function downloadQuality(){let a=['360p','480p','720p','1080p'],i=a.indexOf(settingsState.downloadQuality);settingsState.downloadQuality=a[(i+1)%a.length];persist();render()};async function setAccountVisibility(){if(!user)return auth();let next=!settingsState.private;settingsState.private=next;persist();try{let r=await api('/me/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_private:next})});settingsState.private=!!r.is_private;persist();render()}catch(e){settingsState.private=!next;persist();alert(e.message)}};function chooseQuality(){let a=['Auto','360p','480p','720p','1080p'],i=a.indexOf(settingsState.videoQuality||'Auto');settingsState.videoQuality=a[(i+1)%a.length];settingsState.downloadQuality=settingsState.videoQuality==='Auto'?'720p':settingsState.videoQuality;persist();render()}
function saveAccounts(){safeSet('hyper_accounts',JSON.stringify(accountList.slice(-8)))}
function setActiveAccount(u,t){user=u;safeSet('hyper_token',t);safeSet('hyper_user',JSON.stringify(u));let i=accountList.findIndex(a=>a.username===u.username);let item={username:u.username,email:u.email,display_name:u.display_name,channel_name:u.channel_name,avatar_url:u.avatar_url,token:t};if(i>=0)accountList[i]=item;else accountList.push(item);saveAccounts();settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_'+u.username,'null'),null)||{})};persist()}
function switchAccount(username){let a=accountList.find(x=>x.username===username);if(!a)return;if(a.token){setActiveAccount(a,a.token);document.getElementById('modal')?.remove();go('channel');openChannel(a.username)}else signinForm()}
function accountSwitcher(){if(!accountList.length)return '<p class="muted">No saved accounts yet. Sign in once to add this device account.</p>';return '<h3>Switch account</h3><div class="accountList">'+accountList.map(a=>`<button class="accountItem" onclick="switchAccount('${escapeHtml(a.username)}')">${avatarHtml(a)}<span><b>${escapeHtml(a.channel_name||a.display_name||a.username)}</b><small>${escapeHtml(a.email||a.username)}</small></span></button>`).join('')+'</div><button class="switch" onclick="signupForm()">＋ Add another account</button>'}
function auth(mode='signin'){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="document.getElementById('modal')?.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div id="authbox"></div></div></div>`);mode==='signup'?signupForm():mode==='switch'?(authbox.innerHTML=accountSwitcher()+'<button class="switch" onclick="signinForm()">Sign in with another account</button>'):signinForm()}
function signinForm(){authbox.innerHTML=accountSwitcher()+'<h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signupForm()">Create account</button>'}
function signupForm(){authbox.innerHTML='<h2>Create account</h2><input id="display" placeholder="Full name"><input id="username" placeholder="Username (letters, numbers, _)\"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="primary" onclick="register()">Create account</button><button class="switch" onclick="signinForm()">Already have an account? Sign in</button>'}
async function register(){try{let r=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:document.getElementById('display')?.value||'',username:document.getElementById('username')?.value||'',email:document.getElementById('email')?.value||'',password:document.getElementById('pass')?.value||''})});setActiveAccount(r.user,r.token);document.getElementById('modal')?.remove();await openChannel(user.username);alert('Account created successfully')}catch(e){alert(e.message)}}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email')?.value||'',password:document.getElementById('pass')?.value||''})});setActiveAccount(r.user,r.token);document.getElementById('modal')?.remove();await openChannel(user.username)}catch(e){alert(e.message)}}
function logout(){safeRemove('hyper_token');safeRemove('hyper_user');user=null;settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_guest','null'),null)||{})};persist();go('home')}

async function restoreRoute(){try{let r=savedRoute||{type:safeGet('hyper_tab','home')};if(r.type==='channel'&&r.username){await openChannel(r.username);return}if(r.type==='watch'&&r.id){let rid=String(r.id);selected=videos.find(v=>String(v.id)===rid);if(!selected){try{selected=await api('/videos/'+encodeURIComponent(rid)+'?fresh='+Date.now())}catch(e){console.warn('Restore watch fetch failed',e)}}if(selected){tab='watch';safeSet('hyper_watch_id',rid);await render();setTimeout(()=>{let p=document.getElementById('player');if(p){let pos=Math.max(0,Number(safeGet('hyper_pos_'+rid,safeGet('hyper_watch_pos','0')))||0);const apply=()=>{if(pos>0&&Number.isFinite(p.duration)&&pos<p.duration-1){try{p.currentTime=Math.min(pos,p.duration-0.5)}catch(e){}}};p.addEventListener('loadedmetadata',apply,{once:true});p.addEventListener('canplay',apply,{once:true});apply();}},150);setTimeout(loadComments,250);return}}if(r.type==='search'){q=r.q||q;try{searchResults=await api('/search?q='+encodeURIComponent(q))}catch(e){}tab='search';await render();return}if(r.type==='library'){tab='library';libraryMode=r.mode||libraryMode}else if(r.type==='home'&&r.category){tab='home';category=r.category}else if(['home','search','shorts','subs','library','create','settings','editChannel'].includes(r.type)){tab=r.type}safeSet('hyper_tab',tab);await render()}catch(e){console.error(e);await render()}}
