function makeMiniDraggable(x){if(!x||x.dataset.dragReady)return;x.dataset.dragReady='1';let dragging=false,sx=0,sy=0,sl=0,st=0,moved=false;const start=e=>{if(e.target.closest('.miniClose'))return;dragging=true;moved=false;let p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;let r=x.getBoundingClientRect();sl=r.left;st=r.top;try{e.preventDefault()}catch{}};const move=e=>{if(!dragging)return;let p=e.touches?e.touches[0]:e;let dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;let maxX=Math.max(0,innerWidth-x.offsetWidth),maxY=Math.max(0,innerHeight-x.offsetHeight);let left=Math.min(maxX,Math.max(0,sl+dx)),top=Math.min(maxY,Math.max(0,st+dy));x.style.left=left+'px';x.style.top=top+'px';x.style.right='auto';x.style.bottom='auto';try{e.preventDefault()}catch{}};const end=()=>{if(!dragging)return;dragging=false;if(moved)x.dataset.justDragged='1',setTimeout(()=>delete x.dataset.justDragged,220)};let h=x.querySelector('.miniDragHandle');if(h){h.addEventListener('pointerdown',start);h.addEventListener('pointermove',move);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);h.addEventListener('touchstart',start,{passive:false});h.addEventListener('touchmove',move,{passive:false});h.addEventListener('touchend',end)}x.addEventListener('click',e=>{if(x.dataset.justDragged){e.stopPropagation();e.preventDefault()}})}
function ensureMiniContainer(){let x=document.getElementById('miniPlayer');if(!x){x=document.createElement('div');x.id='miniPlayer';x.className='miniPlayer';x.innerHTML='<div class="miniDragHandle" title="Drag to move">↔ Move</div><button class="miniClose" onclick="event.stopPropagation();closeMiniPlayer()">×</button><div id="miniSlot" onclick="openMiniWatch(event)"></div>';document.body.appendChild(x);makeMiniDraggable(x)}else makeMiniDraggable(x);let slot=x.querySelector('#miniSlot');if(slot&&!slot.dataset.tapReady){slot.dataset.tapReady='1';slot.addEventListener('click',e=>{if(x.dataset.justDragged)return;openMiniWatch(e)});slot.addEventListener('pointerup',e=>{if(x.dataset.justDragged)return;let v=slot.querySelector('video');if(v&&e.target===v)openMiniWatch(e)})}return x}

function relatedVideos(){
  if(!selected)return [];
  let sameCat=videos.filter(v=>String(v.id)!==String(selected.id)&&v.type!=='short'&&(v.category||'').toLowerCase()===(selected.category||'').toLowerCase());
  let sameChannel=videos.filter(v=>String(v.id)!==String(selected.id)&&v.type!=='short'&&(v.username||'').toLowerCase()===(selected.username||'').toLowerCase());
  let rest=videos.filter(v=>String(v.id)!==String(selected.id)&&v.type!=='short');
  let out=[...sameCat,...sameChannel,...rest];
  return out.filter((v,i,a)=>a.findIndex(x=>String(x.id)===String(v.id))===i).slice(0,8);
}

function toggleVideoFullscreen(){
  const wrap=document.getElementById('videoWrap'),v=document.getElementById('player');
  if(!wrap||!v)return;
  if(document.fullscreenElement){document.exitFullscreen?.();return}
  (wrap.requestFullscreen?.()||v.requestFullscreen?.())?.catch?.(()=>{});
}
async function toggleVideoOrientation(){
  const v=document.getElementById('player');
  if(!v)return;
  try{
    if(!document.fullscreenElement){
      const wrap=document.getElementById('videoWrap');
      await (wrap?.requestFullscreen?.()||v.requestFullscreen?.());
    }
    if(screen.orientation?.lock){
      const cur=screen.orientation.type||'';
      await screen.orientation.lock(cur.includes('landscape')?'portrait':'landscape');
    }else alert('Is device/browser me orientation control available nahi hai.');
  }catch(e){alert('Landscape/Portrait change ke liye pehle video fullscreen karein.');}
}

async function watch(id){
  if(window.miniVideo&&String(window.miniVideo.dataset.videoId)!==String(id)){try{window.miniVideo.pause()}catch(e){}window.miniVideo=null;document.getElementById('miniPlayer')?.remove()}
  selected=videos.find(v=>String(v.id)===String(id));
  if(!selected){try{selected=await api('/videos/'+id)}catch{selected=null}}
  if(!selected)return;
  tab='watch';setRoute({type:'watch',id}); window._viewCounted=false;clearTimeout(window._viewTimer); await render();
  if(user)api('/videos/'+id+'/history',{method:'POST'}).catch(()=>{});
  setTimeout(()=>{
    let el=document.getElementById('player'); if(!el)return;
    el.onerror=()=>{let e=document.getElementById('playerError');if(e)e.innerHTML='Video load nahi ho raha. Network ya server storage check karein.'};
    el.onloadeddata=()=>{let e=document.getElementById('playerError');if(e)e.innerHTML=''; setupHyperAds(el)};
    el.addEventListener('loadedmetadata',()=>setupHyperAds(el),{once:true});
    el.addEventListener('play',()=>{if(window._viewCounted)return;clearTimeout(window._viewTimer);window._viewTimer=setTimeout(()=>countView(id),5000)},{once:true});
    el.addEventListener('ended',()=>{if(!window._viewCounted)countView(id)},{once:true});
    el.addEventListener('timeupdate',()=>{if(selected&&el.currentTime>1)safeSet('hyper_pos_'+selected.id,String(Math.floor(el.currentTime)))},{passive:true});
  },250); loadComments();
}

function showHyperAd(kind){
  const box=document.getElementById('hyperAdOverlay'); if(!box)return;
  let left=kind==='pre'?5:5, skipped=false;
  box.innerHTML=`<div class="hyperAd"><button class="adDismiss" aria-label="close">×</button><div class="hyperAdBox"><div class="hyperAdTop"><span class="hyperAdBrand">HYPER Advertisement</span><span class="hyperAdBadge">ADVERTISEMENT</span></div><h3>Apne business ko HYPER par promote karein</h3><p>Yeh HYPER ka demo ad placement hai. Real advertiser connect hone par yahan paid advertisement chalega.</p><div class="hyperAdActions"><button class="hyperAdVisit hyperAdBtn">Learn More</button><button class="hyperAdSkip" disabled>Skip in ${left}s</button></div></div></div>`;
  adEvent(selected?.id,kind==='pre'?'impression_pre':'impression_mid');
  const skip=box.querySelector('.hyperAdSkip'), close=box.querySelector('.adDismiss');
  const hide=()=>{if(skipped)return;skipped=true;box.innerHTML='';adEvent(selected?.id,'complete')};
  close.onclick=hide; box.querySelector('.hyperAdBtn').onclick=()=>adEvent(selected?.id,'click');
  const timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);skip.disabled=false;skip.textContent='Skip Ad';skip.onclick=hide}else skip.textContent=`Skip in ${left}s`},1000);
}
function setupHyperAds(el){
  if(!el||selected?.type==='short'||el.dataset.hyperAdsReady)return; el.dataset.hyperAdsReady='1';
  showHyperAd('pre'); el.pause();
  const midAt=Math.max(30,Math.floor((el.duration||selected.duration_seconds||0)/2));
  if(Number.isFinite(midAt)&&midAt>=30){let shown=false;el.addEventListener('timeupdate',()=>{if(!shown&&el.currentTime>=midAt){shown=true;el.pause();showHyperAd('mid')}})}
}

async function like(id){
  if(!user)return auth();
  const v=videos.find(x=>String(x.id)===String(id))||selected;
  const btns=[...document.querySelectorAll('[data-like-video=\"'+CSS.escape(String(id))+'\"]')];
  const oldLikes=v?.likes||0;
  const wasLiked=!!(window._likedState&&window._likedState[id]);
  const nextLiked=!wasLiked,nextLikes=Math.max(0,oldLikes+(nextLiked?1:-1));
  window._likedState=window._likedState||{};window._likedState[id]=nextLiked;
  if(v)v.likes=nextLikes;if(selected&&String(selected.id)===String(id))selected.likes=nextLikes;
  btns.forEach(b=>b.textContent='👍 '+fmt(nextLikes));
  try{
    let r=await api('/videos/'+id+'/like',{method:'POST'});
    window._likedState[id]=!!r.liked;
    if(v)v.likes=r.likes;if(selected&&String(selected.id)===String(id))selected.likes=r.likes;
    document.querySelectorAll('[data-like-video=\"'+CSS.escape(String(id))+'\"]').forEach(b=>b.textContent='👍 '+fmt(r.likes));
  }catch(e){
    window._likedState[id]=wasLiked;if(v)v.likes=oldLikes;if(selected&&String(selected.id)===String(id))selected.likes=oldLikes;
    btns.forEach(b=>b.textContent='👍 '+fmt(oldLikes));alert(e.message)
  }
}

async function subscribeChannel(username){if(!user)return auth();if(!username||username===user.username)return;let old=!!subscriptionState[username],next=!old;subscriptionState[username]=next;document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=next?'subscribed':'sub';b.textContent=next?'Subscribed':'Subscribe'});let countEls=[...document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]')];let base=(channelUser?.username===username?channelUser.subscriber_count:(selected?.username===username?selected.subscriber_count:0))||0;let optimistic=Math.max(0,base+(next?1:-1));countEls.forEach(e=>e.textContent=fmt(optimistic)+' subscribers');try{let r=await api('/channels/'+encodeURIComponent(username)+'/subscribe',{method:'POST'});subscriptionState[username]=!!r.subscribed;safeSet('hyper_subscriptions_'+user.username,JSON.stringify(subscriptionState));if(channelUser?.username===username)channelUser.subscriber_count=r.subscriber_count;if(selected?.username===username)selected.subscriber_count=r.subscriber_count;document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=r.subscribed?'subscribed':'sub';b.textContent=r.subscribed?'Subscribed':'Subscribe'});document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]').forEach(e=>e.textContent=fmt(r.subscriber_count)+' subscribers');}catch(e){subscriptionState[username]=old;safeSet('hyper_subscriptions_'+user.username,JSON.stringify(subscriptionState));document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=old?'subscribed':'sub';b.textContent=old?'Subscribed':'Subscribe'});document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]').forEach(e=>e.textContent=fmt(base)+' subscribers');alert(e.message)}}

let activeUploadXhrs=new Map();
function queueBackgroundUpload(task){return new Promise((resolve,reject)=>{try{const r=indexedDB.open('hyper-upload-queue',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('tasks'))db.createObjectStore('tasks',{keyPath:'id'})};r.onsuccess=()=>{const db=r.result,tx=db.transaction('tasks','readwrite'),store=tx.objectStore('tasks');store.put({...task,state:task.state||'waiting'});tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)};r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function removeBackgroundUpload(id){try{const r=indexedDB.open('hyper-upload-queue',2);r.onsuccess=()=>{const tx=r.result.transaction('tasks','readwrite');tx.objectStore('tasks').delete(id)}}catch(e){}}
async function registerBackgroundSync(){try{let reg=await navigator.serviceWorker?.ready;if(reg?.sync?.register)await reg.sync.register('hyper-upload');return true}catch(e){return false}}
async function uploadQueuedTask(q){const t=uploadTasks.find(x=>String(x.id)===String(q.id));if(!t)return;try{t.status='uploading';t._live=false;t.background=true;t.message='Uploading…';persistUploadTasks();renderUploadDock();const d=new FormData();d.append('title',q.title||'Untitled');d.append('description',q.description||'');d.append('type',q.type||'video');d.append('category',q.category||'Discover');d.append('upload_id',String(q.upload_id||q.id));d.append('duration_seconds',String(q.duration_seconds||0));d.append('video',q.file,q.filename||q.file.name);if(q.thumbnail)d.append('thumbnail',q.thumbnail,q.thumbnailName||q.thumbnail.name);const r=await fetch(A+'/videos',{method:'POST',headers:{Authorization:'Bearer '+q.token},body:d});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Publish failed');await removeBackgroundUpload(q.id);t.status='done';t.progress=100;t.message='Published successfully';t._live=false;t.background=false;persistUploadTasks();renderUploadDock();setTimeout(()=>removeUploadTask(q.id),1800);await loadFeedOnly()}catch(e){t.status='paused';t._live=false;t.background=true;t.message='Upload waiting — retrying…';persistUploadTasks();renderUploadDock();registerBackgroundSync()}}
async function loadFeedOnly(){try{let d=await api('/videos?cacheBust='+Date.now());if(Array.isArray(d))videos=d}catch(e){}if(tab==='home')await render()}
async function reconcileUploadQueue(){try{const r=indexedDB.open('hyper-upload-queue',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('tasks'))r.result.createObjectStore('tasks',{keyPath:'id'})};r.onsuccess=()=>{const db=r.result,tx=db.transaction('tasks','readonly'),req=tx.objectStore('tasks').getAll();req.onsuccess=()=>{(req.result||[]).filter(x=>x.state!=='done').forEach(q=>uploadQueuedTask(q))}}}catch(e){}}

function removeUploadTask(id){uploadTasks=uploadTasks.filter(x=>String(x.id)!==String(id));persistUploadTasks();renderUploadDock()}
function renderUploadDock(){let el=document.getElementById('uploadDock');if(!el)return;uploadTasks=uploadTasks.filter(x=>x.status!=='done'||x.keepDone);persistUploadTasks();el.innerHTML=uploadTasks.filter(x=>['uploading','done','error','paused'].includes(x.status)).slice(-5).map(x=>`<div class="uploadTask"><div class="utop"><b>${escapeHtml(x.title)}</b><span>${x.status==='uploading'?(x.progress?x.progress+'%':'Uploading…'):x.status==='paused'?'Queued':x.status==='done'?'Done':'Failed'}</span></div><progress max="100" value="${x.progress||0}"></progress><small class="muted">${escapeHtml(x.message||'')}</small><button class="listbtn" style="margin-top:7px;border:1px solid var(--line);border-radius:10px" onclick="event.stopPropagation();removeUploadTask('${x.id}')">🗑️ Delete</button></div>`).join('')}
async function startUpload(){if(!user)return auth();let f=document.getElementById('video')?.files?.[0];if(!f)return alert('Select a video');if(f.size>250*1024*1024)return alert('Video must be 250 MB or smaller');let durationSeconds=await getDurationFromVideoFile(f);let title=(document.getElementById('title')?.value||'Untitled').trim(),desc=document.getElementById('desc')?.value||'',type=uploadType==='short'?'short':'video',cat=document.getElementById('cat')?.value||'Discover',t=document.getElementById('thumb')?.files?.[0],id=Date.now()+Math.random();let task={id,title,progress:0,status:'uploading',message:'Uploading...',_live:true,background:false};uploadTasks.push(task);persistUploadTasks();renderUploadDock();
try{await queueBackgroundUpload({id,title,description:desc,type,category:cat,file:f,filename:f.name,thumbnail:t||null,thumbnailName:t?.name||'',token:safeGet('hyper_token',''),upload_id:String(id),duration_seconds:durationSeconds,state:'waiting'})}catch(e){}
let d=new FormData();d.append('title',title);d.append('description',desc);d.append('type',type);d.append('category',cat);d.append('upload_id',String(id));d.append('duration_seconds',String(durationSeconds));d.append('video',f);if(t)d.append('thumbnail',t);let xhr=new XMLHttpRequest();activeUploadXhrs.set(id,xhr);xhr.open('POST',A+'/videos');let token=safeGet('hyper_token','');if(token)xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=e=>{if(e.lengthComputable){task.progress=Math.round(e.loaded/e.total*100);task.message='Uploading...';persistUploadTasks();renderUploadDock()}};xhr.onload=async()=>{activeUploadXhrs.delete(id);let data=safeJSON(xhr.responseText,{});if(xhr.status>=200&&xhr.status<300){removeBackgroundUpload(id);task._live=false;task.background=false;task.progress=100;task.status='done';task.message='Published successfully';persistUploadTasks();renderUploadDock();setTimeout(()=>removeUploadTask(id),2200);await load();let form=document.querySelector('.createbox');if(form)form.querySelectorAll('input[type=file]').forEach(i=>i.value='')}else{task._live=false;task.status='error';task.message=data.message||'Publish failed';persistUploadTasks();renderUploadDock();removeBackgroundUpload(id)}};xhr.onerror=async()=>{activeUploadXhrs.delete(id);task._live=false;task.background=true;task.status='uploading';task.message='Network lost — background upload queued…';persistUploadTasks();renderUploadDock();await registerBackgroundSync()};xhr.onabort=async()=>{activeUploadXhrs.delete(id);task._live=false;task.background=true;task.status='uploading';task.message='App refreshed — background upload continuing…';persistUploadTasks();renderUploadDock();await registerBackgroundSync()};xhr.send(d);
// Clear the upload form immediately after the upload starts. The selected files remain in the upload task/queue, so clearing the form does not cancel the upload.
setTimeout(()=>{['title','desc','video','thumb'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});setType('video');const cat=document.getElementById('cat');if(cat)cat.value='Discover'},0)}
function upload(){startUpload()}
function stopUploadsForBackground(){if(!activeUploadXhrs.size)return;for(const [id,xhr] of activeUploadXhrs){try{xhr.abort()}catch(e){}}}
window.addEventListener('pagehide',()=>{if(activeUploadXhrs.size){for(const [id,xhr] of activeUploadXhrs){let t=uploadTasks.find(x=>String(x.id)===String(id));if(t){t._live=false;t.background=true;t.status='uploading';t.message='App refreshed — upload will continue…'}}persistUploadTasks();stopUploadsForBackground();setTimeout(()=>registerBackgroundSync(),0)}});

function toggleSetting(k){settingsState[k]=!settingsState[k];persist();render()};function downloadQuality(){let a=['360p','480p','720p','1080p'],i=a.indexOf(settingsState.downloadQuality);settingsState.downloadQuality=a[(i+1)%a.length];persist();render()};async function setAccountVisibility(){if(!user)return auth();let next=!settingsState.private;settingsState.private=next;persist();try{let r=await api('/me/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_private:next})});settingsState.private=!!r.is_private;persist();render()}catch(e){settingsState.private=!next;persist();alert(e.message)}};function chooseQuality(){let a=['Auto','360p','480p','720p','1080p'],i=a.indexOf(settingsState.videoQuality||'Auto');settingsState.videoQuality=a[(i+1)%a.length];settingsState.downloadQuality=settingsState.videoQuality==='Auto'?'720p':settingsState.videoQuality;persist();render()}
function saveAccounts(){safeSet('hyper_accounts',JSON.stringify(accountList.slice(-8)))}
function setActiveAccount(u,t){user=u;safeSet('hyper_token',t);safeSet('hyper_user',JSON.stringify(u));let i=accountList.findIndex(a=>a.username===u.username);let item={username:u.username,email:u.email,display_name:u.display_name,channel_name:u.channel_name,avatar_url:u.avatar_url,token:t};if(i>=0)accountList[i]=item;else accountList.push(item);saveAccounts();settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_'+u.username,'null'),null)||{})};persist()}
function switchAccount(username){let a=accountList.find(x=>x.username===username);if(!a)return;if(a.token){setActiveAccount(a,a.token);document.getElementById('modal')?.remove();go('channel');openChannel(a.username)}else signinForm()}
function accountSwitcher(){if(!accountList.length)return '<p class="muted">No saved accounts yet. Sign in once to add this device account.</p>';return '<h3>Switch account</h3><div class="accountList">'+accountList.map(a=>`<button class="accountItem" onclick="switchAccount('${escapeHtml(a.username)}')">${avatarHtml(a)}<span><b>${escapeHtml(a.channel_name||a.display_name||a.username)}</b><small>${escapeHtml(a.email||a.username)}</small></span></button>`).join('')+'</div><button class="switch" onclick="signupForm()">＋ Add another account</button>'}
function auth(mode='signin'){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="document.getElementById('modal')?.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div id="authbox"></div></div></div>`);mode==='signup'?signupForm():mode==='switch'?(authbox.innerHTML=accountSwitcher()+'<button class="switch" onclick="signinForm()">Sign in with another account</button>'):signinForm()}
function signinForm(){authbox.innerHTML=accountSwitcher()+'<h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signupForm()">Create account</button>'}
function signupForm(){authbox.innerHTML='<h2>Create account</h2><input id="display" placeholder="Full name"><input id="username" placeholder="Username (letters, numbers, _)\"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="primary" onclick="register()">Create account</button><button class="switch" onclick="signinForm()">Already have an account? Sign in</button>'}
async function register(){try{let r=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:document.getElementById('display')?.value||'',username:document.getElementById('username')?.value||'',email:document.getElementById('email')?.value||'',password:document.getElementById('pass')?.value||''})});setActiveAccount(r.user,r.token);document.getElementById('modal')?.remove();await openChannel(user.username);alert('Account created successfully')}catch(e){alert(e.message)}}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email')?.value||'',password:document.getElementById('pass')?.value||''})});setActiveAccount(r.user,r.token);document.getElementById('modal')?.remove();await openChannel(user.username)}catch(e){alert(e.message)}}
function logout(){safeRemove('hyper_token');safeRemove('hyper_user');user=null;settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_guest','null'),null)||{})};persist();go('home')}
document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
async function restoreRoute(){try{let r=savedRoute||{type:safeGet('hyper_tab','home')};if(r.type==='channel'&&r.username){await openChannel(r.username);return}if(r.type==='watch'&&r.id){selected=videos.find(v=>String(v.id)===String(r.id));if(!selected){try{selected=await api('/videos/'+r.id)}catch{selected=null}}if(selected){tab='watch';await render();setTimeout(()=>{let p=document.getElementById('player');if(p){let pos=Number(safeGet('hyper_pos_'+r.id,'0'));if(pos>0)p.currentTime=pos}},300);setTimeout(loadComments,250);return}}if(r.type==='search'){q=r.q||q;try{searchResults=await api('/search?q='+encodeURIComponent(q))}catch(e){}tab='search';await render();return}if(r.type==='library'){tab='library';libraryMode=r.mode||libraryMode}else if(r.type==='home'&&r.category){tab='home';category=r.category}else if(['home','search','shorts','subs','library','create','settings','editChannel'].includes(r.type)){tab=r.type}safeSet('hyper_tab',tab);await render()}catch(e){console.error(e);await render()}}
if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='HYPER_UPLOAD_DONE'){const id=e.data.id;const t=uploadTasks.find(x=>String(x.id)===String(id));if(t){removeBackgroundUpload(id);t.status='done';t.progress=100;t.message='Published successfully';t._live=false;t.background=false;persistUploadTasks();renderUploadDock();setTimeout(()=>removeUploadTask(id),1800)}loadFeedOnly()}});window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
window.addEventListener('scroll',()=>{if(tab!=='watch')return;let wrap=document.getElementById('videoWrap'),v=document.getElementById('player');if(!wrap||!v)return;let r=wrap.getBoundingClientRect();if(r.bottom<70&&v.paused===false){window.miniVideo=v;v.dataset.videoId=String(selected?.id||'');let box=ensureMiniContainer(),slot=box.querySelector('#miniSlot');slot.appendChild(v);v.style.borderRadius='0';box.style.display='block'}else if(r.bottom>=70&&window.miniVideo===v){let box=document.getElementById('miniPlayer');document.getElementById('videoWrap')?.prepend(v);v.style='';window.miniVideo=null;if(box)box.style.display='none'}});
load().then(()=>restoreRoute());
</script></body></html>
