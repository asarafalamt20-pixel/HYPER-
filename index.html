<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f3e"><title>HYPER</title>
<style>
:root{--green:#087f3e;--green2:#0aa04d;--bg:#f7faf8;--card:#fff;--text:#10251b;--muted:#718078;--line:#dfe9e3;--soft:#edf6ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:82px;transition:.2s}.dark{--bg:#0e1511;--card:#17201b;--text:#f2f7f4;--muted:#9aa9a1;--line:#2b3831;--soft:#20352a}.dark .top,.dark .chips,.dark .bottom,.dark .listbtn,.dark .auth,.dark .createbox,.dark .settings,.dark .librarybox{background:var(--card);color:var(--text)}.dark input,.dark textarea{color:var(--text);background:#111a15}
button{font:inherit;cursor:pointer}.top{height:70px;display:flex;align-items:center;gap:12px;padding:10px 4%;background:var(--card);position:sticky;top:0;z-index:7;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:8px;color:var(--green);font-size:21px}.mark{width:40px;height:40px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:25px}.search{flex:1;max-width:680px;margin:auto;display:flex;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--bg)}.search input{flex:1;border:0;background:transparent;padding:11px 17px;outline:0}.search button{border:0;background:transparent;padding:0 15px;font-size:20px}.sign{border:0;background:var(--green);color:#fff;padding:10px 17px;border-radius:22px;font-weight:bold;min-width:44px}.avatarImg{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle}.chips{display:flex;gap:9px;padding:11px 4%;background:var(--card);overflow:auto;border-bottom:1px solid var(--line)}.chips button{border:0;border-radius:18px;padding:9px 15px;white-space:nowrap;background:var(--soft);color:var(--text)}.chips .on{background:var(--green);color:#fff}.page{max-width:1200px;margin:auto;padding:24px 4%}.hero{background:linear-gradient(120deg,#063c24,#0aa04d);color:#fff;border-radius:24px;padding:30px;margin-bottom:28px}.hero h1{margin:5px 0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px #0b5b3210}.thumb{position:relative;aspect-ratio:16/9;background:#111}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:8px;bottom:7px;background:#111;color:#fff;padding:4px;border-radius:4px;font-size:11px}.meta{display:flex;gap:10px;padding:12px}.ava{width:34px;height:34px;border-radius:50%;background:#d9f2e4;color:var(--green);display:grid;place-items:center;font-weight:bold;flex:none;overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}.meta h3{font-size:15px;margin:0 0 5px}.meta p,.meta small,.muted{color:var(--muted);font-size:12px;margin:0}.shortrow{display:flex;gap:14px;overflow:auto}.short{width:190px;aspect-ratio:9/14;position:relative;flex:none;border-radius:15px;overflow:hidden;color:#fff;cursor:pointer}.short img{width:100%;height:100%;object-fit:cover}.short div{position:absolute;bottom:0;left:0;right:0;padding:35px 10px 10px;background:linear-gradient(transparent,#000c)}.watch video{width:100%;max-height:650px;background:#000;border-radius:16px}.back{border:0;background:none;color:var(--green);padding:0 0 12px;font-size:15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.actions button{border:0;border-radius:20px;padding:10px 15px;background:var(--soft);color:var(--text)}.actions .sub,.primary{background:var(--green);color:#fff}.actions .subscribed{background:#555;color:#fff;border:1px solid #555}.actions .subscribed:hover{background:#444}.actions .subscribed:hover{background:#c9c9c9}.channel{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.channel button{margin-left:auto}.shortgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.shortbig{aspect-ratio:9/15;border-radius:16px;overflow:hidden;position:relative;background:#111;color:#fff;cursor:pointer}.shortbig img{width:100%;height:100%;object-fit:cover}.shortbig p{position:absolute;bottom:5px;left:10px;right:10px;font-weight:bold}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:7vw;align-items:center}.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}.bottom .active{color:var(--green);font-weight:bold}.plus{width:48px;height:48px;border-radius:50%;background:var(--green)!important;color:#fff!important;font-size:27px}.createbox,.settings,.librarybox{background:var(--card);border-radius:20px;padding:25px;max-width:760px;margin:auto}.createbox input,.createbox textarea,.auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;background:var(--card);color:var(--text)}.createbox textarea{min-height:100px}.primary{border:0;border-radius:20px;padding:11px 20px;font-weight:bold}.modal{position:fixed;inset:0;background:#062c1db8;display:grid;place-items:center;z-index:20;padding:20px}.auth{background:var(--card);color:var(--text);border-radius:22px;padding:25px;width:min(410px,100%);position:relative}.close{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--text);font-size:27px}.auth .primary{width:100%}.switch{width:100%;border:0;background:none;color:var(--green);margin-top:10px}.row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line)}.row span:last-child{margin-left:auto}.listbtn{width:100%;text-align:left;border:0;background:var(--card);color:var(--text);padding:16px 5px;border-bottom:1px solid var(--line);font-size:16px}.empty{padding:30px;text-align:center;color:var(--muted)}.editbox{background:var(--card);border-radius:20px;padding:25px;max-width:760px;margin:auto}.editbox label{display:block;font-weight:600;margin:14px 0 6px}.editbox input,.editbox textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);box-sizing:border-box}.editbox textarea{min-height:130px;resize:vertical}.editAvatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#d9f2e4;display:grid;place-items:center;color:var(--green);font-size:30px;font-weight:bold;overflow:hidden;margin-bottom:8px}.editAvatar img{width:100%;height:100%;object-fit:cover}.settingPanel{margin:10px 0 18px;padding:14px;background:var(--soft);border-radius:14px}.settingPanel label{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.profileBox{display:flex;align-items:center;gap:15px;padding-bottom:18px;margin-bottom:8px;border-bottom:1px solid var(--line)}.profileBig{width:76px;height:76px;border-radius:50%;background:#d9f2e4;display:grid;place-items:center;color:var(--green);font-size:28px;font-weight:bold;overflow:hidden}.profileBig img{width:100%;height:100%;object-fit:cover}.uploadDock{position:fixed;right:12px;bottom:82px;z-index:15;width:min(420px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px}.uploadTask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 5px 22px #0002}.uploadTask .utop{display:flex;justify-content:space-between;gap:10px;font-size:13px}.uploadTask progress{width:100%;height:8px;margin-top:8px}.accountList{display:grid;gap:8px;margin:12px 0}.accountItem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;cursor:pointer}.accountItem small{display:block;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#fff8df;color:#6b5500;margin:10px 0}.dark .notice{background:#3a3219;color:#f1d86b}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.shortgrid{grid-template-columns:repeat(2,1fr)}.top{padding:10px 12px}.page{padding:18px 12px}.chips{padding-left:12px}.logo b{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.bottom{gap:0;justify-content:space-around}.search{max-width:none}.top{gap:8px}.top .logo{display:none}.sign{padding:9px 12px}}
</style></head><body><div id="app"><main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>Discover creators and videos you love.</span></section><h2>For You</h2><div class="grid"><div class="empty">Loading HYPER videos…</div></div></main></div>
<div class="bottom"><button data-tab="home">⌂<small>Home</small></button><button data-tab="shorts">◉<small>Shorts</small></button><button class="plus" data-tab="create">＋</button><button data-tab="subs">▣<small>Subscriptions</small></button><button data-tab="library">◌<small>Library</small></button></div>
<script>
const A='/api',demo=[
{id:1,title:'Meri Life Ka Safar | Village Vlog 2025',channel:'Hyper Vlogs',username:'hypervlogs',category:'Vlog',views:1200000,likes:28000,duration:'10:24',type:'video',thumbnail:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},
{id:2,title:'Mountains Calling | Travel Vlog',channel:'Explore More',username:'exploremore',category:'Vlog',views:856000,likes:19000,duration:'12:36',type:'video',thumbnail:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},
{id:3,title:'Life is better in green! ❤️',channel:'Hyper Vlogs',username:'hypervlogs',category:'Vlog',views:420000,likes:42000,duration:'0:25',type:'short',thumbnail:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},
{id:4,title:'HYPER Music Mix',channel:'HYPER Music',username:'hypermusic',category:'Music',views:980000,likes:52000,duration:'5:20',type:'video',thumbnail:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},
{id:5,title:'Gaming Highlights',channel:'Hyper Gaming',username:'hypergaming',category:'Gaming',views:1500000,likes:74000,duration:'8:15',type:'video',thumbnail:'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'}];
function safeGet(k,f=null){try{return localStorage.getItem(k)??f}catch(e){return f}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeRemove(k){try{localStorage.removeItem(k)}catch(e){}}
function safeJSON(v,f=null){try{return JSON.parse(v)}catch(e){return f}}
let videos=demo,tab=safeGet('hyper_tab','home')||'home',selected=null,channelUser=null,channelMode=safeGet('hyper_channel_mode','videos')||'videos',user=safeJSON(safeGet('hyper_user','null'),null),q='',libraryMode=safeGet('hyper_library_mode','history')||'history',uploadType='video',category=safeGet('hyper_category','All')||'All';
let savedRoute=safeJSON(safeGet('hyper_route','null'),null);
let subscriptionState=safeJSON(safeGet('hyper_subscriptions_'+(user?.username||'guest'),'{}'),{})||{};
const defaultSettings={dark:false,notifications:true,autoplay:true,dataSaver:false,wifiOnly:false,downloadQuality:'720p',private:false};
let uploadTasks=safeJSON(safeGet('hyper_upload_tasks','[]'),[]),accountList=safeJSON(safeGet('hyper_accounts','[]'),[]);
function persistUploadTasks(){safeSet('hyper_upload_tasks',JSON.stringify(uploadTasks.slice(-10)))}
let settingsState=safeJSON(safeGet('hyper_settings_'+(user?.username||'guest'),'null'),null)||{...defaultSettings};
function persist(){safeSet('hyper_settings_'+(user?.username||'guest'),JSON.stringify(settingsState));document.body.classList.toggle('dark',!!settingsState.dark)}persist();
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n||0;
async function api(p,o={}){let h=o.headers||{};let t=safeGet('hyper_token','');if(t)h={...h,Authorization:'Bearer '+t};let r=await fetch(A+p,{...o,headers:h});let text=await r.text(),d=safeJSON(text,{});if(!r.ok)throw Error(d.message||('Server error '+r.status));return d}
async function load(){try{let d=await api('/videos');if(Array.isArray(d)&&d.length)videos=d}catch(e){}await loadSubscriptions();await render()}
async function loadSubscriptions(){if(!user)return;try{let cs=await api('/me/subscriptions');subscriptionState={};cs.forEach(c=>subscriptionState[c.username]=true);safeSet('hyper_subscriptions_'+user.username,JSON.stringify(subscriptionState))}catch(e){}}
function avatarHtml(u,cls='ava'){return u&&u.avatar_url?`<div class="${cls}"><img src="${u.avatar_url}"></div>`:`<div class="${cls}">${(u?.channel_name||u?.display_name||u?.channel||'H')[0].toUpperCase()}</div>`}
function header(){return `<header class="top"><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div class="search"><input id="search" value="${escapeHtml(q)}" placeholder="Search videos, channels..."><button onclick="doSearch()">⌕</button></div>${user?`<div style="display:flex;align-items:center;gap:7px"><button class="sign" onclick="openChannel('${escapeHtml(user.username)}')">${user.avatar_url?`<img class="avatarImg" src="${mediaUrl(user.avatar_url)}">`:(user.display_name||'U')[0].toUpperCase()}</button><button class="sign" title="Switch account" onclick="auth('switch')">⇄</button><button class="sign" title="Settings" onclick="go('settings')">⚙️</button></div>`:`<div style="display:flex;align-items:center;gap:7px"><button class="sign" onclick="auth()">Sign in</button><button class="sign" title="Settings" onclick="go('settings')">⚙️</button></div>`}</header><nav class="chips">${['All','Discover','Popular','Entertainment','News','Education','Sports','Music','Gaming','Lifestyle','Creator'].map(x=>`<button class="${x===category?'on':''}" onclick="setCategory('${x}')">${x}</button>`).join('')}</nav>`}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function mediaUrl(u){if(!u)return '';return /^https?:\/\//i.test(u)?u:(location.origin+('/'+String(u).replace(/^\//,'')))}
function card(v){return `<article class="card" onclick="watch(${v.id})"><div class="thumb"><img src="${mediaUrl(v.thumbnail_url||v.thumbnail||'')}" loading="lazy"><span class="duration">${v.duration||''}</span></div><div class="meta" style="align-items:flex-start"><button onclick="event.stopPropagation();openChannel('${escapeHtml(v.username||'')}')" style="border:0;background:none;padding:0;cursor:pointer">${avatarHtml(v)}</button><div><h3>${escapeHtml(v.title)}</h3><button onclick="event.stopPropagation();openChannel('${escapeHtml(v.username||'')}')" style="border:0;background:none;padding:0;color:var(--muted);cursor:pointer">${escapeHtml(v.channel||v.display_name||'')}</button><small style="display:block;margin-top:5px">${fmt(v.views)} views • ${v.category||'Video'}</small></div></div></article>`}
function short(v){return `<article class="short" onclick="watch(${v.id})"><img src="${mediaUrl(v.thumbnail_url||v.thumbnail||'')}"><div><b>${escapeHtml(v.title)}</b><small>${fmt(v.views)} views</small></div></article>`}
async function render(){try{let html=header()+await main();let root=document.getElementById('app');if(root)root.innerHTML=html;renderUploadDock();document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s=document.getElementById('search');if(s)s.onkeydown=e=>{if(e.key==='Enter')doSearch()}}catch(e){console.error(e);let root=document.getElementById('app');if(root)root.innerHTML='<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>HYPER is ready. Refresh once to load videos.</span></section><div class="empty">Please refresh the page.</div></main>'}}
function filtered(){let list=videos.filter(v=>(v.title+' '+(v.channel||'')+' '+(v.category||'')).toLowerCase().includes(q.toLowerCase()));if(category==='All')return list;if(category==='Popular')return list.sort((a,b)=>(b.views||0)-(a.views||0));return list.filter(v=>(v.category||'').toLowerCase()===category.toLowerCase())}
function doSearch(){q=(document.getElementById('search')?.value||'').trim();tab='home';safeSet('hyper_tab','home');safeSet('hyper_route',JSON.stringify({type:'home'}));render()};function setCategory(x){category=x;q='';tab='home';safeSet('hyper_category',x);safeSet('hyper_tab','home');safeSet('hyper_route',JSON.stringify({type:'home',category:x}));render()}
async function openChannel(username){if(!username)return;channelUser=null;tab='channel';q='';safeSet('hyper_tab','channel');safeSet('hyper_route',JSON.stringify({type:'channel',username}));try{channelUser=await api('/channels/'+encodeURIComponent(username))}catch(e){channelUser={username,display_name:username,avatar_url:null}}await render()}
function channelVideos(){if(!channelUser)return [];return videos.filter(v=>(v.username||'').toLowerCase()===(channelUser.username||'').toLowerCase())}
async function main(){let list=filtered();if(tab==='home')return `<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>${category==='All'?'Explore everything on HYPER.':category+' videos for you.'}</span></section><h2>${category}</h2><div class="grid">${list.filter(v=>v.type!=='short').map(card).join('')||'<div class="empty">No videos found in this category.</div>'}</div><h2>Shorts</h2><div class="shortrow">${list.filter(v=>v.type==='short').map(short).join('')||'<div class="empty">No Shorts found.</div>'}</div></main>`;
if(tab==='shorts')return `<main class="page"><h1>Shorts</h1><div class="shortgrid">${videos.filter(v=>v.type==='short').map(v=>`<div class="shortbig" onclick="watch(${v.id})"><img src="${v.thumbnail_url||v.thumbnail}"><p>♥ ${fmt(v.likes)}<br>${escapeHtml(v.title)}</p></div>`).join('')}</div></main>`;
if(tab==='watch')return watchPage();if(tab==='create')return createPage();if(tab==='subs')return subsPage();if(tab==='settings')return settingsPage();if(tab==='editChannel')return editChannelPage();if(tab==='channel')return channelPage();return await libraryPage()}

async function channelPage(){let vs=channelVideos(),vids=vs.filter(v=>v.type!=='short'),shorts=vs.filter(v=>v.type==='short'),mine=user&&channelUser&&user.username===channelUser.username;let subscribed=false;if(user&&!mine&&channelUser?.username){try{subscribed=(await api('/channels/'+encodeURIComponent(channelUser.username)+'/subscribed')).subscribed===true}catch(e){subscribed=!!subscriptionState[channelUser.username]}}let subClass=subscribed?'subscribed':'sub',subText=subscribed?'Subscribed':'Subscribe';return `<main class="page"><button class="back" onclick="go('home')">← Back</button><section class="channelHeader" style="background:var(--card);border-radius:20px;padding:20px;margin-bottom:20px"><div style="display:flex;align-items:center;gap:15px"><button onclick="openChannel('${escapeHtml(channelUser.username)}')" style="border:0;background:none;padding:0;cursor:pointer">${avatarHtml(channelUser,'profileBig')}</button><div><h1 style="margin:0">${escapeHtml(channelUser.channel_name||channelUser.display_name||channelUser.username)}</h1><p class="muted">@${escapeHtml(channelUser.username||'')}</p><p class="muted" data-subscriber-count="${escapeHtml(channelUser.username||'')}">${fmt(channelUser.subscriber_count||0)} subscribers • ${fmt(vs.length)} uploads</p>${channelUser.channel_description?`<p style="margin:8px 0 0">${escapeHtml(channelUser.channel_description)}</p>`:''}</div></div><div class="actions"><button class="primary" onclick="channelMode='videos';safeSet('hyper_channel_mode','videos');render()">Videos</button><button onclick="channelMode='shorts';safeSet('hyper_channel_mode','shorts');render()">Shorts</button>${!mine&&user?`<button data-subscribe-channel="${escapeHtml(channelUser.username)}" class="${subClass}" onclick="subscribeChannel('${escapeHtml(channelUser.username)}')">${subText}</button>`:''}${mine?'<button onclick="go(\'editChannel\')">Edit Channel</button>':''}</div></section>${channelMode==='videos'?`<h2>Videos</h2><div class="grid">${vids.map(card).join('')||'<div class="empty">No videos yet.</div>'}</div>`:`<h2>Shorts</h2><div class="shortgrid">${shorts.map(v=>`<div class="shortbig" onclick="watch(${v.id})"><img src="${mediaUrl(v.thumbnail_url||v.thumbnail||'')}"><p>${escapeHtml(v.title)}</p></div>`).join('')||'<div class="empty">No Shorts yet.</div>'}</div>`}</main>`}
function watchPage(){let u=selected?.username||'',subscribed=!!subscriptionState[u];return `<main class="page watch"><button class="back" onclick="go('home')">← Back</button><video id="player" controls ${settingsState.autoplay?'autoplay':''} poster="${mediaUrl(selected.thumbnail_url||selected.thumbnail||'')}" src="${mediaUrl(selected.video_url)}"></video><div id="playerError" class="notice"></div><h1>${escapeHtml(selected.title)}</h1><p class="muted">${fmt(selected.views)} views • ${selected.category||'Video'}</p><div class="actions"><button onclick="like(${selected.id})">👍 ${fmt(selected.likes)}</button><button onclick="save(${selected.id})">🔖 Save</button>${user&&u&&user.username!==u?`<button data-subscribe-channel="${escapeHtml(u)}" class="${subscribed?'subscribed':'sub'}" onclick="subscribeChannel('${escapeHtml(u)}')">${subscribed?'Subscribed':'Subscribe'}</button>`:''}<button onclick="shareVideo()">↗ Share</button><button onclick="downloadVideo()">⬇️ Download</button></div><div class="channel"><button onclick="openChannel('${escapeHtml(u)}')" style="border:0;background:none;padding:0;cursor:pointer">${avatarHtml(selected)}</button><div onclick="openChannel('${escapeHtml(u)}')" style="cursor:pointer"><b>${escapeHtml(selected.channel||'HYPER Creator')}</b><p class="muted" data-subscriber-count="${escapeHtml(u)}">${fmt(selected.subscriber_count||0)} subscribers</p></div>${user&&u&&user.username!==u?`<button data-subscribe-channel="${escapeHtml(u)}" class="${subscribed?'subscribed':'sub'}" onclick="subscribeChannel('${escapeHtml(u)}')">${subscribed?'Subscribed':'Subscribe'}</button>`:''}</div><h2>Comments</h2><div id="comments"><p class="muted">Loading comments...</p></div>${user?`<div class="actions"><input id="commentText" placeholder="Add a comment" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:20px"><button class="primary" onclick="comment()">Comment</button></div>`:''}</main>`}
function createPage(){return `<main class="page"><h1>Create</h1><div class="createbox">${!user?'<div class="notice">Please sign in or create an account before uploading.</div>':''}<h2>Upload a video</h2><input id="title" placeholder="Video title"><textarea id="desc" placeholder="Description"></textarea><label>Video file<input id="video" type="file" accept="video/*"></label><label>Thumbnail<input id="thumb" type="file" accept="image/*"></label><label>HYPER Category<select id="cat" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)"><option>Discover</option><option>Popular</option><option>Entertainment</option><option>News</option><option>Education</option><option>Sports</option><option>Music</option><option>Gaming</option><option>Lifestyle</option><option>Creator</option></select></label><p><button onclick="setType('video')">Video</button> <button onclick="setType('short')">Short</button></p><button class="primary" onclick="upload()">Start Upload</button></div></main>`}
function subsPage(){return `<main class="page"><h1>Subscriptions</h1><div class="settings">${['Hyper Vlogs','TechZone','Gaming with R&J','Mr. Indian Hacker','Triggered Insaan'].map(x=>`<div class="row"><div class="ava">${x[0]}</div><b>${x}</b><span>Subscribed</span></div>`).join('')}</div></main>`}
function settingsPage(){return `<main class="page"><button class="back" onclick="go('home')">← Back to Home</button><h1>Settings</h1><div class="settings"><section class="settingPanel"><h2 style="margin-top:0">Account & Channel</h2>${user?`<div class="profileBox">${avatarHtml(user,'profileBig')}<div><h3 style="margin:0">${escapeHtml(user.channel_name||user.display_name||'HYPER Channel')}</h3><p class="muted">@${escapeHtml(user.username||'')}</p><p class="muted">${escapeHtml(user.email||'')}</p></div></div><button class="listbtn" onclick="openChannel('${escapeHtml(user.username)}')">📺 Open My Channel</button><button class="listbtn" onclick="go('editChannel')">✏️ Edit Profile & Channel</button><button class="listbtn" onclick="auth('signup')">➕ Create Another Account / Channel</button><button class="listbtn" onclick="auth('signin')">🔄 Sign in to Another Account</button><button class="listbtn" onclick="auth('switch')">⇄ Switch account</button><button class="listbtn" onclick="logout()">🚪 Log out</button>`:`<button class="listbtn" onclick="auth('signin')">👤 Sign in / Create account</button><button class="listbtn" onclick="auth('signup')">➕ Create New Channel</button>`}</section><section class="settingPanel"><h2 style="margin-top:0">App Settings</h2><button class="listbtn" onclick="toggleSetting('notifications')">🔔 Notifications <span>${settingsState.notifications?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('dark')">🌙 Dark / Light Mode <span>${settingsState.dark?'Dark':'Light'}</span></button><button class="listbtn" onclick="toggleSetting('autoplay')">▶️ Autoplay <span>${settingsState.autoplay?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('dataSaver')">📶 Data Saver <span>${settingsState.dataSaver?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('wifiOnly')">⬇️ Download on Wi‑Fi only <span>${settingsState.wifiOnly?'On':'Off'}</span></button><button class="listbtn" onclick="downloadQuality()">🎞️ Download Quality <span>${settingsState.downloadQuality}</span></button><button class="listbtn" onclick="toggleSetting('private')">🔒 Private Account <span>${settingsState.private?'On':'Off'}</span></button><button class="listbtn" onclick="alert('Your HYPER privacy controls are stored on this device.')">🛡️ Privacy</button><button class="listbtn" onclick="alert('HYPER Help & feedback')">❓ Help & feedback</button><button class="listbtn" onclick="alert('HYPER version 1.2.5')">ℹ️ About HYPER</button></section></div></main>`}
function editChannelPage(){if(!user)return `<main class="page"><div class="editbox"><h1>Edit Profile & Channel</h1><button class="primary" onclick="auth()">Sign in</button></div></main>`;return `<main class="page"><button class="back" onclick="returnToMyChannel()">← Back to Channel</button><div class="editbox"><h1>Edit Profile & Channel</h1><p class="muted">Profile picture, user name and channel details are edited here. After saving, HYPER returns to your channel.</p><label>Profile Picture</label><div id="editAvatarPreview" class="editAvatar">${user.avatar_url?`<img src="${user.avatar_url}">`:(user.full_name||user.display_name||'U')[0].toUpperCase()}</div><input id="editAvatarInput" type="file" accept="image/*" onchange="previewEditAvatar(event)"><label>User Name</label><input id="fullNameInput" value="${escapeHtml(user.full_name||user.display_name||'')}" placeholder="Your name"><label>Channel Name</label><input id="channelNameInput" value="${escapeHtml(user.channel_name||user.display_name||'')}" placeholder="Channel name"><label>Channel Description</label><textarea id="channelDescriptionInput" maxlength="500" placeholder="Tell viewers about your channel">${escapeHtml(user.channel_description||'')}</textarea><div class="actions"><button class="primary" onclick="saveChannelEdits()">Save Changes</button><button onclick="returnToMyChannel()">Cancel</button></div></div></main>`}
function returnToMyChannel(){openChannel(user?.username)}
function previewEditAvatar(e){let f=e.target.files?.[0];if(!f)return;if(f.size>800000)return alert('Profile picture should be under 800 KB');let r=new FileReader();r.onload=()=>{document.getElementById('editAvatarPreview').innerHTML=`<img src="${r.result}">`;window.pendingAvatar=r.result};r.readAsDataURL(f)}
async function saveChannelEdits(){if(!user)return auth();let fn=(document.getElementById('fullNameInput')?.value||'').trim(),cn=(document.getElementById('channelNameInput')?.value||'').trim(),cd=(document.getElementById('channelDescriptionInput')?.value||'').trim();if(fn.length<2||fn.length>100)return alert('User name must be 2-100 characters');if(cn.length<2||cn.length>100)return alert('Channel name must be 2-100 characters');if(cd.length>500)return alert('Description must be 500 characters or less');try{let x=await api('/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:fn,channel_name:cn,channel_description:cd,avatar_url:window.pendingAvatar||''})});user=x.user;safeSet('hyper_user',JSON.stringify(user));window.pendingAvatar='';await openChannel(user.username);alert('Profile & channel updated')}catch(e){alert(e.message)}}

async function libraryPage(){if(!user)return `<main class="page"><button class="back" onclick="go('home')">← Back to Home</button><h1>Library</h1><div class="librarybox"><h3>Your Library</h3><p>Watch history, liked videos, saved videos, downloads and your uploads are available after login.</p><button class="primary" onclick="auth()">Sign in / Create account</button></div></main>`;let data=[];try{let endpoint=libraryMode==='history'?'/me/history':libraryMode==='liked'?'/me/liked':libraryMode==='saved'?'/me/saved':'/me/videos';if(libraryMode!=='downloads')data=await api(endpoint)}catch{}if(libraryMode==='downloads')data=safeJSON(safeGet('hyper_downloads','[]'),[]);let names={history:'Watch History',downloads:'Downloaded Videos',liked:'Liked Videos',saved:'Watch Later / Saved',mine:'Your Videos'};return `<main class="page"><button class="back" onclick="go('home')">← Back to Home</button><h1>Library</h1><div class="librarybox"><button class="listbtn" onclick="lib('history')">🕘 Watch History</button><button class="listbtn" onclick="lib('downloads')">⬇️ Downloaded Videos</button><button class="listbtn" onclick="lib('liked')">❤️ Liked Videos</button><button class="listbtn" onclick="lib('saved')">🔖 Watch Later / Saved</button><button class="listbtn" onclick="lib('mine')">📤 Your Videos</button></div><h2>${names[libraryMode]}</h2><div class="grid">${data.length?data.map(card).join(''):'<div class="empty">No videos here yet.</div>'}</div></main>`}
function lib(x){libraryMode=x;safeSet('hyper_library_mode',x);safeSet('hyper_route',JSON.stringify({type:'library',mode:x}));render()};function go(x){tab=x;safeSet('hyper_tab',x);if(x==='home'||x==='shorts'||x==='subs'||x==='library'||x==='create'||x==='settings'||x==='editChannel')safeSet('hyper_route',JSON.stringify({type:x,mode:x==='library'?libraryMode:undefined}));render()};function setType(x){uploadType=x}
async function watch(id){selected=videos.find(v=>v.id==id);if(!selected)return;tab='watch';safeSet('hyper_tab','watch');safeSet('hyper_route',JSON.stringify({type:'watch',id}));await render();if(user)api('/videos/'+id+'/history',{method:'POST'}).catch(()=>{});setTimeout(()=>{let el=document.getElementById('player');if(el){el.onerror=()=>{let e=document.getElementById('playerError');if(e)e.innerHTML='Video load nahi ho raha. Network ya server storage check karein.';};el.onloadeddata=()=>{let e=document.getElementById('playerError');if(e)e.innerHTML=''};}loadComments()},250)}
async function loadComments(){if(!selected)return;try{let d=await api('/videos/'+selected.id+'/comments');document.getElementById('comments').innerHTML=d.length?d.map(c=>`<p><b>${escapeHtml(c.display_name||'User')}</b>: ${escapeHtml(c.text)}</p>`).join(''):'<p class="muted">No comments yet.</p>'}catch{if(document.getElementById('comments'))document.getElementById('comments').innerHTML='<p class="muted">Comments available after database connection.</p>'}}
async function comment(){let el=document.getElementById('commentText'),text=el?.value.trim();if(!text)return;if(!user)return auth();try{await api('/videos/'+selected.id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});el.value='';loadComments()}catch(e){alert(e.message)}}
async function like(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/like',{method:'POST'});selected.likes=r.likes;render()}catch(e){alert(e.message)}}
async function save(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/save',{method:'POST'});alert(r.saved?'Saved to Watch Later':'Removed from Watch Later')}catch(e){alert(e.message)}}
async function subscribeChannel(username){if(!user)return auth();if(!username||username===user.username)return;let old=!!subscriptionState[username],next=!old;subscriptionState[username]=next;document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=next?'subscribed':'sub';b.textContent=next?'Subscribed':'Subscribe'});let countEls=[...document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]')];let base=(channelUser?.username===username?channelUser.subscriber_count:(selected?.username===username?selected.subscriber_count:0))||0;let optimistic=Math.max(0,base+(next?1:-1));countEls.forEach(e=>e.textContent=fmt(optimistic)+' subscribers');try{let r=await api('/channels/'+encodeURIComponent(username)+'/subscribe',{method:'POST'});subscriptionState[username]=!!r.subscribed;safeSet('hyper_subscriptions_'+user.username,JSON.stringify(subscriptionState));if(channelUser?.username===username)channelUser.subscriber_count=r.subscriber_count;if(selected?.username===username)selected.subscriber_count=r.subscriber_count;document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=r.subscribed?'subscribed':'sub';b.textContent=r.subscribed?'Subscribed':'Subscribe'});document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]').forEach(e=>e.textContent=fmt(r.subscriber_count)+' subscribers');}catch(e){subscriptionState[username]=old;safeSet('hyper_subscriptions_'+user.username,JSON.stringify(subscriptionState));document.querySelectorAll('[data-subscribe-channel=\"'+CSS.escape(username)+'\"]').forEach(b=>{b.className=old?'subscribed':'sub';b.textContent=old?'Subscribed':'Subscribe'});document.querySelectorAll('[data-subscriber-count=\"'+CSS.escape(username)+'\"]').forEach(e=>e.textContent=fmt(base)+' subscribers');alert(e.message)}}
async function subscribe(id){let v=videos.find(x=>x.id==id)||selected;if(v)await subscribeChannel(v.username)}
function shareVideo(){if(navigator.share)navigator.share({title:selected.title,url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied'))}
function downloadVideo(){if(settingsState.wifiOnly&&navigator.connection&&!['wifi','ethernet'].includes(navigator.connection.type))return alert('Download on Wi‑Fi only is ON');let a=document.createElement('a');a.href=selected.video_url;a.download=(selected.title||'HYPER-video').replace(/[^a-z0-9]/gi,'_')+'.mp4';a.target='_blank';document.body.appendChild(a);a.click();a.remove();let d=safeJSON(safeGet('hyper_downloads','[]'),[]);if(!d.some(x=>x.id===selected.id)){d.unshift(selected);safeSet('hyper_downloads',JSON.stringify(d))}alert('Download started')}

function queueBackgroundUpload(task){return new Promise((resolve,reject)=>{try{const r=indexedDB.open('hyper-upload-queue',1);r.onupgradeneeded=()=>r.result.createObjectStore('tasks',{keyPath:'id'});r.onsuccess=()=>{const db=r.result,tx=db.transaction('tasks','readwrite');tx.objectStore('tasks').put(task);tx.oncomplete=()=>{navigator.serviceWorker?.ready.then(reg=>reg.sync?.register('hyper-upload')).catch(()=>{});resolve()};tx.onerror=()=>reject(tx.error)};r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function removeBackgroundUpload(id){try{const r=indexedDB.open('hyper-upload-queue',1);r.onsuccess=()=>{const tx=r.result.transaction('tasks','readwrite');tx.objectStore('tasks').delete(id)}}catch(e){}}
function renderUploadDock(){uploadTasks.forEach(x=>{if(x.status==='uploading'&&!x._live){x.status='paused';x.message='Upload paused — page was refreshed. Please start this upload again.'}});persistUploadTasks();let el=document.getElementById('uploadDock');if(!el){el=document.createElement('div');el.id='uploadDock';el.className='uploadDock';document.body.appendChild(el)}el.innerHTML=uploadTasks.filter(x=>x.status==='uploading'||x.status==='done'||x.status==='error'||x.status==='paused').slice(-5).map(x=>`<div class="uploadTask"><div class="utop"><b>${escapeHtml(x.title)}</b><span>${x.status==='uploading'?x.progress+'%':x.status==='paused'?'Paused':x.status==='done'?'Done':'Failed'}</span></div><progress max="100" value="${x.progress||0}"></progress><small class="muted">${escapeHtml(x.message||'')}</small></div>`).join('')}
async function startUpload(){if(!user)return auth();let f=document.getElementById('video')?.files?.[0];if(!f)return alert('Select a video');if(f.size>250*1024*1024)return alert('Video must be 250 MB or smaller');let title=(document.getElementById('title')?.value||'Untitled').trim(),desc=document.getElementById('desc')?.value||'',type=uploadType==='short'?'short':'video',cat=document.getElementById('cat')?.value||'Discover',t=document.getElementById('thumb')?.files?.[0],id=Date.now()+Math.random();let task={id,title,progress:0,status:'uploading',message:'Uploading...',_live:true};uploadTasks.push(task);persistUploadTasks();renderUploadDock();try{await queueBackgroundUpload({id,title,description:desc,type,category:cat,file:f,filename:f.name,thumbnail:t||null,thumbnailName:t?.name||'',token:safeGet('hyper_token','')})}catch(e){}let d=new FormData();d.append('title',title);d.append('description',desc);d.append('type',type);d.append('category',cat);d.append('video',f);if(t)d.append('thumbnail',t);let xhr=new XMLHttpRequest();xhr.open('POST',A+'/videos');let token=safeGet('hyper_token','');if(token)xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=e=>{if(e.lengthComputable){task.progress=Math.round(e.loaded/e.total*100);task.message='Uploading...';persistUploadTasks();renderUploadDock()}};xhr.onload=async()=>{let data=safeJSON(xhr.responseText,{});if(xhr.status>=200&&xhr.status<300){removeBackgroundUpload(id);task._live=false;task.progress=100;task.status='done';task.message='Published successfully';persistUploadTasks();renderUploadDock();await load();let form=document.querySelector('.createbox');if(form)form.querySelectorAll('input[type=file]').forEach(i=>i.value='')}else{task._live=false;task.status='error';task.message=data.message||'Publish failed';persistUploadTasks();renderUploadDock()}};xhr.onerror=()=>{task._live=false;task.status='error';task.message='Network error. Background upload will retry when possible.';persistUploadTasks();renderUploadDock();navigator.serviceWorker?.ready.then(reg=>reg.sync?.register('hyper-upload')).catch(()=>{})};xhr.send(d)}
function upload(){startUpload()}

function toggleSetting(k){settingsState[k]=!settingsState[k];persist();render()};function downloadQuality(){let a=['360p','480p','720p','1080p'],i=a.indexOf(settingsState.downloadQuality);settingsState.downloadQuality=a[(i+1)%a.length];persist();render()}
function saveAccounts(){safeSet('hyper_accounts',JSON.stringify(accountList.slice(-8)))}
function setActiveAccount(u,t){user=u;safeSet('hyper_token',t);safeSet('hyper_user',JSON.stringify(u));let i=accountList.findIndex(a=>a.username===u.username);let item={username:u.username,email:u.email,display_name:u.display_name,channel_name:u.channel_name,avatar_url:u.avatar_url,token:t};if(i>=0)accountList[i]=item;else accountList.push(item);saveAccounts();settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_'+u.username,'null'),null)||{})};persist()}
function switchAccount(username){let a=accountList.find(x=>x.username===username);if(!a)return;if(a.token){setActiveAccount(a,a.token);document.getElementById('modal')?.remove();go('channel');openChannel(a.username)}else signinForm()}
function accountSwitcher(){if(!accountList.length)return '<p class="muted">No saved accounts yet. Sign in once to add this device account.</p>';return '<h3>Switch account</h3><div class="accountList">'+accountList.map(a=>`<button class="accountItem" onclick="switchAccount('${escapeHtml(a.username)}')">${avatarHtml(a)}<span><b>${escapeHtml(a.channel_name||a.display_name||a.username)}</b><small>${escapeHtml(a.email||a.username)}</small></span></button>`).join('')+'</div><button class="switch" onclick="signupForm()">＋ Add another account</button>'}
function auth(mode='signin'){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="document.getElementById('modal')?.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div id="authbox"></div></div></div>`);mode==='signup'?signupForm():mode==='switch'?(authbox.innerHTML=accountSwitcher()+'<button class="switch" onclick="signinForm()">Sign in with another account</button>'):signinForm()}
function signinForm(){authbox.innerHTML=accountSwitcher()+'<h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signupForm()">Create account</button>'}
function signupForm(){authbox.innerHTML='<h2>Create account</h2><input id="display" placeholder="Full name"><input id="username" placeholder="Username (letters, numbers, _)\"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="primary" onclick="register()">Create account</button><button class="switch" onclick="signinForm()">Already have an account? Sign in</button>'}
async function register(){try{let r=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:display.value,username:username.value,email:email.value,password:pass.value})});setActiveAccount(r.user,r.token);modal.remove();go('channel');openChannel(user.username);alert('Account created successfully')}catch(e){alert(e.message)}}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});setActiveAccount(r.user,r.token);modal.remove();openChannel(user.username)}catch(e){alert(e.message)}}
function logout(){safeRemove('hyper_token');safeRemove('hyper_user');user=null;settingsState={...defaultSettings,...(safeJSON(safeGet('hyper_settings_guest','null'),null)||{})};persist();go('home')}
document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
async function restoreRoute(){try{if(savedRoute?.type==='channel'&&savedRoute.username){await openChannel(savedRoute.username);return}if(savedRoute?.type==='watch'&&savedRoute.id){selected=videos.find(v=>String(v.id)===String(savedRoute.id));if(selected){tab='watch';await render();setTimeout(loadComments,250);return}}if(savedRoute?.type==='library'){tab='library';libraryMode=savedRoute.mode||libraryMode}if(savedRoute?.type==='home'&&savedRoute.category)category=savedRoute.category;await render()}catch(e){console.error(e);await render()}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
load().then(()=>restoreRoute());
</script></body></html>
