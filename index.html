<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYPER</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7faf8;color:#10251b;padding-bottom:82px}.top{height:70px;display:flex;align-items:center;gap:16px;padding:10px 4%;background:#fff;position:sticky;top:0;z-index:7;border-bottom:1px solid #e3eee7}.logo{display:flex;align-items:center;gap:8px;color:#087f3e;font-size:21px}.mark{width:40px;height:40px;border-radius:11px;background:#087f3e;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:25px}.search{flex:1;max-width:680px;margin:auto;display:flex;border:1px solid #d7e5dc;border-radius:24px;overflow:hidden;background:#f9fcfa}.search input{flex:1;border:0;background:transparent;padding:11px 17px;outline:0}.search button{border:0;background:transparent;padding:0 15px;font-size:20px}.sign{border:0;background:#087f3e;color:#fff;padding:10px 17px;border-radius:22px;font-weight:bold}.chips{display:flex;gap:9px;padding:11px 4%;background:#fff;overflow:auto}.chips button{border:0;border-radius:18px;padding:9px 15px;white-space:nowrap}.chips .on{background:#087f3e;color:#fff}.page{max-width:1200px;margin:auto;padding:24px 4%}.hero{background:linear-gradient(120deg,#063c24,#0aa04d);color:#fff;border-radius:24px;padding:30px;margin-bottom:28px}.hero h1{margin:5px 0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px #0b5b3210}.thumb{position:relative;aspect-ratio:16/9}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:8px;bottom:7px;background:#111;color:#fff;padding:4px;border-radius:4px;font-size:11px}.meta{display:flex;gap:10px;padding:12px}.ava{width:34px;height:34px;border-radius:50%;background:#d9f2e4;color:#087f3e;display:grid;place-items:center;font-weight:bold;flex:none}.meta h3{font-size:15px;margin:0 0 5px}.meta p,.meta small,.muted{color:#718078;font-size:12px;margin:0}.shortrow{display:flex;gap:14px;overflow:auto}.short{width:190px;aspect-ratio:9/14;position:relative;flex:none;border-radius:15px;overflow:hidden;color:#fff;cursor:pointer}.short img{width:100%;height:100%;object-fit:cover}.short div{position:absolute;bottom:0;left:0;right:0;padding:35px 10px 10px;background:linear-gradient(transparent,#000c)}.watch video{width:100%;max-height:650px;background:#000;border-radius:16px}.back{border:0;background:none;color:#087f3e;padding:0 0 12px;font-size:15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.actions button{border:0;border-radius:20px;padding:10px 15px;background:#edf6ef}.actions .sub,.primary{background:#087f3e;color:#fff}.channel{display:flex;align-items:center;gap:12px;border-bottom:1px solid #dfe9e3;padding:15px 0}.channel button{margin-left:auto}.shortgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.shortbig{aspect-ratio:9/15;border-radius:16px;overflow:hidden;position:relative;background:#111;color:#fff;cursor:pointer}.shortbig img{width:100%;height:100%;object-fit:cover}.shortbig p{position:absolute;bottom:5px;left:10px;right:10px;font-weight:bold}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e2ece6;display:flex;justify-content:center;gap:7vw;align-items:center}.bottom button{border:0;background:none;color:#687b71;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom .active{color:#087f3e;font-weight:bold}.plus{width:48px;height:48px;border-radius:50%;background:#087f3e!important;color:#fff!important;font-size:27px}.createbox,.settings,.librarybox{background:#fff;border-radius:20px;padding:25px;max-width:700px;margin:auto}.createbox input,.createbox textarea,.auth input{width:100%;padding:12px;border:1px solid #d7e5dc;border-radius:11px;margin:6px 0 12px}.createbox textarea{min-height:100px}.primary{border:0;border-radius:20px;padding:11px 20px;font-weight:bold}.modal{position:fixed;inset:0;background:#062c1db8;display:grid;place-items:center;z-index:20;padding:20px}.auth{background:#fff;border-radius:22px;padding:25px;width:min(410px,100%);position:relative}.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:27px}.auth .primary{width:100%}.switch{width:100%;border:0;background:none;color:#087f3e;margin-top:10px}.row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #edf1ee}.row span:last-child{margin-left:auto}.listbtn{width:100%;text-align:left;border:0;background:#fff;padding:16px 5px;border-bottom:1px solid #edf1ee;font-size:16px}.empty{padding:30px;text-align:center;color:#718078}.profilehead{display:flex;align-items:center;gap:15px;margin-bottom:18px}.profilepic{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#d9f2e4;display:grid;place-items:center;color:#087f3e;font-size:32px;font-weight:bold}.profilebox input,.profilebox textarea{width:100%;padding:12px;border:1px solid #d7e5dc;border-radius:11px;margin:6px 0 12px}.profilebox textarea{min-height:90px}.tiny{font-size:12px;color:#718078}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.shortgrid{grid-template-columns:repeat(2,1fr)}.top{padding:10px 12px}.page{padding:18px 12px}.chips{padding-left:12px}.logo b{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.bottom{gap:0;justify-content:space-around}.search{max-width:none}.top{gap:8px}}
</style></head><body><div id="app"></div>
<div class="bottom"><button data-tab="home">⌂<small>Home</small></button><button data-tab="shorts">◉<small>Shorts</small></button><button class="plus" data-tab="create">＋</button><button data-tab="library">◌<small>Library</small></button><button data-tab="settings">👤<small>Profile</small></button></div>
<script>
const A='/api',demo=[{id:1,title:'Meri Life Ka Safar | Village Vlog 2025',channel:'Hyper Vlogs',views:1200000,likes:28000,duration:'10:24',type:'video',thumbnail:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},{id:2,title:'Mountains Calling | Travel Vlog',channel:'Explore More',views:856000,likes:19000,duration:'12:36',type:'video',thumbnail:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},{id:3,title:'Life is better in green! ❤️',channel:'Hyper Vlogs',views:420000,likes:42000,duration:'0:25',type:'short',thumbnail:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'}];
let videos=demo,tab='home',selected=null,user=JSON.parse(localStorage.getItem('hyper_user')||'null'),q='',category='For You',libraryMode='history',uploadType='video',libraryData=[];
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n||0;
async function api(p,o={}){let h=o.headers||{};let t=localStorage.getItem('hyper_token');if(t)h={...h,Authorization:'Bearer '+t};let r=await fetch(A+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
async function load(){try{let d=await api('/videos');if(d.length)videos=d}catch{}render()}
function header(){return `<header class="top"><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div class="search"><input id="search" value="${q}" placeholder="Search videos, channels..."><button>⌕</button></div>${user?`<button class="sign" onclick="go('settings')">${(user.display_name||'U')[0].toUpperCase()}</button>`:`<button class="sign" onclick="auth()">Sign in</button>`}</header><nav class="chips">${['For You','Trending','Music','Gaming','Vlog'].map(x=>`<button class="${x===category?'on':''}" onclick="setCategory('${x}')">${x}</button>`).join('')}</nav>`}
function card(v){return `<article class="card" onclick="watch(${v.id})"><div class="thumb"><img src="${v.thumbnail||''}"><span class="duration">${v.duration||''}</span></div><div class="meta"><div class="ava">${(v.channel||'H')[0]}</div><div><h3>${v.title}</h3><p>${v.channel||''}</p><small>${fmt(v.views)} views</small></div></div></article>`}
function short(v){return `<article class="short" onclick="watch(${v.id})"><img src="${v.thumbnail}"><div><b>${v.title}</b><small>${fmt(v.views)} views</small></div></article>`}
function render(){document.getElementById('app').innerHTML=header()+main();document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s=document.getElementById('search');if(s)s.oninput=e=>{q=e.target.value;render()};if(tab==='library'&&user)loadLibrary()}
function main(){
 let list=videos.filter(v=>(v.title+' '+(v.channel||'')).toLowerCase().includes(q.toLowerCase()));
 if(category==='Trending') list=[...list].sort((a,b)=>(b.views||0)-(a.views||0));
 if(category==='Music') list=list.filter(v=>/music|song|dj|music|gana|sing/i.test(v.title+' '+(v.channel||'')));
 if(category==='Gaming') list=list.filter(v=>/gaming|game|gamer|bgmi|free fire|minecraft|pubg|gta/i.test(v.title+' '+(v.channel||'')));
 if(category==='Vlog') list=list.filter(v=>/vlog|travel|village|life/i.test(v.title+' '+(v.channel||'')));
 if(tab==='home')return `<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>Discover creators and videos you love.</span></section><h2>${category}</h2><div class="grid">${list.filter(v=>v.type!=='short').map(card).join('')||'<div class="empty">No videos in this category yet.</div>'}</div><h2>Shorts</h2><div class="shortrow">${list.filter(v=>v.type==='short').map(short).join('')||'<div class="empty">No Shorts yet.</div>'}</div></main>`;
 if(tab==='shorts')return `<main class="page"><h1>Shorts</h1><div class="shortgrid">${videos.filter(v=>v.type==='short').map(v=>`<div class="shortbig" onclick="watch(${v.id})"><img src="${v.thumbnail}"><p>♥ ${fmt(v.likes)}<br>${v.title}</p></div>`).join('')}</div></main>`;
 if(tab==='watch')return `<main class="page watch"><button class="back" onclick="go('home')">← Back</button><video id="player" controls poster="${selected.thumbnail||''}" src="${selected.video_url}"></video><h1>${selected.title}</h1><p class="muted">${fmt(selected.views)} views</p><div class="actions"><button onclick="like(${selected.id})">👍 ${fmt(selected.likes)}</button><button onclick="save(${selected.id})">🔖 Save</button><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button><button onclick="shareVideo()">↗ Share</button><button onclick="downloadVideo()">⬇️ Download</button></div><div class="channel"><div class="ava" style="width:48px;height:48px">${(selected.channel||'H')[0]}</div><b>${selected.channel||''}</b><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button></div><h2>Comments</h2><p>❤️ Great video! Keep going!</p></main>`;
 if(tab==='create')return `<main class="page"><h1>Create</h1><div class="createbox"><h2>Upload a video</h2>${!user?'<p>Please sign in or create an account before uploading.</p>':''}<label>Title<input id="title" placeholder="Video title"></label><label>Description<textarea id="desc" placeholder="Description"></textarea></label><label>Video file<input id="video" type="file" accept="video/*"></label><label>Thumbnail (optional)<input id="thumb" type="file" accept="image/*"></label><p><button onclick="setType('video')">Video</button> <button onclick="setType('short')">Short</button></p><button id="publish" class="primary" onclick="upload()">Publish</button><p class="tiny">पहली बार 20–50 MB की छोटी MP4 से test करें।</p></div></main>`;
 if(tab==='subs')return `<main class="page"><h1>Subscriptions</h1><div class="settings">${['Hyper Vlogs','TechZone','Gaming with R&J'].map(x=>`<div class="row"><div class="ava">${x[0]}</div><b>${x}</b><span>Subscribed</span></div>`).join('')}</div></main>`;
 if(tab==='settings')return settings();
 if(tab==='profile')return profile();
 return library();
}
function settings(){return `<main class="page"><h1>Profile & Settings</h1><div class="settings">${user?`<button class="listbtn" onclick="go('profile')"><div class="profilehead"><div class="profilepic">${user.avatar_url?`<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:(user.display_name||'U')[0].toUpperCase()}</div><div><b>${user.display_name||'HYPER User'}</b><p class="muted">@${user.username||''}</p></div></div></button>`:`<button class="listbtn" onclick="auth()">👤 Sign in / Create account</button>`}<button class="listbtn" onclick="go('profile')">👤 Profile</button><button class="listbtn" onclick="alert('Notifications settings saved')">🔔 Notifications</button><button class="listbtn" onclick="toggleTheme()">🌙 Dark / Light Mode</button><button class="listbtn" onclick="alert('Privacy settings')">🔒 Privacy</button><button class="listbtn" onclick="alert('Data Saver: On')">📶 Data Saver</button>${user?'<button class="primary" onclick="logout()">Log out</button>':''}</div></main>`}
function profile(){if(!user)return `<main class="page"><h1>Profile</h1><div class="profilebox createbox"><button class="primary" onclick="auth()">Sign in</button></div></main>`;return `<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1>Edit Profile</h1><div class="profilebox createbox"><div class="profilehead"><div id="profilepreview" class="profilepic">${user.avatar_url?`<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:(user.display_name||'U')[0].toUpperCase()}</div><div><b>${user.display_name||'HYPER User'}</b><p class="tiny">Profile photo optional</p></div></div><label>Profile photo<input id="avatar" type="file" accept="image/*"></label><label>Name<input id="pname" value="${user.display_name||''}" maxlength="100"></label><label>Username<input id="pusername" value="${user.username||''}" maxlength="50"></label><label>Bio<textarea id="pbio" placeholder="About you">${user.bio||''}</textarea></label><label>Channel banner (optional)<input id="banner" type="file" accept="image/*"></label><button class="primary" onclick="saveProfile()">Save Profile</button></div></main>`}
function library(){
 if(!user)return `<main class="page"><h1>Library</h1><div class="librarybox"><h3>Your Library</h3><p>History, Downloads, Liked, Watch Later and Your Videos.</p><button class="primary" onclick="auth()">Sign in / Create account</button></div></main>`;
 let data=libraryData;if(libraryMode==='downloads')data=JSON.parse(localStorage.getItem('hyper_downloads')||'[]');
 return `<main class="page"><h1>Library</h1><div class="librarybox"><button class="listbtn" onclick="lib('history')">🕘 History</button><button class="listbtn" onclick="lib('downloads')">⬇️ Downloads</button><button class="listbtn" onclick="lib('liked')">❤️ Liked</button><button class="listbtn" onclick="lib('saved')">🔖 Watch Later</button><button class="listbtn" onclick="lib('mine')">📤 Your Videos</button></div><h2>${({history:'History',downloads:'Downloads',liked:'Liked',saved:'Watch Later',mine:'Your Videos'})[libraryMode]}</h2><div class="grid">${data.length?data.map(card).join(''):'<div class="empty">No videos here yet.</div>'}</div></main>`;
}
async function loadLibrary(){try{let endpoint=libraryMode==='history'?'/me/history':libraryMode==='liked'?'/me/liked':libraryMode==='saved'?'/me/saved':'/me/videos';if(libraryMode!=='downloads')libraryData=await api(endpoint);render()}catch(e){libraryData=[];render()}}
function lib(x){libraryMode=x;render()}
function go(x){tab=x;render()} function setType(x){uploadType=x}
function setCategory(x){category=x;render()}
function toggleTheme(){let dark=document.body.dataset.dark==='1';document.body.dataset.dark=dark?'0':'1';document.body.style.background=dark?'#f7faf8':'#101614';document.body.style.color=dark?'#10251b':'#eef7f1';localStorage.setItem('hyper_theme',dark?'light':'dark');alert(dark?'Light mode':'Dark mode')}
function watch(id){selected=videos.find(v=>v.id==id);if(!selected)return;tab='watch';render();if(user&&!selected.demo)api('/videos/'+id+'/history',{method:'POST'}).catch(()=>{})}
async function like(id){if(!user)return auth();if(selected?.demo){selected.likes=(selected.likes||0)+1;return render()}try{let r=await api('/videos/'+id+'/like',{method:'POST'});selected.likes=r.likes}catch(e){alert(e.message)}render()}
async function save(id){if(!user)return auth();if(selected?.demo){let d=JSON.parse(localStorage.getItem('hyper_saved')||'[]');let exists=d.some(x=>x.id===selected.id);d=exists?d.filter(x=>x.id!==selected.id):[selected,...d];localStorage.setItem('hyper_saved',JSON.stringify(d));return alert(exists?'Removed from Watch Later':'Saved to Watch Later')}try{let r=await api('/videos/'+id+'/save',{method:'POST'});alert(r.saved?'Saved to Watch Later':'Removed from Watch Later')}catch(e){alert(e.message)}}
async function subscribe(id){if(!user)return auth();if(selected?.demo)return alert('Demo video: Subscribe test only');try{await api('/videos/'+id+'/subscribe',{method:'POST'});alert('Subscription updated')}catch(e){alert(e.message)}}
function shareVideo(){if(navigator.share)navigator.share({title:selected.title,url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied'))}
function downloadVideo(){let a=document.createElement('a');a.href=selected.video_url;a.download=(selected.title||'HYPER-video').replace(/[^a-z0-9]/gi,'_')+'.mp4';a.target='_blank';document.body.appendChild(a);a.click();a.remove();let d=JSON.parse(localStorage.getItem('hyper_downloads')||'[]');if(!d.some(x=>x.id===selected.id)){d.unshift(selected);localStorage.setItem('hyper_downloads',JSON.stringify(d))};alert('Download started')}
async function upload(){if(!user)return auth();let f=document.getElementById('video')?.files[0];let title=(document.getElementById('title')?.value||'').trim();if(!f)return alert('Video file select karein');if(!title)return alert('Video title likhein');if(f.size>250*1024*1024)return alert('Video 250 MB se kam rakhein');let btn=document.getElementById('publish');if(btn){btn.disabled=true;btn.textContent='Uploading...'}let d=new FormData();d.append('title',title);d.append('description',document.getElementById('desc').value);d.append('type',uploadType);d.append('video',f);let t=document.getElementById('thumb')?.files[0];if(t)d.append('thumbnail',t);try{let r=await api('/videos',{method:'POST',body:d});alert('Video published successfully');videos=[r,...videos.filter(v=>!v.demo)];go('home')}catch(e){alert(e.message||'Upload failed')}finally{if(btn){btn.disabled=false;btn.textContent='Publish'}}}
async function saveProfile(){if(!user)return auth();let fd=new FormData();fd.append('displayName',document.getElementById('pname').value.trim());fd.append('username',document.getElementById('pusername').value.trim());fd.append('bio',document.getElementById('pbio').value.trim());let a=document.getElementById('avatar').files[0],b=document.getElementById('banner').files[0];if(a)fd.append('avatar',a);if(b)fd.append('banner',b);try{let r=await api('/me/profile',{method:'POST',body:fd});user=r.user;localStorage.setItem('hyper_user',JSON.stringify(user));alert('Profile saved');go('settings')}catch(e){alert(e.message)}}
function auth(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="modal.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div id="authbox"></div></div></div>`);signinForm()}
function signinForm(){authbox.innerHTML='<h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signupForm()">Create account</button>'}
function signupForm(){authbox.innerHTML='<h2>Create account</h2><input id="display" placeholder="Full name"><input id="username" placeholder="Username (letters, numbers, _)"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="primary" onclick="register()">Create account</button><button class="switch" onclick="signinForm()">Already have an account? Sign in</button>'}
async function register(){try{let r=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:display.value,username:username.value,email:email.value,password:pass.value})});user=r.user;localStorage.setItem('hyper_token',r.token);localStorage.setItem('hyper_user',JSON.stringify(user));modal.remove();render();alert('Account created successfully')}catch(e){alert(e.message)}}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});user=r.user;localStorage.setItem('hyper_token',r.token);localStorage.setItem('hyper_user',JSON.stringify(user));modal.remove();render()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('hyper_token');localStorage.removeItem('hyper_user');user=null;go('home')}
document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));load();
<script>if(localStorage.getItem('hyper_theme')==='dark'){document.body.dataset.dark='1';document.body.style.background='#101614';document.body.style.color='#eef7f1'}</script></body></html>
