<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f3e"><title>HYPER</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7fbf8;color:#15372a}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e2ece6;display:flex;align-items:center;gap:16px;padding:12px 4%}.logo{display:flex;gap:7px;align-items:center;color:#087f3e;font-weight:900;font-size:21px}.mark{background:#087f3e;color:#fff;border-radius:8px;padding:4px 8px}.search{flex:1;max-width:680px;margin:auto;display:flex;border:1px solid #d7e5dc;border-radius:24px;overflow:hidden;background:#f9fcfa}.search input{flex:1;border:0;background:transparent;padding:11px 17px;outline:0}.search button{border:0;background:transparent;padding:0 15px;font-size:20px}.sign{border:0;background:#087f3e;color:#fff;padding:10px 17px;border-radius:22px;font-weight:bold}.chips{display:flex;gap:9px;padding:11px 4%;background:#fff;overflow:auto}.chips button{border:0;border-radius:18px;padding:9px 15px;white-space:nowrap}.chips .on{background:#087f3e;color:#fff}.page{max-width:1200px;margin:auto;padding:24px 4%}.hero{background:linear-gradient(120deg,#063c24,#0aa04d);color:#fff;border-radius:24px;padding:30px;margin-bottom:28px}.hero h1{margin:5px 0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px #0b5b3210}.thumb{position:relative;aspect-ratio:16/9}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:8px;bottom:7px;background:#111;color:#fff;padding:4px;border-radius:4px;font-size:11px}.meta{display:flex;gap:10px;padding:12px}.ava{width:34px;height:34px;border-radius:50%;background:#d9f2e4;color:#087f3e;display:grid;place-items:center;font-weight:bold;flex:none}.meta h3{font-size:15px;margin:0 0 5px}.meta p,.meta small,.muted{color:#718078;font-size:12px;margin:0}.shortrow{display:flex;gap:14px;overflow:auto}.short{width:190px;aspect-ratio:9/14;position:relative;flex:none;border-radius:15px;overflow:hidden;color:#fff;cursor:pointer}.short img{width:100%;height:100%;object-fit:cover}.short div{position:absolute;bottom:0;left:0;right:0;padding:35px 10px 10px;background:linear-gradient(transparent,#000c)}.watch video{width:100%;max-height:650px;background:#000;border-radius:16px}.back{border:0;background:none;color:#087f3e;padding:0 0 12px;font-size:15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.actions button{border:0;border-radius:20px;padding:10px 15px;background:#edf6ef}.actions .sub{background:#087f3e;color:#fff}.channel{display:flex;align-items:center;gap:12px;border-bottom:1px solid #dfe9e3;padding:15px 0}.channel button{margin-left:auto}.shortgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.shortbig{aspect-ratio:9/15;border-radius:16px;overflow:hidden;position:relative;background:#111;color:#fff;cursor:pointer}.shortbig img{width:100%;height:100%;object-fit:cover}.shortbig p{position:absolute;bottom:5px;left:10px;right:10px;font-weight:bold}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e2ece6;display:flex;justify-content:center;gap:7vw;align-items:center}.bottom button{border:0;background:none;color:#687b71;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom .active{color:#087f3e;font-weight:bold}.plus{width:48px;height:48px;border-radius:50%;background:#087f3e!important;color:#fff!important;font-size:27px}.createbox,.settings{background:#fff;border-radius:20px;padding:25px;max-width:620px;margin:auto}.createbox input,.createbox textarea,.auth input{width:100%;padding:12px;border:1px solid #d7e5dc;border-radius:11px;margin:6px 0 12px}.createbox textarea{min-height:100px}.primary{border:0;background:#087f3e;color:#fff;border-radius:20px;padding:11px 20px;font-weight:bold}.modal{position:fixed;inset:0;background:#062c1db8;display:grid;place-items:center;z-index:20;padding:20px}.auth{background:#fff;border-radius:22px;padding:25px;width:min(410px,100%);position:relative}.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:27px}.auth .primary{width:100%}.switch{width:100%;border:0;background:none;color:#087f3e;margin-top:10px}.row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #edf1ee}.row span:last-child{margin-left:auto}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.shortgrid{grid-template-columns:repeat(2,1fr)}.top{padding:10px 12px}.page{padding:18px 12px}.chips{padding-left:12px}.logo b{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.bottom{gap:0;justify-content:space-around}.search{max-width:none}.top{gap:8px}}
</style></head><body><div id="app"></div><div class="bottom"><button data-tab="home">⌂<small>Home</small></button><button data-tab="shorts">◉<small>Shorts</small></button><button class="plus" data-tab="create">＋</button><button data-tab="subs">▣<small>Subscriptions</small></button><button data-tab="channel">◌<small>Library</small></button></div><script>
const A='/api',demo=[{id:1,title:'Meri Life Ka Safar | Village Vlog 2025',channel:'Hyper Vlogs',views:1200000,likes:28000,duration:'10:24',type:'video',thumbnail:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},{id:2,title:'Mountains Calling | Travel Vlog',channel:'Explore More',views:856000,likes:19000,duration:'12:36',type:'video',thumbnail:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},{id:3,title:'Life is better in green! ❤️',channel:'Hyper Vlogs',views:420000,likes:42000,duration:'0:25',type:'short',thumbnail:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'}];
let videos=demo,tab='home',selected=null,user=JSON.parse(localStorage.getItem('hyper_user')||'null'),q='';const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n||0;
async function api(p,o={}){let h=o.headers||{};let t=localStorage.getItem('hyper_token');if(t)h={...h,Authorization:'Bearer '+t};let r=await fetch(A+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
async function load(){try{let d=await api('/videos');if(d.length)videos=d}catch{}render()}
function header(){return `<header class="top"><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div class="search"><input id="search" value="${q}" placeholder="Search videos, channels..."><button>⌕</button></div>${user?`<button class="sign" onclick="go('channel')">${(user.display_name||'U')[0].toUpperCase()}</button>`:`<button class="sign" onclick="auth()">Sign in</button>`}</header><nav class="chips">${['For You','Trending','Music','Gaming','Vlog'].map(x=>`<button class="${x==='For You'?'on':''}">${x}</button>`).join('')}</nav>`}
function card(v){return `<article class="card" onclick="watch(${v.id})"><div class="thumb"><img src="${v.thumbnail}"><span class="duration">${v.duration||''}</span></div><div class="meta"><div class="ava">${(v.channel||'H')[0]}</div><div><h3>${v.title}</h3><p>${v.channel||''}</p><small>${fmt(v.views)} views • 2 days ago</small></div></div></article>`}
function short(v){return `<article class="short" onclick="watch(${v.id})"><img src="${v.thumbnail}"><div><b>${v.title}</b><small>${fmt(v.views)} views</small></div></article>`}
function render(){document.getElementById('app').innerHTML=header()+main();document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('search').oninput=e=>{q=e.target.value;render()}}
function main(){let list=videos.filter(v=>(v.title+' '+(v.channel||'')).toLowerCase().includes(q.toLowerCase()));if(tab==='home')return `<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>Discover creators and videos you love.</span></section><h2>Recommended</h2><div class="grid">${list.filter(v=>v.type!=='short').map(card).join('')}</div><h2>Shorts</h2><div class="shortrow">${list.filter(v=>v.type==='short').map(short).join('')}</div></main>`;if(tab==='shorts')return `<main class="page"><h1>Shorts</h1><div class="shortgrid">${videos.filter(v=>v.type==='short').map(v=>`<div class="shortbig" onclick="watch(${v.id})"><img src="${v.thumbnail}"><p>♥ ${fmt(v.likes)}<br>${v.title}</p></div>`).join('')}</div></main>`;if(tab==='watch')return `<main class="page watch"><button class="back" onclick="go('home')">← Back</button><video controls poster="${selected.thumbnail}" src="${selected.video_url}"></video><h1>${selected.title}</h1><p class="muted">${fmt(selected.views)} views • 2 days ago</p><div class="actions"><button onclick="like(${selected.id})">👍 ${fmt(selected.likes)}</button><button>👎</button><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button><button onclick="navigator.share?.({title:'${selected.title}',url:location.href})">↗ Share</button></div><div class="channel"><div class="ava" style="width:48px;height:48px">${(selected.channel||'H')[0]}</div><b>${selected.channel}</b><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button></div><h2>Comments</h2><p>❤️ Great video! Keep going!</p></main>`;if(tab==='create')return `<main class="page"><h1>Create</h1><div class="createbox"><h2>Upload a video</h2><input id="title" placeholder="Video title"><textarea id="desc" placeholder="Description"></textarea><label>Video file<input id="video" type="file" accept="video/*"></label><label>Thumbnail<input id="thumb" type="file" accept="image/*"></label><p><button onclick="setType('video')">Video</button> <button onclick="setType('short')">Short</button></p><button class="primary" onclick="upload()">Publish</button></div></main>`;if(tab==='channel')return `<main class="page"><div class="channel"><div class="ava" style="width:90px;height:90px;font-size:32px">${(user?.display_name||'H')[0]}</div><div><h1>${user?.display_name||'Hyper Vlogs'}</h1><p>@${user?.username||'hypervlogs'} • 1.2M subscribers</p></div></div><h2>Your videos</h2><div class="grid">${videos.map(card).join('')}</div></main>`;if(tab==='subs')return `<main class="page"><h1>Subscriptions</h1><div class="settings">${['Hyper Vlogs','TechZone','Gaming with R&J','Mr. Indian Hacker','Triggered Insaan'].map(x=>`<div class="row"><div class="ava">${x[0]}</div><b>${x}</b><span>Subscribed</span></div>`).join('')}</div></main>`;return `<main class="page"><h1>Settings</h1><div class="settings">${['Account','Notifications','Privacy','General','Data usage','Help & feedback','About HYPER'].map(x=>`<div class="row">${x}<span>›</span></div>`).join('')}${user?'<button class="primary" onclick="logout()">Log out</button>':''}</div></main>`}
let uploadType='video';function setType(x){uploadType=x}function go(x){tab=x;render()}function watch(id){selected=videos.find(v=>v.id==id);tab='watch';render()}async function like(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/like',{method:'POST'});selected.likes=r.likes}catch{}render()}async function subscribe(id){if(!user)return auth();try{await api('/videos/'+id+'/subscribe',{method:'POST'});alert('Subscription updated')}catch(e){alert(e.message)}}
async function upload(){if(!user)return auth();let f=document.getElementById('video').files[0];if(!f)return alert('Select a video');let d=new FormData();d.append('title',document.getElementById('title').value||'Untitled');d.append('description',document.getElementById('desc').value);d.append('type',uploadType);d.append('video',f);let t=document.getElementById('thumb').files[0];if(t)d.append('thumbnail',t);try{await api('/videos',{method:'POST',body:d});alert('Uploaded');await load();go('home')}catch(e){alert(e.message)}}
function auth(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="modal.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><h2>Sign in</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signup()">Create account</button></div></div>`)}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});user=r.user;localStorage.setItem('hyper_token',r.token);localStorage.setItem('hyper_user',JSON.stringify(user));modal.remove();render()}catch(e){alert(e.message)}}function signup(){alert('Create the account first in the full API by adding the register fields; this starter keeps the login screen compact.')}function logout(){localStorage.clear();user=null;go('home')}
document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));load();
</script></body></html>
