<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f3e"><title>HYPER</title>
<style>
:root{--green:#087f3e;--green2:#0aa04d;--bg:#f7faf8;--card:#fff;--text:#10251b;--muted:#718078;--line:#dfe9e3;--soft:#edf6ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:82px;transition:.2s}.dark{--bg:#0e1511;--card:#17201b;--text:#f2f7f4;--muted:#9aa9a1;--line:#2b3831;--soft:#20352a}.dark .top,.dark .chips,.dark .bottom,.dark .listbtn,.dark .auth,.dark .createbox,.dark .settings,.dark .librarybox{background:var(--card);color:var(--text)}.dark input,.dark textarea{color:var(--text);background:#111a15}
button{font:inherit;cursor:pointer}.top{height:70px;display:flex;align-items:center;gap:12px;padding:10px 4%;background:var(--card);position:sticky;top:0;z-index:7;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:8px;color:var(--green);font-size:21px}.mark{width:40px;height:40px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:25px}.search{flex:1;max-width:680px;margin:auto;display:flex;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--bg)}.search input{flex:1;border:0;background:transparent;padding:11px 17px;outline:0}.search button{border:0;background:transparent;padding:0 15px;font-size:20px}.sign{border:0;background:var(--green);color:#fff;padding:10px 17px;border-radius:22px;font-weight:bold;min-width:44px}.avatarImg{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle}.chips{display:flex;gap:9px;padding:11px 4%;background:var(--card);overflow:auto;border-bottom:1px solid var(--line)}.chips button{border:0;border-radius:18px;padding:9px 15px;white-space:nowrap;background:var(--soft);color:var(--text)}.chips .on{background:var(--green);color:#fff}.page{max-width:1200px;margin:auto;padding:24px 4%}.hero{background:linear-gradient(120deg,#063c24,#0aa04d);color:#fff;border-radius:24px;padding:30px;margin-bottom:28px}.hero h1{margin:5px 0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px #0b5b3210}.thumb{position:relative;aspect-ratio:16/9;background:#111}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:8px;bottom:7px;background:#111;color:#fff;padding:4px;border-radius:4px;font-size:11px}.meta{display:flex;gap:10px;padding:12px}.ava{width:34px;height:34px;border-radius:50%;background:#d9f2e4;color:var(--green);display:grid;place-items:center;font-weight:bold;flex:none;overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}.meta h3{font-size:15px;margin:0 0 5px}.meta p,.meta small,.muted{color:var(--muted);font-size:12px;margin:0}.shortrow{display:flex;gap:14px;overflow:auto}.short{width:190px;aspect-ratio:9/14;position:relative;flex:none;border-radius:15px;overflow:hidden;color:#fff;cursor:pointer}.short img{width:100%;height:100%;object-fit:cover}.short div{position:absolute;bottom:0;left:0;right:0;padding:35px 10px 10px;background:linear-gradient(transparent,#000c)}.watch video{width:100%;max-height:650px;background:#000;border-radius:16px}.back{border:0;background:none;color:var(--green);padding:0 0 12px;font-size:15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.actions button{border:0;border-radius:20px;padding:10px 15px;background:var(--soft);color:var(--text)}.actions .sub,.primary{background:var(--green);color:#fff}.channel{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.channel button{margin-left:auto}.shortgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.shortbig{aspect-ratio:9/15;border-radius:16px;overflow:hidden;position:relative;background:#111;color:#fff;cursor:pointer}.shortbig img{width:100%;height:100%;object-fit:cover}.shortbig p{position:absolute;bottom:5px;left:10px;right:10px;font-weight:bold}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:7vw;align-items:center}.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}.bottom .active{color:var(--green);font-weight:bold}.plus{width:48px;height:48px;border-radius:50%;background:var(--green)!important;color:#fff!important;font-size:27px}.createbox,.settings,.librarybox{background:var(--card);border-radius:20px;padding:25px;max-width:760px;margin:auto}.createbox input,.createbox textarea,.auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;background:var(--card);color:var(--text)}.createbox textarea{min-height:100px}.primary{border:0;border-radius:20px;padding:11px 20px;font-weight:bold}.modal{position:fixed;inset:0;background:#062c1db8;display:grid;place-items:center;z-index:20;padding:20px}.auth{background:var(--card);color:var(--text);border-radius:22px;padding:25px;width:min(410px,100%);position:relative}.close{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--text);font-size:27px}.auth .primary{width:100%}.switch{width:100%;border:0;background:none;color:var(--green);margin-top:10px}.row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line)}.row span:last-child{margin-left:auto}.listbtn{width:100%;text-align:left;border:0;background:var(--card);color:var(--text);padding:16px 5px;border-bottom:1px solid var(--line);font-size:16px}.empty{padding:30px;text-align:center;color:var(--muted)}.settingPanel{margin:10px 0 18px;padding:14px;background:var(--soft);border-radius:14px}.settingPanel label{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.profileBox{display:flex;align-items:center;gap:15px;padding-bottom:18px;margin-bottom:8px;border-bottom:1px solid var(--line)}.profileBig{width:76px;height:76px;border-radius:50%;background:#d9f2e4;display:grid;place-items:center;color:var(--green);font-size:28px;font-weight:bold;overflow:hidden}.profileBig img{width:100%;height:100%;object-fit:cover}.notice{padding:12px;border-radius:12px;background:#fff8df;color:#6b5500;margin:10px 0}.dark .notice{background:#3a3219;color:#f1d86b}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.shortgrid{grid-template-columns:repeat(2,1fr)}.top{padding:10px 12px}.page{padding:18px 12px}.chips{padding-left:12px}.logo b{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.bottom{gap:0;justify-content:space-around}.search{max-width:none}.top{gap:8px}.top .logo{display:none}.sign{padding:9px 12px}}
</style></head><body><div id="app"><main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>Discover creators and videos you love.</span></section><h2>For You</h2><div class="grid"><div class="empty">Loading HYPER videos…</div></div></main></div>
<div class="bottom"><button data-tab="home">⌂<small>Home</small></button><button data-tab="shorts">◉<small>Shorts</small></button><button class="plus" data-tab="create">＋</button><button data-tab="subs">▣<small>Subscriptions</small></button><button data-tab="library">◌<small>Library</small></button></div>
<script>
const A='/api',demo=[
{id:1,title:'Meri Life Ka Safar | Village Vlog 2025',channel:'Hyper Vlogs',username:'hypervlogs',category:'Vlog',views:1200000,likes:28000,duration:'10:24',type:'video',thumbnail:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},
{id:2,title:'Mountains Calling | Travel Vlog',channel:'Explore More',username:'exploremore',category:'Vlog',views:856000,likes:19000,duration:'12:36',type:'video',thumbnail:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},
{id:3,title:'Life is better in green! ❤️',channel:'Hyper Vlogs',username:'hypervlogs',category:'Vlog',views:420000,likes:42000,duration:'0:25',type:'short',thumbnail:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'},
{id:4,title:'HYPER Music Mix',channel:'HYPER Music',username:'hypermusic',category:'Music',views:980000,likes:52000,duration:'5:20',type:'video',thumbnail:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},
{id:5,title:'Gaming Highlights',channel:'Hyper Gaming',username:'hypergaming',category:'Gaming',views:1500000,likes:74000,duration:'8:15',type:'video',thumbnail:'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80',video_url:'https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4'}];
function safeGet(k,f=null){try{return localStorage.getItem(k)??f}catch(e){return f}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeRemove(k){try{localStorage.removeItem(k)}catch(e){}}
function safeJSON(v,f=null){try{return JSON.parse(v)}catch(e){return f}}
let videos=demo,tab='home',selected=null,user=safeJSON(safeGet('hyper_user','null'),null),q='',libraryMode='history',uploadType='video',category='For You';
const settingsState=safeJSON(safeGet('hyper_settings','null'),null)||{dark:false,notifications:true,autoplay:true,dataSaver:false,wifiOnly:false,downloadQuality:'720p',private:false};
function persist(){safeSet('hyper_settings',JSON.stringify(settingsState));document.body.classList.toggle('dark',!!settingsState.dark)}persist();
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n||0;
async function api(p,o={}){let h=o.headers||{};let t=safeGet('hyper_token','');if(t)h={...h,Authorization:'Bearer '+t};let r=await fetch(A+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
async function load(){try{let d=await api('/videos');if(Array.isArray(d)&&d.length)videos=d}catch(e){}render()}
function avatarHtml(u,cls='ava'){return u&&u.avatar_url?`<div class="${cls}"><img src="${u.avatar_url}"></div>`:`<div class="${cls}">${(u?.display_name||u?.channel||'H')[0].toUpperCase()}</div>`}
function header(){return `<header class="top"><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div class="search"><input id="search" value="${escapeHtml(q)}" placeholder="Search videos, channels..."><button onclick="doSearch()">⌕</button></div>${user?`<button class="sign" onclick="go('settings')">${user.avatar_url?`<img class="avatarImg" src="${user.avatar_url}">`:(user.display_name||'U')[0].toUpperCase()}</button>`:`<button class="sign" onclick="auth()">Sign in</button>`}</header><nav class="chips">${['For You','Trending','Music','Gaming','Vlog'].map(x=>`<button class="${x===category?'on':''}" onclick="setCategory('${x}')">${x}</button>`).join('')}</nav>`}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(v){return `<article class="card" onclick="watch(${v.id})"><div class="thumb"><img src="${v.thumbnail_url||v.thumbnail||''}" loading="lazy"><span class="duration">${v.duration||''}</span></div><div class="meta">${avatarHtml(v)}<div><h3>${escapeHtml(v.title)}</h3><p>${escapeHtml(v.channel||v.display_name||'')}</p><small>${fmt(v.views)} views • ${v.category||'Video'}</small></div></div></article>`}
function short(v){return `<article class="short" onclick="watch(${v.id})"><img src="${v.thumbnail_url||v.thumbnail||''}"><div><b>${escapeHtml(v.title)}</b><small>${fmt(v.views)} views</small></div></article>`}
async function render(){try{let html=header()+await main();let root=document.getElementById('app');if(root)root.innerHTML=html;document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s=document.getElementById('search');if(s)s.onkeydown=e=>{if(e.key==='Enter')doSearch()}}catch(e){console.error(e);let root=document.getElementById('app');if(root)root.innerHTML='<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>HYPER is ready. Refresh once to load videos.</span></section><div class="empty">Please refresh the page.</div></main>'}}
function filtered(){let list=videos.filter(v=>(v.title+' '+(v.channel||'')+' '+(v.category||'')).toLowerCase().includes(q.toLowerCase()));if(category==='Trending')return list.sort((a,b)=>(b.views||0)-(a.views||0));if(category==='Music')return list.filter(v=>(v.category||'').toLowerCase()==='music'||/music|song|dj|mix/i.test(v.title+' '+v.channel));if(category==='Gaming')return list.filter(v=>(v.category||'').toLowerCase()==='gaming'||/gaming|game|gamer/i.test(v.title+' '+v.channel));if(category==='Vlog')return list.filter(v=>(v.category||'').toLowerCase()==='vlog'||/vlog|travel|life/i.test(v.title+' '+v.channel));return list}
function doSearch(){q=(document.getElementById('search')?.value||'').trim();render()};function setCategory(x){category=x;q='';render()}
async function main(){let list=filtered();if(tab==='home')return `<main class="page"><section class="hero"><p>WATCH • CREATE • SHARE</p><h1>Your World on HYPER</h1><span>${category==='For You'?'Discover creators and videos you love.':category+' videos for you.'}</span></section><h2>${category}</h2><div class="grid">${list.filter(v=>v.type!=='short').map(card).join('')||'<div class="empty">No videos found in this category.</div>'}</div><h2>Shorts</h2><div class="shortrow">${list.filter(v=>v.type==='short').map(short).join('')||'<div class="empty">No Shorts found.</div>'}</div></main>`;
if(tab==='shorts')return `<main class="page"><h1>Shorts</h1><div class="shortgrid">${videos.filter(v=>v.type==='short').map(v=>`<div class="shortbig" onclick="watch(${v.id})"><img src="${v.thumbnail_url||v.thumbnail}"><p>♥ ${fmt(v.likes)}<br>${escapeHtml(v.title)}</p></div>`).join('')}</div></main>`;
if(tab==='watch')return watchPage();if(tab==='create')return createPage();if(tab==='subs')return subsPage();if(tab==='settings')return settingsPage();return await libraryPage()}
function watchPage(){return `<main class="page watch"><button class="back" onclick="go('home')">← Back</button><video id="player" controls ${settingsState.autoplay?'autoplay':''} poster="${selected.thumbnail_url||selected.thumbnail||''}" src="${selected.video_url}"></video><h1>${escapeHtml(selected.title)}</h1><p class="muted">${fmt(selected.views)} views • ${selected.category||'Video'}</p><div class="actions"><button onclick="like(${selected.id})">👍 ${fmt(selected.likes)}</button><button onclick="save(${selected.id})">🔖 Save</button><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button><button onclick="shareVideo()">↗ Share</button><button onclick="downloadVideo()">⬇️ Download</button></div><div class="channel">${avatarHtml(selected)}<div><b>${escapeHtml(selected.channel||'HYPER Creator')}</b><p class="muted">Creator channel</p></div><button class="sub" onclick="subscribe(${selected.id})">Subscribe</button></div><h2>Comments</h2><div id="comments"><p class="muted">Loading comments...</p></div>${user?`<div class="actions"><input id="commentText" placeholder="Add a comment" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:20px"><button class="primary" onclick="comment()">Comment</button></div>`:''}</main>`}
function createPage(){return `<main class="page"><h1>Create</h1><div class="createbox">${!user?'<div class="notice">Please sign in or create an account before uploading.</div>':''}<h2>Upload a video</h2><input id="title" placeholder="Video title"><textarea id="desc" placeholder="Description"></textarea><label>Video file<input id="video" type="file" accept="video/*"></label><label>Thumbnail<input id="thumb" type="file" accept="image/*"></label><label>Category<select id="cat" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)"><option>Vlog</option><option>Music</option><option>Gaming</option><option>For You</option><option>Trending</option></select></label><p><button onclick="setType('video')">Video</button> <button onclick="setType('short')">Short</button></p><button class="primary" onclick="upload()">Publish</button></div></main>`}
function subsPage(){return `<main class="page"><h1>Subscriptions</h1><div class="settings">${['Hyper Vlogs','TechZone','Gaming with R&J','Mr. Indian Hacker','Triggered Insaan'].map(x=>`<div class="row"><div class="ava">${x[0]}</div><b>${x}</b><span>Subscribed</span></div>`).join('')}</div></main>`}
function settingsPage(){return `<main class="page"><h1>Settings</h1><div class="settings">${user?`<div class="profileBox">${avatarHtml(user,'profileBig')}<div><h3 style="margin:0">${escapeHtml(user.display_name)}</h3><p class="muted">@${escapeHtml(user.username)}</p><p class="muted">${escapeHtml(user.email)}</p></div></div><label class="listbtn">Profile picture<input id="avatarInput" type="file" accept="image/*" onchange="setAvatar(event)" style="display:block;margin-top:8px"></label>`:`<button class="listbtn" onclick="auth()">👤 Sign in / Create account</button>`}<button class="listbtn" onclick="toggleSetting('notifications')">🔔 Notifications <span>${settingsState.notifications?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('dark')">🌙 Dark / Light Mode <span>${settingsState.dark?'Dark':'Light'}</span></button><button class="listbtn" onclick="toggleSetting('autoplay')">▶️ Autoplay <span>${settingsState.autoplay?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('dataSaver')">📶 Data Saver <span>${settingsState.dataSaver?'On':'Off'}</span></button><button class="listbtn" onclick="toggleSetting('wifiOnly')">⬇️ Download on Wi‑Fi only <span>${settingsState.wifiOnly?'On':'Off'}</span></button><button class="listbtn" onclick="downloadQuality()">🎞️ Download Quality <span>${settingsState.downloadQuality}</span></button><button class="listbtn" onclick="toggleSetting('private')">🔒 Private Account <span>${settingsState.private?'On':'Off'}</span></button><button class="listbtn" onclick="alert('Your HYPER privacy controls are stored on this device.')">🛡️ Privacy</button><button class="listbtn" onclick="alert('HYPER notifications: '+(settingsState.notifications?'Enabled':'Disabled'))">🔔 Notification settings</button><button class="listbtn" onclick="alert('HYPER Help & feedback')">❓ Help & feedback</button><button class="listbtn" onclick="alert('HYPER version 1.2')">ℹ️ About HYPER</button>${user?'<button class="primary" onclick="logout()">Log out</button>':''}</div></main>`}
async function libraryPage(){if(!user)return `<main class="page"><h1>Library</h1><div class="librarybox"><h3>Your Library</h3><p>Watch history, liked videos, saved videos, downloads and your uploads are available after login.</p><button class="primary" onclick="auth()">Sign in / Create account</button></div></main>`;let data=[];try{let endpoint=libraryMode==='history'?'/me/history':libraryMode==='liked'?'/me/liked':libraryMode==='saved'?'/me/saved':'/me/videos';if(libraryMode!=='downloads')data=await api(endpoint)}catch{}if(libraryMode==='downloads')data=safeJSON(safeGet('hyper_downloads','[]'),[]);let names={history:'Watch History',downloads:'Downloaded Videos',liked:'Liked Videos',saved:'Watch Later / Saved',mine:'Your Videos'};return `<main class="page"><h1>Library</h1><div class="librarybox"><button class="listbtn" onclick="lib('history')">🕘 Watch History</button><button class="listbtn" onclick="lib('downloads')">⬇️ Downloaded Videos</button><button class="listbtn" onclick="lib('liked')">❤️ Liked Videos</button><button class="listbtn" onclick="lib('saved')">🔖 Watch Later / Saved</button><button class="listbtn" onclick="lib('mine')">📤 Your Videos</button></div><h2>${names[libraryMode]}</h2><div class="grid">${data.length?data.map(card).join(''):'<div class="empty">No videos here yet.</div>'}</div></main>`}
function lib(x){libraryMode=x;render()};function go(x){tab=x;render()};function setType(x){uploadType=x}
async function watch(id){selected=videos.find(v=>v.id==id);if(!selected)return;tab='watch';render();if(user)api('/videos/'+id+'/history',{method:'POST'}).catch(()=>{});setTimeout(loadComments,250)}
async function loadComments(){if(!selected)return;try{let d=await api('/videos/'+selected.id+'/comments');document.getElementById('comments').innerHTML=d.length?d.map(c=>`<p><b>${escapeHtml(c.display_name||'User')}</b>: ${escapeHtml(c.text)}</p>`).join(''):'<p class="muted">No comments yet.</p>'}catch{if(document.getElementById('comments'))document.getElementById('comments').innerHTML='<p class="muted">Comments available after database connection.</p>'}}
async function comment(){let el=document.getElementById('commentText'),text=el?.value.trim();if(!text)return;if(!user)return auth();try{await api('/videos/'+selected.id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});el.value='';loadComments()}catch(e){alert(e.message)}}
async function like(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/like',{method:'POST'});selected.likes=r.likes;render()}catch(e){alert(e.message)}}
async function save(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/save',{method:'POST'});alert(r.saved?'Saved to Watch Later':'Removed from Watch Later')}catch(e){alert(e.message)}}
async function subscribe(id){if(!user)return auth();try{let r=await api('/videos/'+id+'/subscribe',{method:'POST'});alert(r.subscribed?'Subscribed':'Unsubscribed')}catch(e){alert(e.message)}}
function shareVideo(){if(navigator.share)navigator.share({title:selected.title,url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied'))}
function downloadVideo(){if(settingsState.wifiOnly&&navigator.connection&&!['wifi','ethernet'].includes(navigator.connection.type))return alert('Download on Wi‑Fi only is ON');let a=document.createElement('a');a.href=selected.video_url;a.download=(selected.title||'HYPER-video').replace(/[^a-z0-9]/gi,'_')+'.mp4';a.target='_blank';document.body.appendChild(a);a.click();a.remove();let d=safeJSON(safeGet('hyper_downloads','[]'),[]);if(!d.some(x=>x.id===selected.id)){d.unshift(selected);safeSet('hyper_downloads',JSON.stringify(d))}alert('Download started')}
async function upload(){if(!user)return auth();let f=document.getElementById('video').files[0];if(!f)return alert('Select a video');let d=new FormData();d.append('title',document.getElementById('title').value||'Untitled');d.append('description',document.getElementById('desc').value);d.append('type',uploadType);d.append('category',document.getElementById('cat').value);d.append('video',f);let t=document.getElementById('thumb').files[0];if(t)d.append('thumbnail',t);try{await api('/videos',{method:'POST',body:d});alert('Video uploaded successfully');await load();go('home')}catch(e){alert(e.message)}}
function toggleSetting(k){settingsState[k]=!settingsState[k];persist();render()};function downloadQuality(){let a=['360p','480p','720p','1080p'],i=a.indexOf(settingsState.downloadQuality);settingsState.downloadQuality=a[(i+1)%a.length];persist();render()}
function setAvatar(e){let f=e.target.files[0];if(!f||!user)return;if(f.size>800000)return alert('Profile picture should be under 800 KB');let r=new FileReader();r.onload=async()=>{user.avatar_url=r.result;safeSet('hyper_user',JSON.stringify(user));try{let x=await api('/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar_url:r.result})});user=x.user;safeSet('hyper_user',JSON.stringify(user))}catch{}render()};r.readAsDataURL(f)}
function auth(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="auth"><button class="close" onclick="modal.remove()">×</button><div class="logo"><span class="mark">H</span><b>HYPER</b></div><div id="authbox"></div></div></div>`);signinForm()}
function signinForm(){authbox.innerHTML='<h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><button class="switch" onclick="signupForm()">Create account</button>'}
function signupForm(){authbox.innerHTML='<h2>Create account</h2><input id="display" placeholder="Full name"><input id="username" placeholder="Username (letters, numbers, _)\"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="primary" onclick="register()">Create account</button><button class="switch" onclick="signinForm()">Already have an account? Sign in</button>'}
async function register(){try{let r=await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:display.value,username:username.value,email:email.value,password:pass.value})});user=r.user;safeSet('hyper_token',r.token);safeSet('hyper_user',JSON.stringify(user));modal.remove();render();alert('Account created successfully')}catch(e){alert(e.message)}}
async function login(){try{let r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});user=r.user;safeSet('hyper_token',r.token);safeSet('hyper_user',JSON.stringify(user));modal.remove();render()}catch(e){alert(e.message)}}
function logout(){safeRemove('hyper_token');safeRemove('hyper_user');user=null;go('home')}
document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));load();
</script></body></html>
