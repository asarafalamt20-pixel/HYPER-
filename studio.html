<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HYPER Studio</title>
<style>
:root{--green:#078a46;--green2:#0ba957;--bg:#f6faf8;--card:#fff;--soft:#eaf7f0;--text:#0d2119;--muted:#6a7b73;--line:#dbe9e2;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center}.topRight{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 13px;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:65px;height:calc(100vh - 65px)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px;color:var(--text);cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--green);font-weight:700}.creator{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:18px}.creator b{display:block}.creator small{color:var(--muted)}main{padding:22px;max-width:1250px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.head h1{margin:0 0 5px;font-size:28px}.head p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.stat .icon{font-size:22px}.stat small{display:block;color:var(--muted);margin-top:8px}.stat strong{display:block;font-size:25px;margin-top:4px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 14px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.bars{display:flex;align-items:end;gap:10px;height:180px;padding:10px 4px 0}.barItem{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:100%;max-width:52px;border-radius:8px 8px 3px 3px;background:var(--green2);min-height:3px}.barItem small{font-size:10px;color:var(--muted);text-align:center}.video{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.video:last-child{border-bottom:0}.thumb{width:120px;height:68px;border-radius:9px;object-fit:cover;background:#e9efec}.vtitle{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{color:var(--muted);font-size:12px;margin-top:5px}.badge{display:inline-block;background:var(--soft);color:var(--green);padding:3px 7px;border-radius:8px;font-size:11px;margin-left:5px}.empty{padding:25px;text-align:center;color:var(--muted)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-size:12px}.money{font-size:34px;font-weight:800}.note{background:#fff8df;border:1px solid #f1e4ae;color:#6b5500;border-radius:12px;padding:12px;margin-top:12px}.mobileNav{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{display:none}main{padding:16px 12px 90px}.top{padding:10px 12px}.topRight .backText{display:none}.mobileNav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:7px}.mobileNav button{border:0;background:none;color:var(--muted);font-size:12px}.mobileNav button.active{color:var(--green);font-weight:700}.mobileNav span{display:block;font-size:20px}.video{grid-template-columns:90px minmax(0,1fr)}.video .btn{grid-column:2;justify-self:start}.thumb{width:90px;height:54px}.head h1{font-size:24px}}
@media(max-width:520px){.cards{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat strong{font-size:20px}.stat small{font-size:11px}.brand span:last-child{display:none}.head{align-items:center}.panel{padding:13px}.video{grid-template-columns:82px minmax(0,1fr);gap:9px}.thumb{width:82px;height:52px}}

.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.formGrid input,.formGrid textarea,.formGrid select,label input,label textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box;font:inherit}.toolbar input{max-width:420px}.toolbar select{max-width:150px}.rowActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.danger{color:#b42318!important;border-color:#f2c7c2!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:100}.modalBox{width:min(620px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0004}.modalBox label{display:block;font-size:13px;font-weight:700;margin:12px 0}.modalBox textarea{min-height:120px;resize:vertical}.close{float:right;border:0;background:none;font-size:26px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formGrid label{font-size:13px;font-weight:700}.formGrid .wide{grid-column:1/-1}.formGrid textarea{min-height:120px;resize:vertical}.formGrid small{display:block;color:var(--muted);font-weight:400;margin-top:5px}.settingsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.settingCard{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:6px}.settingCard strong{font-size:24px}.settingCard small,.toggle{color:var(--muted)}.toggle{display:flex;gap:9px;align-items:center;border:1px solid var(--line);padding:12px;border-radius:12px}.toggle input{width:auto}.profilePreview{display:flex;gap:15px;align-items:center}.bigAvatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:28px;font-weight:800}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">H</span><span>HYPER Studio</span></div><div class="topRight"><button class="btn" onclick="location.href='/'">↩ <span class="backText">Back to HYPER</span></button><button class="btn" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside><div id="creator" class="creator">Loading…</div><nav class="nav"><button data-page="dashboard" onclick="show('dashboard')">📊 Dashboard</button><button data-page="content" onclick="show('content')">🎬 Content</button><button data-page="analytics" onclick="show('analytics')">📈 Analytics</button><button data-page="earnings" onclick="show('earnings')">💰 Earnings</button><button data-page="audience" onclick="show('audience')">👥 Audience</button><button data-page="customize" onclick="show('customize')">🎨 Customization</button><button data-page="settings" onclick="show('settings')">⚙️ Studio Settings</button></nav></aside><main id="main"><div class="empty">Loading HYPER Studio…</div></main></div>
<nav class="mobileNav"><button data-page="dashboard" onclick="show('dashboard')"><span>📊</span>Home</button><button data-page="content" onclick="show('content')"><span>🎬</span>Content</button><button data-page="analytics" onclick="show('analytics')"><span>📈</span>Analytics</button><button data-page="earnings" onclick="show('earnings')"><span>💰</span>Earnings</button><button data-page="audience" onclick="show('audience')"><span>👥</span>Audience</button><button data-page="settings" onclick="show('settings')"><span>⚙️</span>Setup</button></nav>
<script>
const token=localStorage.getItem('hyper_token');let data=null,current='dashboard';
const fmt=n=>new Intl.NumberFormat('en-IN',{notation:'compact',maximumFractionDigits:1}).format(Number(n||0));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
function logout(){localStorage.removeItem('hyper_token');localStorage.removeItem('hyper_user');location.href='/'}
function setActive(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===current))}
function show(p){current=p;setActive();renderPage()}
function creator(){let c=data.channel||{};document.getElementById('creator').innerHTML=`<b>${esc(c.channel_name||c.display_name||c.username||'HYPER')}</b><small>@${esc(c.username||'')}<br>${fmt(c.subscriber_count)} subscribers</small>`}
function header(title,sub){return `<div class="head"><div><h1>${title}</h1><p>${sub||''}</p></div>${current==='content'?`<button class="btn primary" onclick="location.href='/'">＋ Upload from HYPER</button>`:''}</div>`}
function stat(icon,label,val){return `<div class="stat"><div class="icon">${icon}</div><small>${label}</small><strong>${val}</strong></div>`}
function dashboard(){let s=data.stats||{};let max=Math.max(1,...(data.monthlyViews||[]).map(x=>Number(x.views||0)));return header('Dashboard','Your HYPER channel at a glance')+`<div class="cards">${stat('👥','Subscribers',fmt(data.channel?.subscriber_count))}${stat('▶️','Total views',fmt(s.views))}${stat('❤️','Total likes',fmt(s.likes))}${stat('🎬','Published uploads',fmt(s.uploads))}</div><div class="two"><section class="panel"><h2>Views overview</h2><div class="bars">${(data.monthlyViews||[]).map(x=>`<div class="barItem"><div class="bar" style="height:${Math.max(4,Math.round(Number(x.views||0)/max*145))}px"></div><b>${fmt(x.views)}</b><small>${esc(x.month)}</small></div>`).join('')||'<div class="empty">Analytics will appear after publishing videos.</div>'}</div></section><section class="panel"><h2>Monetization</h2><div class="money">${money(data.monetization?.balance||0)}</div><p class="meta">Available HYPER earnings</p><div class="note">Monetization is not active yet. When HYPER monetization and ads are enabled for your channel, real earnings will appear here.</div></section></div><section class="panel"><h2>Top content</h2>${topVideos(5)}</section>`}
function topVideos(limit=10){let a=(data.topVideos||[]).slice(0,limit);return a.length?a.map(videoRow).join(''):'<div class="empty">No videos published yet.</div>'}
function videoRow(v){let thumb=v.thumbnail_url||'';return `<div class="video"><img class="thumb" src="${esc(thumb)}" onerror="this.style.visibility='hidden'"><div><div class="vtitle">${esc(v.title)} <span class="badge">${v.type==='short'?'SHORT':esc(v.category||'Video')}</span></div><div class="meta">${fmt(v.views)} views • ${fmt(v.likes)} likes • ${new Date(v.created_at).toLocaleDateString('en-IN')}</div></div><button class="btn" onclick="location.href='/?video=${encodeURIComponent(v.id)}'">Open</button></div>`}
function content(){return header('Content','Manage your Videos and Shorts')+`<section class="panel"><div class="toolbar"><input id="contentSearch" placeholder="Search your content…" oninput="filterContent(this.value)"><select id="contentType" onchange="filterContent(document.getElementById('contentSearch')?.value||'')"><option value="all">All</option><option value="video">Videos</option><option value="short">Shorts</option></select></div><div id="contentList">${contentRows(data.content||[])}</div></section>`}
function contentRows(a){return a.length?a.map(videoRow).join(''):'<div class="empty">No content yet. Upload from HYPER.</div>'}
function filterContent(q=''){let type=document.getElementById('contentType')?.value||'all';q=q.toLowerCase();let a=(data.content||[]).filter(v=>(type==='all'||v.type===type)&&((v.title||'').toLowerCase().includes(q)||(v.category||'').toLowerCase().includes(q)));document.getElementById('contentList').innerHTML=contentRows(a)}
function editContent(id){let v=(data.content||[]).find(x=>String(x.id)===String(id));if(!v)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="editModal"><div class="modalBox"><button class="close" onclick="editModal.remove()">×</button><h2>Edit content</h2><label>Title<input id="eTitle" value="${esc(v.title)}"></label><label>Description<textarea id="eDesc">${esc(v.description||'')}</textarea></label><label>Category<select id="eCat">${['Discover','Entertainment','News','Education','Sports','Music','Gaming','Lifestyle','Creator','Vlog'].map(c=>`<option ${c===(v.category||'Discover')?'selected':''}>${c}</option>`).join('')}</select></label><div class="modalActions"><button class="btn" onclick="editModal.remove()">Cancel</button><button class="btn primary" onclick="saveContent(${id})">Save changes</button></div></div></div>`)}
async function saveContent(id){try{let v=await api('/videos/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('eTitle').value,description:document.getElementById('eDesc').value,category:document.getElementById('eCat').value})});let i=data.content.findIndex(x=>String(x.id)===String(id));if(i>=0)data.content[i]=v;editModal.remove();renderPage();alert('Content updated')}catch(e){alert(e.message)}}
async function deleteContent(id){if(!confirm('Delete this video permanently?'))return;try{await api('/videos/'+id,{method:'DELETE'});data.content=data.content.filter(x=>String(x.id)!==String(id));renderPage();alert('Video deleted')}catch(e){alert(e.message)}}
function videoRow(v){let thumb=v.thumbnail_url||'';return `<div class="video"><img class="thumb" src="${esc(thumb)}" onerror="this.style.visibility='hidden'"><div><div class="vtitle">${esc(v.title)} <span class="badge">${v.type==='short'?'SHORT':esc(v.category||'Video')}</span></div><div class="meta">${fmt(v.views)} views • ${fmt(v.likes)} likes • ${new Date(v.created_at).toLocaleDateString('en-IN')}</div></div><div class="rowActions"><button class="btn" onclick="location.href='/?video=${encodeURIComponent(v.id)}'">Open</button><button class="btn" onclick="editContent(${v.id})">Edit</button><button class="btn danger" onclick="deleteContent(${v.id})">Delete</button></div></div>`}
function analytics(){let a=data.content||[],views=a.reduce((n,x)=>n+Number(x.views||0),0),likes=a.reduce((n,x)=>n+Number(x.likes||0),0),videos=a.filter(x=>x.type!=='short').length,shorts=a.filter(x=>x.type==='short').length;return header('Analytics','Detailed channel performance')+`<div class="cards">${stat('👁️','Views',fmt(views))}${stat('❤️','Likes',fmt(likes))}${stat('📺','Videos',fmt(videos))}${stat('📱','Shorts',fmt(shorts))}</div><section class="panel"><h2>Content performance</h2><div class="tableWrap"><table class="table"><thead><tr><th>Content</th><th>Type</th><th>Category</th><th>Views</th><th>Likes</th><th>Engagement</th></tr></thead><tbody>${a.map(v=>{let e=Number(v.views)?Number(v.likes||0)/Number(v.views)*100:0;return `<tr><td>${esc(v.title)}</td><td>${v.type==='short'?'Short':'Video'}</td><td>${esc(v.category||'')}</td><td>${fmt(v.views)}</td><td>${fmt(v.likes)}</td><td>${e.toFixed(2)}%</td></tr>`}).join('')||'<tr><td colspan="6">No data</td></tr>'}</tbody></table></div></section><section class="panel"><h2>Growth tips</h2><div class="settingsGrid"><div class="settingCard">🎯 <b>Consistency</b><small>Publish regularly and keep titles clear.</small></div><div class="settingCard">🖼️ <b>Thumbnails</b><small>Use a strong, readable thumbnail for every upload.</small></div><div class="settingCard">💬 <b>Community</b><small>Reply to comments and encourage discussion.</small></div></div></section>`}
function earnings(){let ads=data.ads||{};return header('Earnings','Creator revenue, ads and payouts')+`<div class="cards">${stat('💰','Available balance',money(data.monetization?.balance||0))}${stat('📢','Ad revenue',money(ads.estimated_revenue||0))}${stat('👁️','Ad impressions',fmt(ads.impressions||0))}${stat('💳','Paid out',money(data.monetization?.paid_out||0))}</div><section class="panel"><h2>HYPER Ads</h2><p>Ad earnings are calculated from eligible ad impressions. Creator share is controlled by HYPER's monetization policy.</p><div class="two"><div class="settingCard"><b>Creator share</b><strong>70%</strong><small>Example platform configuration; final rate can be changed by HYPER.</small></div><div class="settingCard"><b>HYPER share</b><strong>30%</strong><small>Platform portion used for operations and ad system costs.</small></div></div></section><section class="panel"><h2>Withdrawals</h2><p class="muted">Payout setup is ready for the next payment/KYC integration. No payout is processed by this dashboard yet.</p><button class="btn" disabled>Withdraw — Payment setup required</button></section>`}
function audience(){return header('Audience','Understand your channel community')+`<div class="cards">${stat('👥','Subscribers',fmt(data.channel?.subscriber_count))}${stat('🎬','Uploads',fmt(data.stats?.uploads))}${stat('▶️','Views',fmt(data.stats?.views))}${stat('❤️','Likes',fmt(data.stats?.likes))}</div><section class="panel"><h2>Channel profile</h2><div class="profilePreview"><div class="bigAvatar">${(data.channel?.channel_name||'H')[0].toUpperCase()}</div><div><h2>${esc(data.channel?.channel_name||'HYPER')}</h2><p>@${esc(data.channel?.username||'')} • ${fmt(data.channel?.subscriber_count)} subscribers</p><p>${esc(data.channel?.channel_description||'No channel description yet.')}</p></div></div></section>`}
function customize(){let c=data.channel||{};return header('Channel Customization','Manage your public channel identity')+`<section class="panel"><h2>Profile & Channel</h2><div class="formGrid"><label>Full name<input id="pFull" value="${esc(c.full_name||c.display_name||'')}"></label><label>Channel name<input id="pChannel" value="${esc(c.channel_name||'')}"></label><label class="wide">Channel description<textarea id="pDesc" maxlength="500">${esc(c.channel_description||'')}</textarea></label><label class="wide">Profile picture URL<input id="pAvatar" value="${esc(c.avatar_url||'')}" placeholder="https://…"><small>Use a hosted image URL for now.</small></label></div><div class="modalActions"><button class="btn primary" onclick="saveProfile()">Save channel</button></div></section><section class="panel"><h2>Channel layout</h2><div class="settingsGrid"><div class="settingCard"><b>Home sections</b><small>Recommended • Videos • Shorts • Popular</small></div><div class="settingCard"><b>Content tabs</b><small>Videos and Shorts are shown automatically.</small></div><div class="settingCard"><b>Branding</b><small>HYPER green-white creator identity is active.</small></div></div></section>`}
async function saveProfile(){try{let r=await api('/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('pFull').value,channel_name:document.getElementById('pChannel').value,channel_description:document.getElementById('pDesc').value,avatar_url:document.getElementById('pAvatar').value})});data.channel={...data.channel,...r.user};creator();alert('Channel profile saved')}catch(e){alert(e.message)}}
function settings(){let cfg=JSON.parse(localStorage.getItem('hyper_studio_settings')||'{}');return header('Studio Settings','All creator dashboard controls')+`<section class="panel"><h2>Upload & playback</h2><div class="settingsGrid"><label class="toggle"><input id="sAuto" type="checkbox" ${cfg.autoplay!==false?'checked':''}> Autoplay next content</label><label class="toggle"><input id="sNotify" type="checkbox" ${cfg.notify!==false?'checked':''}> Upload notifications</label><label class="toggle"><input id="sSave" type="checkbox" ${cfg.autoSave!==false?'checked':''}> Auto-save Studio preferences</label></div></section><section class="panel"><h2>Privacy & channel</h2><div class="settingsGrid"><button class="btn" onclick="location.href='/'">Open HYPER Privacy Settings</button><button class="btn" onclick="location.href='/'">Edit Profile & Channel</button><button class="btn" onclick="location.href='/'">Manage Accounts</button></div></section><section class="panel"><h2>Account & security</h2><p class="meta">Studio uses the same HYPER login session. To sign out everywhere, log out from HYPER and sign in again.</p><button class="btn" onclick="saveStudioSettings()">Save Studio Settings</button><button class="btn danger" onclick="logout()">Sign out</button></section>`}
function saveStudioSettings(){localStorage.setItem('hyper_studio_settings',JSON.stringify({autoplay:document.getElementById('sAuto').checked,notify:document.getElementById('sNotify').checked,autoSave:document.getElementById('sSave').checked}));alert('Studio settings saved')}
function renderPage(){let f={dashboard,content,analytics,earnings,audience,customize,settings}[current]||dashboard;document.getElementById('main').innerHTML=f()}
async function init(){if(!token){location.href='/';return}try{data=await api('/studio/overview');data.content=await api('/studio/content');creator();show('dashboard')}catch(e){document.getElementById('main').innerHTML=`<div class="panel"><h2>HYPER Studio</h2><div class="note">${esc(e.message)}. Please sign in again from HYPER.</div><button class="btn primary" onclick="location.href='/'">Back to HYPER</button></div>`}}
init();
</script></body></html>
