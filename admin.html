<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYPER Admin • Control Center</title><style>
:root{--g:#0a9b58;--bg:#f4f7f6;--text:#14221b;--muted:#6c7a73;--line:#dfe8e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,#087b47,#0aaa61);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:2}.wrap{max-width:1200px;margin:auto;padding:16px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.9;font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:24px;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{background:#f6fbf8}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,select{border:1px solid #cbd8d1;border-radius:10px;padding:10px 12px;font:inherit}input{height:42px;min-width:260px}textarea{width:100%;min-height:90px}button{border:0;border-radius:10px;background:var(--g);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#eef5f1;color:#0b7042}button.danger{background:#b43b3b}.note{padding:11px 13px;border-radius:10px;background:#fff8e8;border:1px solid #f0d99b;color:#795900;font-size:13px}.ok{padding:11px 13px;border-radius:10px;background:#eaf8f0;border:1px solid #bde4cc;color:#0b7042;font-size:13px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.on{background:#dcf7e8;color:#087b47}.off{background:#f3eeee;color:#9b3333}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid>*:last-child{grid-column:1/-1}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.searchRow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.searchRow input{flex:1;min-width:220px}.payoutBox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f7fbf8}.payoutForm{display:grid;grid-template-columns:1fr 180px auto;gap:8px}.payoutForm input{min-width:0;width:100%}.historyRow{padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.payoutForm{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.split,.formgrid{grid-template-columns:1fr}.formgrid>*:last-child{grid-column:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}input{min-width:0;width:100%}.controls{align-items:stretch}.controls button{width:100%}}
.supportAdmin{margin-top:14px}.supportFilters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.supportFilters input{flex:1;min-width:220px}.supportList{display:grid;gap:8px}.supportItem{border:1px solid var(--line);background:var(--soft);border-radius:13px;padding:12px;cursor:pointer}.supportItem:hover{background:#eef7f1}.supportItemTop{display:flex;gap:8px;align-items:center}.supportItem small{color:var(--muted);display:block;margin-top:4px}.supportUnread{background:#d90000;color:#fff;border-radius:10px;padding:3px 7px;font-size:10px;font-weight:700;margin-left:auto}.supportThread{max-height:80vh}.supportAdminMsg{padding:10px 12px;border-radius:13px;background:var(--soft);margin:7px 0;max-width:85%}.supportAdminMsg.admin{margin-left:auto;background:#e5f6ec}.supportAdminMsg p{white-space:pre-wrap;margin:5px 0}.supportReply{width:100%;min-height:100px;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#17231d}@media(max-width:600px){.supportAdminMsg{max-width:96%}}
</style></head><body><header><div class="wrap" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><h1>🟢 HYPER Admin • Control Center</h1><p>Creator 70% • HYPER Admin 30% • Channels, monetization, uploads & messages</p></div><button id="adminNotifBtn" onclick="toggleAdminNotif()" style="position:relative;font-size:22px;background:#fff;border:0;border-radius:14px;padding:10px 14px;cursor:pointer">🔔<span id="adminNotifDot" style="display:none;position:absolute;right:8px;top:7px;width:9px;height:9px;background:#e00000;border-radius:50%"></span></button></div></header><main class="wrap"><section class="panel" id="loginPanel"><h2>HYPER Admin</h2><p>Admin वही HYPER account है जिससे HYPER app में login किया गया है.</p><button onclick="openAdmin()">🔐 Open Admin Dashboard</button></section><div id="app"></div></main><script>
const token=localStorage.getItem('hyper_token')||'';let adminPayouts=[];const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));const fmt=n=>new Intl.NumberFormat('en-IN').format(Number(n||0));let channels=[],videos=[],summary={};
async function api(path,opt={}){let h={Authorization:'Bearer '+token,...(opt.headers||{})};let r=await fetch('/api'+path,{...opt,headers:h});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.message||'Request failed');return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function viewChannel(id,name,username){try{const [c,vs]=await Promise.all([api('/admin/channels/'+id),api('/admin/channels/'+id+'/videos')]);const box=document.createElement('div');box.id='adminChannelModal';box.style='position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;overflow:auto';const avatar=c.avatar_url?`<img src="${esc(c.avatar_url)}" style="width:72px;height:72px;border-radius:50%;object-fit:cover">`:'<div style="width:72px;height:72px;border-radius:50%;background:#07883f;color:#fff;display:grid;place-items:center;font-size:32px">👤</div>';const cards=vs.map(v=>`<div class="card" style="margin:10px 0"><div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><b>${esc(v.title)}</b><p class="small">${esc(v.type)} • ${esc(v.category)} • ${fmt(v.views)} views • ${fmt(v.likes)} likes<br>${new Date(v.created_at).toLocaleString('en-IN')}</p></div><span class="pill ${v.moderation_status==='blocked'?'off':'on'}">${esc(v.moderation_status||'published')}</span></div><video controls preload="metadata" style="width:100%;max-height:420px;border-radius:12px;background:#000" src="${esc(v.video_url||'')}"></video><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editAdminVideo(${v.id},${JSON.stringify(String(v.title||''))},${JSON.stringify(String(v.description||''))},${JSON.stringify(String(v.category||'Vlog'))})">✏️ Edit</button><button class="danger" onclick="removeVideo(${v.id},${JSON.stringify(String(v.title||''))})">Delete Video</button></div></div>`).join('')||'<div class="note">Is channel par abhi koi video nahi hai.</div>';box.innerHTML=`<div style="background:#fff;width:min(980px,100%);border-radius:20px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.25)"><div class="controls"><div style="flex:1;display:flex;gap:12px;align-items:center">${avatar}<div><h2 style="margin:0">${esc(c.channel_name)} <span class="small">(@${esc(c.username)})</span></h2><div class="small">${esc(c.email)}</div></div></div><button class="secondary" onclick="document.getElementById('adminChannelModal')?.remove()">✕</button></div><div class="card" style="margin:14px 0"><p style="margin:0 0 8px">${esc(c.channel_description||'No channel description')}</p><p class="small" style="margin:0">🏷️ ${esc(c.channel_tags||'No tags')}<br>👥 ${fmt(c.subscriber_count)} subscribers • 🎬 ${fmt(c.video_count)} videos • ⚡ ${fmt(c.short_count)} shorts • 👁️ ${fmt(c.total_views)} views • 👍 ${fmt(c.total_likes)} likes</p></div><div class="actions" style="margin:10px 0"><button onclick="toggleMon(${c.id},${!c.monetization_enabled})">${c.monetization_enabled?'Turn OFF Monetization':'Turn ON Monetization'}</button><button class="${c.is_suspended?'secondary':'danger'}" onclick="suspendCh(${c.id},${!c.is_suspended});document.getElementById('adminChannelModal')?.remove()">${c.is_suspended?'Restore Channel':'Suspend Channel'}</button><button class="secondary" onclick="editAdminChannel(${c.id})">✏️ Edit Channel</button><button class="secondary" onclick="messageUser(${c.id},${JSON.stringify(String(c.channel_name))})">💬 Message Creator</button></div><h3 style="margin:16px 0 8px">📺 Channel Videos</h3><div id="adminChannelVideos">${cards}</div></div>`;document.body.appendChild(box)}catch(e){alert(e.message)}}
async function editAdminChannel(id){try{const c=await api('/admin/channels/'+id);const full=prompt('User name:',c.full_name||c.display_name||'');if(full===null)return;const name=prompt('Channel name:',c.channel_name||'');if(name===null)return;const desc=prompt('Channel description:',c.channel_description||'');if(desc===null)return;const tags=prompt('Channel tags:',c.channel_tags||'');if(tags===null)return;await api('/admin/channels/'+id+'/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:full,channel_name:name,channel_description:desc,channel_tags:tags,avatar_url:c.avatar_url||''})});alert('Channel profile updated');document.getElementById('adminChannelModal')?.remove();loadAll()}catch(e){alert(e.message)}}
function render(){let t=summary.totals||{},w=summary.wallet||{};document.getElementById('app').innerHTML=`
<section class="grid"><div class="card"><small>Total ad revenue</small><strong>${money(t.gross)}</strong></div><div class="card"><small>Creator 70%</small><strong>${money(t.creator)}</strong></div><div class="card"><small>HYPER Admin 30%</small><strong>${money(t.hyper_admin)}</strong></div><div class="card"><small>Admin balance</small><strong>${money(w.balance)}</strong></div></section>
<section class="panel"><h2>🟢 Admin Wallet</h2><div class="split"><div class="card"><small>Available Admin Balance</small><strong>${money(w.balance)}</strong></div><div class="card"><small>Lifetime Admin Earnings</small><strong>${money(w.lifetime_earned)}</strong></div></div><div class="payoutBox"><h3>💳 Withdraw Admin Earnings</h3><p class="small">HYPER Admin का 30% balance यहाँ से payout किया जा सकता है। Live payout के लिए Render में RazorpayX और <b>HYPER_ADMIN_FUND_ACCOUNT_ID</b> configure होना जरूरी है.</p><div class="payoutForm"><input id="adminAmount" type="number" min="500" step="0.01" placeholder="Amount (₹)"><select id="adminMode"><option>IMPS</option><option>NEFT</option><option>RTGS</option></select><button onclick="adminWithdraw()">Withdraw Admin Money</button></div><div class="small" style="margin-top:8px">Minimum withdrawal: ₹500</div></div><div style="margin-top:12px"><h3>📜 Admin Payout History</h3><div id="adminPayoutHistory" class="small">Loading…</div></div></section>
<section class="panel"><div class="controls"><h2 style="margin:0;flex:1">👥 Channel Control</h2><button class="secondary" onclick="loadAll()">↻ Refresh</button></div><div class="searchRow"><input id="channelSearch" placeholder="🔎 Search channel, @username or email..."><button onclick="searchChannels()">Search</button><button class="secondary" onclick="clearChannelSearch()">Clear</button></div><p class="small">Admin किसी भी channel की monetization ON/OFF कर सकता है, channel suspend/restore कर सकता है और creator को message भेज सकता है.</p><div class="tableWrap"><table><thead><tr><th>Channel</th><th>Subscribers</th><th>Videos</th><th>Monetization</th><th>Status</th><th>Control</th></tr></thead><tbody>${channels.map(c=>`<tr><td><b>${esc(c.channel_name)}</b><br><small>@${esc(c.username)} • ${esc(c.email)}</small></td><td>${fmt(c.subscriber_count)}</td><td>${fmt(c.video_count)}</td><td><span class="pill ${c.monetization_enabled?'on':'off'}">${c.monetization_enabled?'ON • 70/30':'OFF'}</span></td><td><span class="pill ${c.is_suspended?'off':'on'}">${c.is_suspended?'SUSPENDED':'ACTIVE'}</span></td><td><div class="actions"><button onclick="toggleMon(${c.id},${!c.monetization_enabled})">${c.monetization_enabled?'Turn OFF':'Turn ON'}</button><button class="${c.is_suspended?'secondary':'danger'}" onclick="suspendCh(${c.id},${!c.is_suspended})">${c.is_suspended?'Restore':'Suspend'}</button><button class="secondary" onclick="viewChannel(${c.id},'${esc(c.channel_name)}','${esc(c.username)}')">📺 Open Channel</button><button class="secondary" onclick="messageUser(${c.id},'${esc(c.channel_name)}')">💬 Message</button></div></td></tr>`).join('')||'<tr><td colspan="6">No channels found.</td></tr>'}</tbody></table></div></section>
<section class="panel"><h2>📤 Channel Upload Messages</h2><p class="small">जब कोई channel video upload करता है, Admin को यहाँ notification/message दिखाई देगा.</p><div id="adminNotices">Loading…</div></section>
<section class="panel"><h2>🎬 Video Control</h2><div class="tableWrap"><table><thead><tr><th>Video</th><th>Channel</th><th>Type</th><th>Views</th><th>Action</th></tr></thead><tbody>${videos.map(v=>`<tr><td><b>${esc(v.title)}</b><br><small>${new Date(v.created_at).toLocaleString('en-IN')}</small></td><td>@${esc(v.username)}<br>${esc(v.channel_name)}</td><td>${esc(v.type)}</td><td>${fmt(v.views)}</td><td><button class="danger" onclick="removeVideo(${v.id},'${esc(v.title)}')">Delete Video</button></td></tr>`).join('')||'<tr><td colspan="5">No videos found.</td></tr>'}</tbody></table></div></section>
<section class="panel"><h2>✉️ Send Admin Message</h2><div class="formgrid"><select id="msgUser"><option value="">Select channel</option>${channels.map(c=>`<option value="${c.id}">${esc(c.channel_name)} (@${esc(c.username)})</option>`).join('')}</select><input id="msgTitle" placeholder="Message title" value="HYPER Admin message"><textarea id="msgText" placeholder="Admin message…"></textarea><button onclick="sendMessage()">Send Message</button></div></section><section class="panel supportAdmin"><h2>🆘 Support Inbox</h2><p class="small">Users ke support messages yahan aayenge. Ticket open karke direct reply kar sakte hain.</p><div class="supportFilters"><input id="supportSearch" placeholder="Search channel, @username, subject..."><select id="supportStatus"><option value="">All status</option><option value="open">Open</option><option value="pending">Pending</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><button class="secondary" onclick="loadSupportInbox()">Search</button></div><div id="supportInbox" class="supportList">Loading…</div></section>`;loadAdminNotices();loadSupportInbox()}
async function editAdminVideo(id,title,description,category){const t=prompt('Video title:',title);if(t===null)return;const d=prompt('Video description:',description);if(d===null)return;const cat=prompt('Category:',category);if(cat===null)return;try{await api('/admin/videos/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,description:d,category:cat})});alert('Video updated');document.getElementById('adminChannelModal')?.remove();loadAll()}catch(e){alert(e.message)}}
async function openAdmin(){try{await api('/admin/session');document.getElementById('loginPanel').style.display='none';await loadAll('');}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Admin access problem</h2><p>'+esc(e.message)+'</p><p>HYPER app me Admin account se login karke phir Open Admin Dashboard dabayein.</p></section>';}}
async function loadAll(search=''){try{summary=await api('/admin/monetization/summary');channels=await api('/admin/channels'+(search?('?search='+encodeURIComponent(search)):''));videos=await api('/admin/videos');adminPayouts=await api('/admin/payouts');render();renderPayoutHistory();loadSupportInbox()}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Access failed</h2><p>'+esc(e.message)+'</p></section>'}}
async function toggleMon(id,on){try{await api('/admin/channels/'+id+'/monetization',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})});alert('Monetization '+(on?'ON':'OFF')+' — creator ko message bhej diya gaya.');loadAll()}catch(e){alert(e.message)}}
async function suspendCh(id,on){if(!confirm('Channel '+(on?'suspend':'restore')+' karna hai?'))return;try{await api('/admin/channels/'+id+'/suspend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({suspended:on})});loadAll()}catch(e){alert(e.message)}}
async function removeVideo(id,title){if(!confirm('Video delete karna hai?\n'+title))return;try{await api('/admin/videos/'+id,{method:'DELETE'});alert('Video removed and creator ko message bhej diya gaya.');loadAll()}catch(e){alert(e.message)}}
async function messageUser(id,name){let text=prompt(name+' ko Admin message bheje:');if(!text?.trim())return;try{await api('/admin/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,title:'HYPER Admin message',message:text.trim()})});alert('Message sent');loadAdminNotices()}catch(e){alert(e.message)}}
async function sendMessage(){let id=document.getElementById('msgUser').value,text=document.getElementById('msgText').value.trim(),title=document.getElementById('msgTitle').value.trim()||'HYPER Admin message';if(!id||!text)return alert('Channel और message दोनों चुनें/लिखें');try{await api('/admin/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(id),title,message:text})});document.getElementById('msgText').value='';alert('Message sent')}catch(e){alert(e.message)}}
async function loadAdminNotices(){try{let n=await api('/me/notifications');let items=(n.items||[]).filter(x=>['video_upload','support_ticket','support_ticket_reply'].includes(x.type)).slice(0,50);document.getElementById('adminNotices').innerHTML=items.map(x=>`<div class="card" style="margin:8px 0;cursor:pointer" onclick="${x.related_ticket_id?`openAdminSupport(${Number(x.related_ticket_id)})`:''}"><b>${x.type.startsWith('support')?'🆘':'📤'} ${esc(x.title)}</b><p style="margin:6px 0">${esc(x.message)}</p><small>${new Date(x.created_at).toLocaleString('en-IN')}</small></div>`).join('')||'<div class="note">No notifications yet.</div>';}catch(e){document.getElementById('adminNotices').innerHTML='<div class="note">'+esc(e.message)+'</div>'}}
async function refreshAdminNotif(){try{let n=await api('/me/notifications');let dot=document.getElementById('adminNotifDot');if(dot)dot.style.display=(n.unread||0)>0?'block':'none';}catch(e){}}
async function toggleAdminNotif(){try{let n=await api('/me/notifications');let items=(n.items||[]).filter(x=>['video_upload','support_ticket','support_ticket_reply','support_status','support_reply'].includes(x.type)).slice(0,50);let old=document.getElementById('adminNotifBox');if(old){old.remove();return}let box=document.createElement('div');box.id='adminNotifBox';box.style='position:fixed;right:18px;top:80px;width:min(430px,calc(100% - 30px));max-height:70vh;overflow:auto;background:#fff;border-radius:18px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:100000';box.innerHTML='<div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;flex:1">🔔 Admin Notifications</h2><button onclick="document.getElementById(\'adminNotifBox\')?.remove()">✕</button></div>'+ (items.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #e3ebe7;cursor:pointer" onclick="${x.related_ticket_id?`openAdminSupport(${Number(x.related_ticket_id)});document.getElementById('adminNotifBox')?.remove()`:''}"><b>${x.type.startsWith('support')?'🆘':'📤'} ${esc(x.title)}</b><p style="margin:5px 0">${esc(x.message)}</p><small>${new Date(x.created_at).toLocaleString('en-IN')}</small></div>`).join('')||'<p>No notifications yet.</p>')+'<button style="margin-top:10px" onclick="markAdminNotificationsRead()">Mark all as read</button>';document.body.appendChild(box);await api('/me/notifications/read-all',{method:'POST'});let dot=document.getElementById('adminNotifDot');if(dot)dot.style.display='none';}catch(e){alert(e.message)}}
async function markAdminNotificationsRead(){try{await api('/me/notifications/read-all',{method:'POST'});document.getElementById('adminNotifBox')?.remove();let dot=document.getElementById('adminNotifDot');if(dot)dot.style.display='none';}catch(e){alert(e.message)}}
async function loadSupportInbox(){const el=document.getElementById('supportInbox');if(!el)return;try{const search=document.getElementById('supportSearch')?.value.trim()||'',status=document.getElementById('supportStatus')?.value||'';const q=await api('/admin/support/tickets?'+new URLSearchParams({search,status}));el.innerHTML=q.map(t=>`<div class="supportItem" onclick="openAdminSupport(${t.id})"><div class="supportItemTop"><b>#${t.id} • ${esc(t.subject)}</b>${Number(t.unread_user||0)>0?'<span class="supportUnread">NEW</span>':''}</div><small>👤 ${esc(t.channel_name)} • @${esc(t.username)} • ${esc(t.category)} • ${esc(t.status)} • ${new Date(t.updated_at).toLocaleString('en-IN')}</small><small>${esc(t.last_message||'No message')}</small></div>`).join('')||'<div class="note">No support tickets found.</div>'}catch(e){el.innerHTML='<div class="note">'+esc(e.message)+'</div>'}}
async function openAdminSupport(id){try{const x=await api('/admin/support/tickets/'+id);const box=document.createElement('div');box.id='adminSupportModal';box.style='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100000;display:grid;place-items:center;padding:12px';box.innerHTML=`<div class="panel supportThread" style="width:min(700px,100%);margin:0;overflow:auto"><div class="controls"><div style="flex:1"><h2 style="margin:0">🆘 #${x.ticket.id} • ${esc(x.ticket.subject)}</h2><small>${esc(x.ticket.category)} • ${esc(x.ticket.channel_name)} • @${esc(x.ticket.username)} • ${esc(x.ticket.email)}</small></div><button class="secondary" onclick="document.getElementById('adminSupportModal')?.remove();loadSupportInbox()">✕</button></div><div id="adminSupportMessages" style="margin:15px 0">${x.messages.map(m=>`<div class="supportAdminMsg ${m.sender_role==='admin'?'admin':''}"><b>${m.sender_role==='admin'?'🟢 Admin':'👤 '+esc(x.ticket.username)}</b><p>${esc(m.message)}</p><small>${new Date(m.created_at).toLocaleString('en-IN')}</small></div>`).join('')}</div><textarea id="adminSupportReply" class="supportReply" placeholder="User ko reply karein…"></textarea><div class="actions" style="margin-top:8px"><button onclick="replyAdminSupport(${id})">Send Reply</button><button class="secondary" onclick="setAdminSupportStatus(${id},'open')">Open</button><button class="secondary" onclick="setAdminSupportStatus(${id},'resolved')">Resolve</button><button class="danger" onclick="setAdminSupportStatus(${id},'closed')">Close</button></div></div>`;document.body.appendChild(box);const m=document.getElementById('adminSupportMessages');if(m)m.scrollTop=m.scrollHeight}catch(e){alert(e.message)}}
async function replyAdminSupport(id){const message=document.getElementById('adminSupportReply')?.value.trim();if(!message)return alert('Reply likhein');try{await api('/admin/support/tickets/'+id+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});document.getElementById('adminSupportModal')?.remove();await openAdminSupport(id);loadSupportInbox()}catch(e){alert(e.message)}}
async function setAdminSupportStatus(id,status){try{await api('/admin/support/tickets/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});document.getElementById('adminSupportModal')?.remove();await loadSupportInbox()}catch(e){alert(e.message)}}

async function searchChannels(){const q=document.getElementById('channelSearch')?.value.trim()||'';await loadAll(q)}
async function clearChannelSearch(){const el=document.getElementById('channelSearch');if(el)el.value='';await loadAll('')}
async function adminWithdraw(){const amount=Number(document.getElementById('adminAmount')?.value||0);const mode=document.getElementById('adminMode')?.value||'IMPS';if(!amount||amount<500)return alert('Minimum withdrawal ₹500 hai');if(!confirm('Admin wallet se ₹'+amount.toFixed(2)+' withdraw karna hai?'))return;try{const x=await api('/admin/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount_paise:Math.round(amount*100),mode})});alert('Admin payout request: '+(x.status||'processing'));document.getElementById('adminAmount').value='';loadAll()}catch(e){alert(e.message)}}
function renderPayoutHistory(){const el=document.getElementById('adminPayoutHistory');if(!el)return;el.innerHTML=adminPayouts.map(p=>`<div class="historyRow"><b>${money(p.amount)}</b> • ${esc(p.mode||p.provider||'razorpayx')} • <span class="pill ${String(p.status)==='failed'?'off':'on'}">${esc(p.status)}</span><br><small>${new Date(p.created_at).toLocaleString('en-IN')}</small></div>`).join('')||'No Admin payouts yet.'}
openAdmin();setInterval(refreshAdminNotif,15000);refreshAdminNotif();
</script></body></html>
