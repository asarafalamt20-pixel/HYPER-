<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYPER Admin • Control Center</title><style>
:root{--g:#0a9b58;--bg:#f4f7f6;--text:#14221b;--muted:#6c7a73;--line:#dfe8e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,#087b47,#0aaa61);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:2}.wrap{max-width:1200px;margin:auto;padding:16px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.9;font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:24px;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{background:#f6fbf8}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,select{border:1px solid #cbd8d1;border-radius:10px;padding:10px 12px;font:inherit}input{height:42px;min-width:260px}textarea{width:100%;min-height:90px}button{border:0;border-radius:10px;background:var(--g);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#eef5f1;color:#0b7042}button.danger{background:#b43b3b}.note{padding:11px 13px;border-radius:10px;background:#fff8e8;border:1px solid #f0d99b;color:#795900;font-size:13px}.ok{padding:11px 13px;border-radius:10px;background:#eaf8f0;border:1px solid #bde4cc;color:#0b7042;font-size:13px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.on{background:#dcf7e8;color:#087b47}.off{background:#f3eeee;color:#9b3333}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid>*:last-child{grid-column:1/-1}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split,.formgrid{grid-template-columns:1fr}.formgrid>*:last-child{grid-column:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}input{min-width:0;width:100%}.controls{align-items:stretch}.controls button{width:100%}}
</style></head><body><header><div class="wrap"><h1>🟢 HYPER Admin • Control Center</h1><p>Creator 70% • HYPER Admin 30% • Channels, monetization, uploads & messages</p></div></header><main class="wrap"><section class="panel" id="loginPanel"><h2>HYPER Admin</h2><p>Admin वही HYPER account है जिससे HYPER app में login किया गया है.</p><button onclick="openAdmin()">🔐 Open Admin Dashboard</button></section><div id="app"></div></main><script>
const token=localStorage.getItem('hyper_token')||'';const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));const fmt=n=>new Intl.NumberFormat('en-IN').format(Number(n||0));let channels=[],videos=[],summary={};
async function api(path,opt={}){let h={Authorization:'Bearer '+token,...(opt.headers||{})};let r=await fetch('/api'+path,{...opt,headers:h});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.message||'Request failed');return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function openAdmin(){if(!token){document.getElementById('app').innerHTML='<section class="panel"><h2>HYPER login required</h2><p>पहले HYPER app में Admin email से login करें.</p><a href="/">← HYPER App</a></section>';return}try{let me=await api('/admin/session');document.getElementById('loginPanel').innerHTML='<h2>🟢 HYPER Admin</h2><p>Logged in as <b>'+esc(me.user.email)+'</b></p><button class="secondary" onclick="loadAll()">↻ Refresh Dashboard</button>';await loadAll()}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Access failed</h2><p>'+esc(e.message)+'</p></section>'}}
function render(){let t=summary.totals||{},w=summary.wallet||{};document.getElementById('app').innerHTML=`
<section class="grid"><div class="card"><small>Total ad revenue</small><strong>${money(t.gross)}</strong></div><div class="card"><small>Creator 70%</small><strong>${money(t.creator)}</strong></div><div class="card"><small>HYPER Admin 30%</small><strong>${money(t.hyper_admin)}</strong></div><div class="card"><small>Admin balance</small><strong>${money(w.balance)}</strong></div></section>
<section class="panel"><h2>🟢 Admin Wallet</h2><div class="split"><div class="card"><small>Available Admin Balance</small><strong>${money(w.balance)}</strong></div><div class="card"><small>Lifetime Admin Earnings</small><strong>${money(w.lifetime_earned)}</strong></div></div></section>
<section class="panel"><div class="controls"><h2 style="margin:0;flex:1">👥 Channel Control</h2><button class="secondary" onclick="loadAll()">↻ Refresh</button></div><p class="small">Admin किसी भी channel की monetization ON/OFF कर सकता है, channel suspend/restore कर सकता है और creator को message भेज सकता है.</p><div class="tableWrap"><table><thead><tr><th>Channel</th><th>Subscribers</th><th>Videos</th><th>Monetization</th><th>Status</th><th>Control</th></tr></thead><tbody>${channels.map(c=>`<tr><td><b>${esc(c.channel_name)}</b><br><small>@${esc(c.username)} • ${esc(c.email)}</small></td><td>${fmt(c.subscriber_count)}</td><td>${fmt(c.video_count)}</td><td><span class="pill ${c.monetization_enabled?'on':'off'}">${c.monetization_enabled?'ON • 70/30':'OFF'}</span></td><td><span class="pill ${c.is_suspended?'off':'on'}">${c.is_suspended?'SUSPENDED':'ACTIVE'}</span></td><td><div class="actions"><button onclick="toggleMon(${c.id},${!c.monetization_enabled})">${c.monetization_enabled?'Turn OFF':'Turn ON'}</button><button class="${c.is_suspended?'secondary':'danger'}" onclick="suspendCh(${c.id},${!c.is_suspended})">${c.is_suspended?'Restore':'Suspend'}</button><button class="secondary" onclick="messageUser(${c.id},'${esc(c.channel_name)}')">💬 Message</button></div></td></tr>`).join('')||'<tr><td colspan="6">No channels found.</td></tr>'}</tbody></table></div></section>
<section class="panel"><h2>📤 Channel Upload Messages</h2><p class="small">जब कोई channel video upload करता है, Admin को यहाँ notification/message दिखाई देगा.</p><div id="adminNotices">Loading…</div></section>
<section class="panel"><h2>🎬 Video Control</h2><div class="tableWrap"><table><thead><tr><th>Video</th><th>Channel</th><th>Type</th><th>Views</th><th>Action</th></tr></thead><tbody>${videos.map(v=>`<tr><td><b>${esc(v.title)}</b><br><small>${new Date(v.created_at).toLocaleString('en-IN')}</small></td><td>@${esc(v.username)}<br>${esc(v.channel_name)}</td><td>${esc(v.type)}</td><td>${fmt(v.views)}</td><td><button class="danger" onclick="removeVideo(${v.id},'${esc(v.title)}')">Delete Video</button></td></tr>`).join('')||'<tr><td colspan="5">No videos found.</td></tr>'}</tbody></table></div></section>
<section class="panel"><h2>✉️ Send Admin Message</h2><div class="formgrid"><select id="msgUser"><option value="">Select channel</option>${channels.map(c=>`<option value="${c.id}">${esc(c.channel_name)} (@${esc(c.username)})</option>`).join('')}</select><input id="msgTitle" placeholder="Message title" value="HYPER Admin message"><textarea id="msgText" placeholder="Admin message…"></textarea><button onclick="sendMessage()">Send Message</button></div></section>`;loadAdminNotices()}
async function loadAll(){try{summary=await api('/admin/monetization/summary');channels=await api('/admin/channels');videos=await api('/admin/videos');render()}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Access failed</h2><p>'+esc(e.message)+'</p></section>'}}
async function toggleMon(id,on){try{await api('/admin/channels/'+id+'/monetization',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})});alert('Monetization '+(on?'ON':'OFF')+' — creator ko message bhej diya gaya.');loadAll()}catch(e){alert(e.message)}}
async function suspendCh(id,on){if(!confirm('Channel '+(on?'suspend':'restore')+' karna hai?'))return;try{await api('/admin/channels/'+id+'/suspend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({suspended:on})});loadAll()}catch(e){alert(e.message)}}
async function removeVideo(id,title){if(!confirm('Video delete karna hai?\n'+title))return;try{await api('/admin/videos/'+id,{method:'DELETE'});alert('Video removed and creator ko message bhej diya gaya.');loadAll()}catch(e){alert(e.message)}}
async function messageUser(id,name){let text=prompt(name+' ko Admin message bheje:');if(!text?.trim())return;try{await api('/admin/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,title:'HYPER Admin message',message:text.trim()})});alert('Message sent');loadAdminNotices()}catch(e){alert(e.message)}}
async function sendMessage(){let id=document.getElementById('msgUser').value,text=document.getElementById('msgText').value.trim(),title=document.getElementById('msgTitle').value.trim()||'HYPER Admin message';if(!id||!text)return alert('Channel और message दोनों चुनें/लिखें');try{await api('/admin/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(id),title,message:text})});document.getElementById('msgText').value='';alert('Message sent')}catch(e){alert(e.message)}}
async function loadAdminNotices(){try{let n=await api('/me/notifications');let items=(n.items||[]).filter(x=>x.type==='video_upload').slice(0,30);document.getElementById('adminNotices').innerHTML=items.map(x=>`<div class="card" style="margin:8px 0"><b>📤 ${esc(x.title)}</b><p style="margin:6px 0">${esc(x.message)}</p><small>${new Date(x.created_at).toLocaleString('en-IN')}</small></div>`).join('')||'<div class="note">No upload messages yet.</div>';}catch(e){document.getElementById('adminNotices').innerHTML='<div class="note">'+esc(e.message)+'</div>'}}
openAdmin();
</script></body></html>
