<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYPER Admin • Revenue</title><style>
:root{--g:#0a9b58;--bg:#f4f7f6;--text:#14221b;--muted:#6c7a73;--line:#dfe8e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,#087b47,#0aaa61);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.9;font-size:13px}.wrap{max-width:1150px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:24px;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{background:#f6fbf8}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{height:42px;border:1px solid #cbd8d1;border-radius:10px;padding:0 12px;min-width:260px}button{border:0;border-radius:10px;background:var(--g);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#eef5f1;color:#0b7042}button.danger{background:#b43b3b}.note{padding:11px 13px;border-radius:10px;background:#fff8e8;border:1px solid #f0d99b;color:#795900;font-size:13px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700}.right{text-align:right}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}input{min-width:0;width:100%}.controls{align-items:stretch}.controls button{width:100%}}
</style></head><body><header><div class="wrap"><h1>🟢 HYPER Admin • Revenue</h1><p>Fixed split: Creator 70% • HYPER Admin 30%</p></div></header><main class="wrap"><section class="panel"><h2>Admin Access</h2><div class="controls"><input id="key" type="password" placeholder="HYPER Admin Key"><button onclick="saveKey()">Open Dashboard</button><button class="secondary" onclick="logoutKey()">Clear Key</button></div><p class="note" style="margin-bottom:0">Admin key is used only in this browser to call protected admin APIs. Never put it in frontend source code or share it publicly.</p></section><div id="app"><section class="panel"><h2>Enter the Admin Key</h2><p>Revenue dashboard will appear here after authentication.</p></section></div></main><script>
const keyStore='hyper_admin_key';let key=localStorage.getItem(keyStore)||'';document.getElementById('key').value=key;
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));const fmt=n=>new Intl.NumberFormat('en-IN').format(Number(n||0));
async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{'X-HYPER-ADMIN-KEY':key,...(opt.headers||{})}});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.message||'Request failed');return x}
function saveKey(){key=document.getElementById('key').value.trim();if(!key)return alert('Admin key required');localStorage.setItem(keyStore,key);load()}
function logoutKey(){localStorage.removeItem(keyStore);key='';document.getElementById('key').value='';document.getElementById('app').innerHTML='<section class="panel"><h2>Admin key cleared</h2><p>Enter the key again to open the dashboard.</p></section>'}
function render(x){let t=x.totals||{};document.getElementById('app').innerHTML=`<section class="grid"><div class="card"><small>Total ad revenue</small><strong>${money(t.gross)}</strong></div><div class="card"><small>Creator payout share • 70%</small><strong>${money(t.creator)}</strong></div><div class="card"><small>HYPER Admin share • 30%</small><strong>${money(t.hyper_admin)}</strong></div><div class="card"><small>Ad impressions</small><strong>${fmt(t.impressions)}</strong></div></section><section class="panel"><h2>Money Split</h2><div class="split"><div class="card"><small>Creator</small><strong>70%</strong><div>${money(t.creator)} credited to creators</div></div><div class="card"><small>HYPER Admin</small><strong>30%</strong><div>${money(t.hyper_admin)} recorded as HYPER share</div></div></div><p class="note" style="margin-top:12px">The HYPER Admin amount shown here is the revenue ledger share. The actual bank settlement depends on the real ad-network/provider settlement. It is not the same thing as the bank balance.</p></section><section class="panel"><div class="controls"><h2 style="margin:0;flex:1">Creator Revenue</h2><button class="secondary" onclick="load()">↻ Refresh</button></div><div class="tableWrap"><table><thead><tr><th>Creator</th><th>Gross</th><th>Creator 70%</th><th>HYPER 30%</th><th>Impressions</th><th>Action</th></tr></thead><tbody>${(x.creators||[]).map(c=>`<tr><td><b>${esc(c.channel_name)}</b><br><small>@${esc(c.username)}</small></td><td>${money(c.gross)}</td><td>${money(c.creator)}</td><td>${money(c.hyper_admin)}</td><td>${fmt(c.impressions)}</td><td><button onclick="enable(${c.id})">Enable 70/30</button></td></tr>`).join('')||'<tr><td colspan="6">No verified revenue yet.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>Recent Daily Revenue</h2><div class="tableWrap"><table><thead><tr><th>Date</th><th>Gross</th><th>Creator 70%</th><th>HYPER 30%</th></tr></thead><tbody>${(x.daily||[]).map(d=>`<tr><td>${new Date(d.day).toLocaleDateString('en-IN')}</td><td>${money(d.gross)}</td><td>${money(d.creator)}</td><td>${money(d.hyper_admin)}</td></tr>`).join('')||'<tr><td colspan="4">No revenue recorded.</td></tr>'}</tbody></table></div></section>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function enable(id){try{await api('/admin/monetization/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,enabled:true,creator_share_percent:70})});alert('Creator enabled at fixed 70% creator / 30% HYPER split.');load()}catch(e){alert(e.message)}}
async function load(){if(!key){return}try{let x=await api('/admin/monetization/summary');render(x)}catch(e){document.getElementById('app').innerHTML=`<section class="panel"><h2>Access failed</h2><p>${esc(e.message)}</p><button onclick="logoutKey()">Clear key</button></section>`}}
load();
</script></body></html>
