<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYPER Admin • Revenue</title><style>
:root{--g:#0a9b58;--bg:#f4f7f6;--text:#14221b;--muted:#6c7a73;--line:#dfe8e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,#087b47,#0aaa61);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.9;font-size:13px}.wrap{max-width:1150px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:24px;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{background:#f6fbf8}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{height:42px;border:1px solid #cbd8d1;border-radius:10px;padding:0 12px;min-width:260px}button{border:0;border-radius:10px;background:var(--g);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#eef5f1;color:#0b7042}button.danger{background:#b43b3b}.note{padding:11px 13px;border-radius:10px;background:#fff8e8;border:1px solid #f0d99b;color:#795900;font-size:13px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700}.right{text-align:right}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}input{min-width:0;width:100%}.controls{align-items:stretch}.controls button{width:100%}}
</style></head><body><header><div class="wrap"><h1>🟢 HYPER Admin • Revenue</h1><p>Fixed split: Creator 70% • HYPER Admin 30%</p></div></header><main class="wrap"><section class="panel" id="loginPanel"><h2>HYPER Admin</h2><p>Admin वही HYPER account होगा जिससे आप HYPER app में login करते हैं.</p><button onclick="openAdmin()">🔐 Open Admin Dashboard</button><p class="note" style="margin-bottom:0">Admin access केवल configured Admin email/account को मिलेगा. अलग Admin password की जरूरत नहीं.</p></section><div id="app"></div></main><script>
const token=localStorage.getItem('hyper_token')||'';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));const fmt=n=>new Intl.NumberFormat('en-IN').format(Number(n||0));
async function api(path,opt={}){let h={Authorization:'Bearer '+token,...(opt.headers||{})};let r=await fetch('/api'+path,{...opt,headers:h});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.message||'Request failed');return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function openAdmin(){if(!token){document.getElementById('app').innerHTML='<section class="panel"><h2>HYPER login required</h2><p>पहले HYPER app में इसी email से login करें.</p><a href="/">← HYPER App पर जाएँ</a></section>';return}try{let me=await api('/admin/session');document.getElementById('loginPanel').innerHTML='<h2>🟢 HYPER Admin</h2><p>Logged in as <b>'+esc(me.user.email)+'</b></p><button class="secondary" onclick="load()">Open Dashboard</button>';load()}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Admin access नहीं है</h2><p>'+esc(e.message)+'</p><a href="/">← HYPER App</a></section>'}}
function render(x){let t=x.totals||{},w=x.wallet||{};document.getElementById('app').innerHTML=`<section class="grid"><div class="card"><small>Total ad revenue</small><strong>${money(t.gross)}</strong></div><div class="card"><small>Creator 70%</small><strong>${money(t.creator)}</strong></div><div class="card"><small>HYPER Admin 30%</small><strong>${money(t.hyper_admin)}</strong></div><div class="card"><small>Admin balance</small><strong>${money(w.balance)}</strong></div></section><section class="panel"><h2>🟢 HYPER Admin Wallet</h2><div class="split"><div class="card"><small>Available Admin Balance</small><strong>${money(w.balance)}</strong></div><div class="card"><small>Lifetime Admin Earnings</small><strong>${money(w.lifetime_earned)}</strong></div></div><p class="note">HYPER का 30% share यहाँ अलग wallet में रहता है. Creator का 70% अलग creator wallet में रहता है.</p></section><section class="panel"><h2>Money Split</h2><div class="split"><div class="card"><small>Creator</small><strong>70%</strong><div>${money(t.creator)}</div></div><div class="card"><small>HYPER Admin</small><strong>30%</strong><div>${money(t.hyper_admin)}</div></div></div></section><section class="panel"><div class="controls"><h2 style="margin:0;flex:1">Creator Revenue</h2><button class="secondary" onclick="load()">↻ Refresh</button></div><div class="tableWrap"><table><thead><tr><th>Creator</th><th>Gross</th><th>Creator 70%</th><th>HYPER 30%</th><th>Impressions</th><th>Action</th></tr></thead><tbody>${(x.creators||[]).map(c=>`<tr><td><b>${esc(c.channel_name)}</b><br><small>@${esc(c.username)}</small></td><td>${money(c.gross)}</td><td>${money(c.creator)}</td><td>${money(c.hyper_admin)}</td><td>${fmt(c.impressions)}</td><td><button onclick="enable(${c.id})">Enable 70/30</button></td></tr>`).join('')||'<tr><td colspan="6">No verified revenue yet.</td></tr>'}</tbody></table></div></section>`}
async function enable(id){try{await api('/admin/monetization/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,enabled:true})});alert('Creator enabled: 70% / 30%');load()}catch(e){alert(e.message)}}
async function load(){try{render(await api('/admin/monetization/summary'))}catch(e){document.getElementById('app').innerHTML='<section class="panel"><h2>Access failed</h2><p>'+esc(e.message)+'</p></section>'}}
openAdmin();
</script></body></html>
